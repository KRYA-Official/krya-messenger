<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive.com</title>

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:#fff;
}

/* Glow Border */
.frame{
position:fixed;
inset:10px;
border-radius:18px;
border:2px solid #00ffd5;
box-shadow:0 0 30px #00ffd5;
pointer-events:none;
}

/* Header */
.header{
text-align:center;
padding:15px;
font-size:26px;
font-weight:bold;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.2);
}

/* Ticker */
.ticker{
margin:10px;
border-radius:10px;
overflow:hidden;
border:1px solid #ffcc00;
}
.ticker p{
white-space:nowrap;
padding-left:100%;
animation:scroll 18s linear infinite;
}
@keyframes scroll{to{transform:translateX(-100%)}}

/* Grid */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

/* Card */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:15px;
padding:15px;
text-align:center;
transition:0.3s;
border:1px solid rgba(255,255,255,0.2);
position:relative;
}
.card:hover{
transform:translateY(-8px) scale(1.03);
}

/* Badge */
.badge{
position:absolute;
top:10px;
left:10px;
background:linear-gradient(45deg,#ff0000,#ff7300);
padding:5px 10px;
border-radius:6px;
font-size:12px;
}

/* Image */
.card img{
width:100%;
border-radius:10px;
}

/* Text */
.card h3{
margin:10px 0;
}
.price{
color:#00ffd5;
font-size:20px;
font-weight:bold;
}

/* Buttons */
.btn{
display:block;
margin-top:10px;
padding:10px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}
.buy{
background:linear-gradient(45deg,#ff9800,#ff5722);
}
.chat{
background:linear-gradient(45deg,#25D366,#00ff99);
}
.btn:hover{
transform:scale(1.08);
}

/* Floating Button */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
font-size:18px;
cursor:pointer;
}

/* Popup */
.popup{
position:fixed;
bottom:80px;
left:20px;
background:#111;
padding:10px 15px;
border-radius:10px;
display:none;
font-size:14px;
}
</style>
</head>

<body>

<div class="frame"></div>

<div class="header">🚀 KryaLive.com</div>

<div class="ticker">
<p>🔥 Premium Digital Services | ⚡ Fast Delivery | 💬 Instant Support | 🎯 Limited Offer</p>
</div>

<div class="container" id="container"></div>

<div class="popup" id="popup"></div>

<div class="float" onclick="alert('Chat open logic here')">💬</div>

<script>

const services=[
"Website","Firebase","App Dev","SEO","Logo","Bug Fix","Hosting","Speed","UI Design"
];

let html="";
services.forEach((s,i)=>{
html+=`
<div class="card">
<div class="badge">🔥 HOT</div>
<img src="https://picsum.photos/300?random=${i}">
<h3>${s}</h3>
<div class="price">₹${(i+1)*500}</div>
<a class="btn buy">Buy Now</a>
<a class="btn chat">Chat</a>
</div>`;
});

document.getElementById("container").innerHTML=html;

/* Fake Popup */
let names=["Rahul","Amit","Vikas","Ankit"];
setInterval(()=>{
let n=names[Math.floor(Math.random()*names.length)];
let popup=document.getElementById("popup");
popup.innerText=n+" ने अभी service खरीदी";
popup.style.display="block";
setTimeout(()=>popup.style.display="none",3000);
},5000);

</script>

</body>
</html>
