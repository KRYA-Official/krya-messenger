<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive.com</title>

<style>
body {
    margin:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* 3D Border Container */
.wrapper {
    margin:10px;
    padding:15px;
    border-radius:15px;
    border:3px solid #00ffcc;
    box-shadow:0 0 20px #00ffcc;
}

/* Header */
.header {
    text-align:center;
    font-size:26px;
    padding:10px;
    border:2px solid #00ffcc;
    border-radius:10px;
    box-shadow:0 0 10px #00ffcc;
}

/* Ticker */
.ticker {
    margin-top:10px;
    border:2px solid #ffcc00;
    border-radius:10px;
    overflow:hidden;
}
.ticker p {
    white-space:nowrap;
    display:inline-block;
    padding-left:100%;
    animation:scroll 15s linear infinite;
}
@keyframes scroll {
    from {transform:translateX(0);}
    to {transform:translateX(-100%);}
}

/* Services */
.services {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}
.card {
    width:260px;
    padding:20px;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    text-align:center;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.2);
}
.card:hover {
    transform:scale(1.05);
}

.price {
    color:#00ffcc;
    font-weight:bold;
}

/* Buttons */
.btn {
    display:block;
    margin-top:10px;
    padding:10px;
    border-radius:20px;
    text-decoration:none;
    font-weight:bold;
}

/* WhatsApp */
.whatsapp-btn {
    background:#25D366;
    color:white;
}

/* Payment */
.pay-btn {
    background:#ff9800;
    color:black;
}

/* Share */
.share-btn {
    background:#2196f3;
    color:white;
}

/* Floating WhatsApp */
.whatsapp-float {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    padding:15px;
    border-radius:50%;
    color:white;
    text-decoration:none;
}

/* Live & Review */
.live, .review {
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">🚀 KryaLive.com</div>

<!-- Ticker -->
<div class="ticker">
<p>🔥 आज का ऑफर: Website ₹2999 | ⚡ Limited Slots | 💬 WhatsApp Support | 🎯 आज ही बुक करें</p>
</div>

<!-- Services -->
<div class="services">

<p class="price">₹999</p>

<a class="btn whatsapp-btn" href="https://wa.me/916379403821?text=नमस्ते%20KryaLive%20मुझे%20Firebase%20Setup%20चाहिए">WhatsApp</a>

<a class="btn pay-btn" href="upi://pay?pa=93690mukeshkumar@axl&pn=Mukesh&cu=INR">Pay Now</a>

<a class="btn share-btn" onclick="shareNow()">Share</a>

</div>

<div class="card">
<h3>Website Development</h3>
<p class="price">₹2,999</p>

<a class="btn whatsapp-btn" href="https://wa.me/916379403821?text=नमस्ते%20KryaLive%20मुझे%20Website%20बनवानी%20है">WhatsApp</a>

<a class="btn pay-btn" href="upi://pay?pa=93690mukeshkumar@axl&pn=Mukesh&cu=INR">Pay Now</a>

<a class="btn share-btn" onclick="shareNow()">Share</a>

</div>

<div class="card">
<h3>Tech Support</h3>
<p class="price">₹499</p>

<a class="btn whatsapp-btn" href="https://wa.me/916379403821?text=नमस्ते%20KryaLive%20मुझे%20Tech%20Support%20चाहिए">WhatsApp</a>

<a class="btn pay-btn" href="upi://pay?pa=93690mukeshkumar@axl&pn=Mukesh&cu=INR">Pay Now</a>

<a class="btn share-btn" onclick="shareNow()">Share</a>

</div>

</div>

<!-- Live Users -->
<div class="live">
👥 Live Users: <span id="users">30</span>
</div>

<!-- Reviews -->
<div class="review" id="review">
⭐ बहुत बढ़िया सर्विस!
</div>

</div>

<!-- Floating WhatsApp -->
<a href="https://wa.me/916379403821?text=नमस्ते%20KryaLive%20मुझे%20आपकी%20service%20चाहिए" class="whatsapp-float">💬</a>

<script>
// Live Users
setInterval(()=>{
document.getElementById("users").innerText=Math.floor(Math.random()*50)+20;
},3000);

// Reviews
let reviews=[
"⭐ बहुत बढ़िया सर्विस!",
"🔥 काम जल्दी हुआ",
"💯 Trusted service",
"⚡ Instant support",
"👍 पैसे वसूल"
];
let i=0;
setInterval(()=>{
document.getElementById("review").innerText=reviews[i];

// Share Function
function shareNow(){

if(navigator.share){
navigator.share({
title:"KryaLive",
text:text,
url:window.location.href
});
}else{
window.open("https://wa.me/?text="+encodeURIComponent(text+" "+window.location.href));

</script>

</body>
</html>
