<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Smart Business Hub</title>
    
    <meta property="og:title" content="KRYALIVE | Smart Business Hub">
    <meta property="og:description" content="Kryalive.com: घर बैठे प्रोफेशनल डिजिटल सर्विसेज। ईमानदारी हमारी पहचान।">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg">
    <meta property="og:url" content="https://kryalive.com">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ff4757; --gold: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; height: 100vh; }
        
        header, .bottom-nav { display: none !important; }
        .view { display: none !important; }
        .view.active { display: block !important; animation: slideUp 0.4s ease; }

        header { background: white; padding: 10px 20px; border-bottom: 1px solid #eee; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .brand { font-size: 20px; font-weight: 800; }
        .brand span { color: var(--primary); }
        
        main { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card { background: #fff; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; background: #f8fafc; outline: none; font-family: inherit; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }

        /* Service Cards */
        .service-item { border-radius: 24px; overflow: hidden; background: #fff; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transition: 0.3s; }
        .service-image-container { width: 100%; overflow: hidden; background: #f1f5f9; }
        .service-img { width: 100%; height: 220px; object-fit: cover; display: block; }
        @media (min-width: 769px) { .service-img { height: 300px; } }

        /* Secure Visiting Card */
        #v-card { width: 100%; max-width: 350px; height: 200px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 15px; position: relative; margin: 0 auto; overflow: hidden; color: white; text-align: left; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
        .card-photo { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 40px; font-weight: 900; color: rgba(255,255,255,0.03); white-space: nowrap; pointer-events: none; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 10px 0 25px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 700; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header">
    <div class="brand-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" class="logo-img">
        <div class="brand">KRYA<span>LIVE</span></div>
    </div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; padding: 5px 12px; border-radius: 20px;">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div style="text-align: center; padding-top: 80px;">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" style="width: 110px; height: 110px; border-radius: 50%; margin-bottom: 20px; border: 3px solid var(--primary);">
            <h2 style="font-weight: 800;">नमस्ते!</h2>
            <button class="btn" id="login-btn" style="background: white; border: 1.5px solid #eee; width: 85%; margin: 30px auto;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google लॉगिन
            </button>
        </div>
    </section>

    <section id="view-verify" class="view">
        <div class="card">
            <h3>पार्टनर वेरिफिकेशन</h3>
            <p style="font-size: 12px; color: gray; margin-bottom: 15px;">KRYA ID डालकर पार्टनर की सत्यता जाँचें।</p>
            <input type="text" id="verify-input" placeholder="जैसे: KRYA-1234">
            <button class="btn btn-primary" onclick="verifyMember()"><i class="fas fa-search"></i> अभी जाँचें</button>
            <div id="verify-result" style="margin-top: 20px; text-align: center; display: none;"></div>
        </div>
    </section>

    <section id="view-store" class="view">
        <h3 id="user-greet" style="font-weight: 800;">नमस्ते!</h3>
        <div id="store-list" style="margin-top: 20px;"></div>
    </section>

    <section id="view-orders" class="view">
        <h3 style="margin-bottom: 20px;">मेरे ऑर्डर्स</h3>
        <div id="user-orders-display"></div>
    </section>

    <section id="view-profile" class="view">
        <div class="card" style="text-align: center;">
            <img id="u-photo" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 10px;">
            <h4 id="u-name">Name</h4>
            
            <div id="v-card" style="margin: 20px auto;">
                <div class="watermark">KRYA OFFICIAL</div>
                <div style="padding: 15px; display: flex; gap: 12px; align-items: center; height: 100%; position: relative; z-index: 2;">
                    <img id="card-u-photo" src="" class="card-photo">
                    <div style="flex: 1;">
                        <h2 id="card-u-name" style="font-size: 15px; margin: 0; font-weight: 800;">NAME</h2>
                        <p style="font-size: 8px; color: var(--primary); font-weight: 600; margin-bottom: 5px;">OFFICIAL PARTNER</p>
                        <div style="font-size: 9px; opacity: 0.8;">
                            ID: <span id="card-u-id" style="font-family: monospace; color: var(--primary);">---</span><br>
                            Kryalive.com
                        </div>
                    </div>
                    <div id="qrcode" style="background: white; padding: 3px; border-radius: 5px; width: 55px; height: 55px;">
                        <img id="qr-img" src="" style="width: 100%; height: 100%;">
                    </div>
                </div>
            </div>
            
            <button class="btn" onclick="downloadCard()" style="background: #f1f5f9; color: #475569; margin-bottom: 10px; font-size: 12px;">कार्ड सेव करें</button>
            <button class="btn" style="background: #fee2e2; color: #ef4444;" id="logout-btn">लॉगआउट</button>
        </div>
    </section>

    <section id="view-owner" class="view">
        <div class="stat-grid">
            <div class="stat-card"><h2><i class="fas fa-shopping-cart"></i></h2><h2 id="total-ord">0</h2><p>ऑर्डर्स</p></div>
            <div class="stat-card"><h2><i class="fas fa-wallet"></i></h2><h2 id="total-rev">₹0</h2><p>राजस्व</p></div>
        </div>
        <div class="card">
            <h3>सर्विस पब्लिश करें</h3>
            <input type="text" id="s-name" placeholder="नाम">
            <input type="number" id="s-price" placeholder="कीमत">
            <input type="text" id="s-img" placeholder="फोटो लिंक">
            <textarea id="s-desc" placeholder="जानकारी..."></textarea>
            <button class="btn btn-primary" id="btn-publish">पब्लिश करें</button>
        </div>
        <div id="admin-product-list"></div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav">
    <button class="nav-item active" onclick="openMain()"><i class="fas fa-store"></i><span>Store</span></button>
    <button class="nav-item" onclick="nav('verify')"><i class="fas fa-shield-alt"></i><span>Verify</span></button>
    <button class="nav-item" onclick="nav('orders')"><i class="fas fa-box"></i><span>Orders</span></button>
    <button class="nav-item" onclick="nav('profile')"><i class="fas fa-user-circle"></i><span>Profile</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, where, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    const WHATSAPP_NUMBER = "916379403821";

    let user = null, isOwner = false;

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
    };

    window.openMain = () => isOwner ? nav('owner') : nav('store');

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        if(u) {
            user = u;
            isOwner = u.email === OWNER_EMAIL;
            const kryaID = "KRYA-" + u.uid.substring(0, 5).toUpperCase();
            
            await setDoc(doc(db, "partners", u.uid), { 
                name: u.displayName, 
                email: u.email, 
                kryaID: kryaID, 
                photo: u.photoURL,
                joined: serverTimestamp() 
            }, { merge: true });

            document.getElementById('u-name').innerText = u.displayName;
            document.getElementById('u-photo').src = u.photoURL;
            document.getElementById('card-u-name').innerText = u.displayName;
            document.getElementById('card-u-photo').src = u.photoURL;
            document.getElementById('card-u-id').innerText = kryaID;
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${kryaID}`;
            
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('app-nav').style.display = 'flex';
            openMain();
            loadStore();
        } else {
            nav('auth');
        }
    });

    window.verifyMember = async () => {
        const id = document.getElementById('verify-input').value.trim().toUpperCase();
        const resDiv = document.getElementById('verify-result');
        resDiv.style.display = 'block';
        resDiv.innerHTML = "जाँच की जा रही है...";

        const q = query(collection(db, "partners"), where("kryaID", "==", id));
        onSnapshot(q, snap => {
            if(snap.empty) {
                resDiv.innerHTML = `<i class="fas fa-times-circle" style="color:red; font-size:40px;"></i><br><b>नकली आईडी!</b><br>यह पार्टनर हमारे साथ नहीं है।`;
            } else {
                const d = snap.docs[0].data();
                resDiv.innerHTML = `<i class="fas fa-check-circle" style="color:var(--primary); font-size:40px;"></i><br><b>Verified Partner</b><br>${d.name}<br>ईमानदारी की पहचान!`;
            }
        });
    };

    window.downloadCard = () => {
        html2canvas(document.getElementById('v-card'), {useCORS:true}).then(canvas => {
            const a = document.createElement('a');
            a.download = 'KRYA-Card.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    };

    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                list.innerHTML += `
                    <div class="service-item">
                        <div class="service-image-container"><img src="${s.img}" class="service-img"></div>
                        <div style="padding:15px;">
                            <h4>${s.name}</h4>
                            <p style="color:var(--primary); font-weight:800;">₹${s.price}</p>
                            <button class="btn btn-primary" onclick="buyNow('${s.name}', '${s.price}')">अभी खरीदें</button>
                        </div>
                    </div>`;
            });
        });
    }

    window.buyNow = (n, p) => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=नमस्ते KRYA! मैंने ऑर्डर किया है: ${n}`, '_blank');
    };

    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const price = document.getElementById('s-price').value;
        const img = document.getElementById('s-img').value;
        const desc = document.getElementById('s-desc').value;
        await addDoc(collection(db, "services"), { name, price, img, desc, createdAt: serverTimestamp() });
        Toastify({text: "सफल!"}).showToast();
    };
</script>
</body>
</html>
