    <style>
        /* --- MASTERCLASS CSS ARCHITECTURE --- */
        :root { 
            --bg-main: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #10b981; --primary-hover: #059669; --accent: #3b82f6; --danger: #ef4444; --warning: #f59e0b;
            --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Dark Mode Setup (Can be toggled via JS) */
        .dark-mode {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7); --glass-border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-main); overflow: hidden; height: 100vh; transition: background 0.3s ease; }

        /* Loader & Splash */
        #loader { position: fixed; inset: 0; background: var(--bg-main); z-index: 10000; display: flex; justify-content: center; align-items: center; transition: 0.5s; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Header Glassmorphism */
        header { 
            position: sticky; top: 0; z-index: 1000; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo-wrap { display: flex; align-items: center; gap: 12px; }
        .logo-wrap img { width: 44px; height: 44px; border-radius: 14px; box-shadow: var(--shadow-sm); border: 2px solid var(--primary); }
        .brand-title { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--text-main), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Main Viewport */
        main { height: calc(100vh - 77px); overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }

        /* Views & Routing */
        .view-container { display: none; animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding-bottom: 100px; }
        .view-container.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* Cards & Forms */
        .master-card { background: var(--bg-card); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-xl); border: 1px solid var(--glass-border); margin-bottom: 24px; transition: transform 0.3s; }
        .master-card:hover { transform: translateY(-5px); }
        
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 16px; top: 18px; color: var(--text-muted); }
        .master-input { width: 100%; padding: 16px 16px 16px 45px; border-radius: 16px; border: 2px solid transparent; background: rgba(0,0,0,0.03); color: var(--text-main); font-size: 15px; transition: 0.3s; outline: none; }
        .master-input:focus { border-color: var(--primary); background: transparent; }

        /* Buttons with Ripple */
        .btn-master { 
            width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }
        .btn-primary:active { transform: scale(0.96); box-shadow: none; }
        .btn-dark { background: var(--text-main); color: var(--bg-main); }

        /* Store UI - Premium Grid */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .product-card { background: var(--bg-card); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.05); }
        .img-wrapper { position: relative; width: 100%; height: 240px; overflow: hidden; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .img-wrapper img { transform: scale(1.08); }
        .price-badge { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.8); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; backdrop-filter: blur(5px); }

        /* Skeleton Loading */
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Admin Chart Container */
        .chart-container { width: 100%; height: 200px; background: var(--bg-card); border-radius: 20px; padding: 15px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }

        /* Bottom Navigation Dock */
        .nav-dock { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px;
            background: var(--text-main); border-radius: 30px; display: flex; justify-content: space-around; padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 1000;
        }
        .dock-item { color: var(--text-muted); background: transparent; border: none; padding: 12px 20px; border-radius: 20px; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .dock-item.active { background: var(--primary); color: white; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(16,185,129,0.4); }

        /* Utility */
        .badge { background: var(--warning); color: white; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; }
    </style>
</head>
<body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Architecture Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // Core State Management
    const STATE = {
        user: null,
        isOwner: false,
        ownerEmail: "krya.global@gmail.com",
        waNumber: "916379403821"
    };

    // UI Controller
    const UI = {
        showToast: (msg, type = "success") => {
            const color = type === "success" ? "#10b981" : "#ef4444";
            Toastify({text: msg, duration: 3000, gravity: "top", position: "center", style: {background: color, borderRadius: "12px", padding: "14px 24px", fontWeight: "600", boxShadow: "0 10px 20px rgba(0,0,0,0.15)"}}).showToast();
        },
        toggleLoader: (show) => document.getElementById('loader').style.opacity = show ? '1' : '0',
        initChart: () => {
            if(!STATE.isOwner) return;
            const ctx = document.getElementById('revenueChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ label: 'Sales Activity', data: [12, 19, 3, 5, 2, 3, 9], borderColor: '#10b981', tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    };

    // Advanced Routing System
    window.Router = {
        navigate: (path) => {
            if(path === 'store' && STATE.isOwner) path = 'admin'; // Redirect owner to admin
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${path}`).classList.add('active');
            
            // Highlight dock icon
            const dockMap = {'store': 0, 'admin': 0, 'orders': 1, 'profile': 2};
            document.querySelectorAll('.dock-item')[dockMap[path]].classList.add('active');
            
            if(path === 'orders') DB.fetchOrders();
        }
    };

    // Database Architecture
    const DB = {
        publishService: async () => {
            const data = {
                name: document.getElementById('adm-name').value,
                price: document.getElementById('adm-price').value,
                img: document.getElementById('adm-img').value,
                createdAt: serverTimestamp()
            };
            if(!data.name || !data.price) return UI.showToast("डेटा अधूरा है", "error");
            await addDoc(collection(db, "services"), data);
            UI.showToast("सर्विस डिप्लॉय हो गई!");
            document.querySelectorAll('.master-input').forEach(i => i.value = '');
        },
        fetchServices: () => {
            onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
                const storeGrid = document.getElementById('store-grid');
                const adminList = document.getElementById('admin-list');
                storeGrid.innerHTML = ''; if(STATE.isOwner) adminList.innerHTML = '';
                
                snap.forEach(doc => {
                    const s = doc.data();
                    storeGrid.innerHTML += `
                        <div class="product-card">
                            <div class="img-wrapper"><div class="price-badge">₹${s.price}</div><img src="${s.img || 'https://via.placeholder.com/400'}" loading="lazy"></div>
                            <div style="padding: 24px;">
                                <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 15px;">${s.name}</h3>
                                <button class="btn-master btn-primary" onclick="DB.createOrder('${s.name}', '${s.price}')">सुरक्षित ऑर्डर <i class="fas fa-shield-alt"></i></button>
                            </div>
                        </div>`;
                    if(STATE.isOwner) {
                        adminList.innerHTML += `<div class="master-card" style="display:flex; justify-content:space-between; align-items:center; padding:16px;">
