<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - Jio Mukesh</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // आपकी Public Key यहाँ सेट है
            emailjs.init("msEHlMxmjjBbBoqnn");
        })();
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        .message { margin-top: 15px; font-size: 14px; }
        #otpSection { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>KRYA Messenger</h2>
    
    <div id="emailSection">
        <p>लॉगिन करने के लिए अपना ईमेल डालें</p>
        <input type="email" id="userEmail" placeholder="example@gmail.com" required>
        <button onclick="sendOTP()">OTP भेजें</button>
    </div>

    <div id="otpSection">
        <p>आपके ईमेल पर भेजा गया कोड यहाँ डालें</p>
        <input type="number" id="otpInput" placeholder="6 अंकों का कोड">
        <button onclick="verifyOTP()">वेरिफाई करें</button>
    </div>

    <div id="msg" class="message"></div>
</div>

<script>
    let generatedOTP;

    function sendOTP() {
        const email = document.getElementById('userEmail').value;
        const msgDiv = document.getElementById('msg');
        
        if(!email) {
            msgDiv.innerText = "कृपया सही ईमेल डालें।";
            return;
        }

        msgDiv.innerText = "भेजा जा रहा है...";
        generatedOTP = Math.floor(100000 + Math.random() * 900000);

        const templateParams = {
            email: email,
            otp: generatedOTP
        };

        // आपकी Service ID और Template ID यहाँ सेट है
        emailjs.send('service_gls676h', 'template_6touhl4', templateParams)
            .then(function(response) {
               msgDiv.style.color = "green";
               msgDiv.innerText = "OTP आपके ईमेल पर भेज दिया गया है!";
               document.getElementById('emailSection').style.display = 'none';
               document.getElementById('otpSection').style.display = 'block';
            }, function(error) {
               msgDiv.style.color = "red";
               msgDiv.innerText = "भेजने में विफल: " + JSON.stringify(error);
            });
    }

    function verifyOTP() {
        const userInput = document.getElementById('otpInput').value;
        const msgDiv = document.getElementById('msg');

        if(userInput == generatedOTP) {
            msgDiv.style.color = "green";
            msgDiv.innerText = "सफलतापूर्वक लॉगिन हो गया! KRYA में आपका स्वागत है।";
            // यहाँ आप यूजर को अपने मेन पेज पर भेज सकते हैं
        } else {
            msgDiv.style.color = "red";
            msgDiv.innerText = "गलत OTP, कृपया फिर से प्रयास करें।";
        }
    }
</script>

</body>
</html>
