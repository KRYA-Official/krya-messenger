<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - सच्चाई और एकता</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        .header { background: var(--card); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #334155; }
        .brand-text { font-weight: 900; color: var(--primary); font-size: 24px; letter-spacing: 2px; }
        
        /* Fixed Buttons & Search */
        .search-container { padding: 10px 15px; }
        .search-bar { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }

        #main-content { height: calc(100vh - 160px); overflow-y: auto; padding: 0 15px 80px; }

        /* Slider */
        .slider-box { width: 100%; height: 130px; overflow: hidden; border-radius: 15px; margin: 10px 0; border: 1px solid var(--primary); background: #1e293b; position: relative; }
        .slides-track { display: flex; width: 1500%; height: 100%; transition: transform 0.6s ease; }
        .single-slide { width: 6.666%; display: flex; flex-direction: column; justify-content: center; padding: 15px; text-align: center; }

        /* Action Buttons Grid */
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .btn-action { background: var(--card); border: 1px solid #334155; padding: 12px 5px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .btn-action:active { background: var(--primary); color: #000; transform: scale(0.95); }
        .btn-action i { font-size: 18px; color: var(--primary); margin-bottom: 5px; }
        .btn-action:active i { color: #000; }
        .btn-action span { font-size: 10px; display: block; }

        /* Market List */
        .user-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        
        /* Chat Overlays */
        .chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .chat-header { background: var(--card); padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #334155; }
        .msg-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { background: var(--card); padding: 15px; display: flex; gap: 10px; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 900; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="app-main">
    <div class="header">
        <div class="brand-text">KRYA</div>
        <div style="font-size: 12px; color: var(--primary); border: 1px solid var(--primary); padding: 3px 10px; border-radius: 15px;">@Mukesh</div>
    </div>

    <div class="search-container">
        <input type="text" class="search-bar" id="searchUser" placeholder="सच्चे भारतीयों को खोजें..." onkeyup="filterUsers()">
    </div>

    <div id="main-content">
        <div class="slider-box">
            <div class="slides-track" id="slider">
                <div class="single-slide"><h3>ईमानदारी 💎</h3><p>सच्चाई की राह ही सफलता की राह है।</p></div>
                <div class="single-slide"><h3>KRYA मिशन 🚀</h3><p>बांका का गौरव, सच्चाई और एकता।</p></div>
                <div class="single-slide"><h3>सुरक्षित चैट 🔐</h3><p>आपका डेटा और बातें पूरी तरह गुप्त हैं।</p></div>
                </div>
        </div>

        <div class="action-grid">
            <div class="btn-action" onclick="openGlobalChat()"><i class="fas fa-globe"></i><span>ग्लोबल चैट</span></div>
            <div class="btn-action" onclick="payVIP()"><i class="fas fa-crown"></i><span>VIP अर्निंग</span></div>
            <div class="btn-action" onclick="shareKRYA()"><i class="fas fa-share-alt"></i><span>शेयर ऐप</span></div>
            <div class="btn-action" onclick="contactSupport()"><i class="fas fa-headset"></i><span>सपोर्ट</span></div>
        </div>

        <h4 style="margin: 10px 0; font-size: 14px; color: var(--primary);">लाइव मार्केट ●</h4>
        <div id="user-list">
            </div>
    </div>

    <div id="global-chat" class="chat-overlay">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat('global-chat')"></i>
            <b>ग्लोबल चैट (KRYA परिवार) 🇮🇳</b>
        </div>
        <div class="msg-box" id="global-msgs"></div>
        <div class="input-area">
            <input type="text" class="search-bar" id="g-input" placeholder="सबको कुछ बताएं...">
            <button onclick="sendGlobalMsg()" style="background:var(--primary); border:none; padding:10px 20px; border-radius:10px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="private-chat" class="chat-overlay">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat('private-chat')"></i>
            <b id="chat-partner-name">प्राइवेट चैट</b>
        </div>
        <div class="msg-box" id="p-msgs"></div>
        <div class="input-area">
            <input type="text" class="search-bar" id="p-input" placeholder="मैसेज लिखें...">
            <button onclick="sendPrivateMsg()" style="background:var(--primary); border:none; padding:10px 20px; border-radius:10px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i><br>होम</div>
        <div class="nav-item" onclick="openGlobalChat()"><i class="fas fa-comments"></i><br>चैट</div>
        <div class="nav-item" onclick="contactSupport()"><i class="fas fa-user-shield"></i><br>सपोर्ट</div>
    </div>
</div>

<script>
    // Slider Logic
    let sIdx = 0;
    setInterval(() => {
        const track = document.getElementById('slider');
        if(track) { sIdx = (sIdx + 1) % 3; track.style.transform = `translateX(-${(sIdx * 100) / 15}%)`; }
    }, 4000);

    // Search/Filter Logic
    function filterUsers() {
        let input = document.getElementById('searchUser').value.toLowerCase();
        let cards = document.getElementsByClassName('user-card');
        for (let i = 0; i < cards.length; i++) {
            if (!cards[i].innerText.toLowerCase().includes(input)) cards[i].style.display = "none";
            else cards[i].style.display = "flex";
        }
    }

    // Chat Functions
    function openGlobalChat() { document.getElementById('global-chat').style.display = 'flex'; }
    function openPrivateChat(name) { 
        document.getElementById('chat-partner-name').innerText = name;
        document.getElementById('private-chat').style.display = 'flex'; 
    }
    function closeChat(id) { document.getElementById(id).style.display = 'none'; }

    // Placeholder Data for Market
    const users = [
        { name: "Pramod Pandit", skill: "कारीगर", vip: true },
        { name: "Rajesh Kumar", skill: "दुकानदार", vip: false },
        { name: "Amit Singh", skill: "मजदूर", vip: false }
    ];

    const list = document.getElementById('user-list');
    users.forEach(u => {
        list.innerHTML += `
            <div class="user-card" onclick="openPrivateChat('${u.name}')">
                <div>
                    <b>${u.name} ${u.vip ? '✅' : ''}</b><br>
                    <small style="color:#94a3b8;">${u.skill}</small>
                </div>
                <i class="fas fa-comment-dots" style="color:var(--primary)"></i>
            </div>
        `;
    });

    // Action Functions
    function payVIP() { window.location.href = "upi://pay?pa=93690mukeshkumar@axl&pn=KRYA&am=99"; }
    function contactSupport() { window.open("https://wa.me/916379403821", "_blank"); }
    function shareKRYA() { navigator.share({ title: 'KRYA', url: window.location.href }); }
</script>
</body>
</html>
