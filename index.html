<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - प्रोफाइल एडिशन</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1120; color: white; }
        .auth-box { background: #1e293b; padding: 30px; border-radius: 20px; width: 85%; max-width: 400px; margin: 100px auto; text-align: center; border: 2px solid #fbbf24; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0b1120; color: white; outline: none; }
        .auth-btn { background: #fbbf24; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; }
        .auth-btn:hover { background: #eab308; }
        .container { max-width: 500px; margin: auto; background: #0f172a; height: 100vh; display: flex; flex-direction: column; position: relative; }
        .app-header { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fbbf24; position: sticky; top: 0; z-index: 1000; }
        .brand-name { font-size: 1.4rem; font-weight: bold; color: #fbbf24; letter-spacing: 2px; text-transform: uppercase; }
        .header-icon { color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .header-icon:hover { color: #fbbf24; }
        #feed-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; scrollbar-width: thin; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; margin-bottom: 10px; position: relative; display: flex; flex-direction: column; }
        .sent { align-self: flex-end; background: #fbbf24 !important; color: #0f172a !important; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: #1e293b !important; color: white !important; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .input-area { background: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        textarea { flex: 1; background: #0b1120; border: 1px solid #334155; color: white; padding: 10px; border-radius: 10px; resize: none; height: 45px; }
        .send-btn { background: #fbbf24; border: none; width: 55px; border-radius: 10px; color: #0f172a; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-screen" class="auth-box">
    <h2 id="auth-title" style="color:#fbbf24; margin-bottom: 15px;">KRYA Messenger</h2>
    <input type="text" id="full-name" placeholder="आपका पूरा नाम">
    <input type="email" id="email-field" placeholder="ईमेल आईडी">
    <input type="password" id="pass-field" placeholder="पासवर्ड">
    <button class="auth-btn" id="signup-btn">साइन-अप करें</button>
    <button class="auth-btn" style="background:#334155; margin-top:10px; color:white;" id="login-btn">लॉगिन</button>
</div>

<div id="handle-screen" class="auth-box hidden">
    <h2 style="color:#fbbf24;">यूनिक हैंडल चुनें</h2>
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">अपनी पहचान बनाएँ (उदा: @mukesh)</p>
    <input type="text" id="username-field" placeholder="username">
    <button class="auth-btn" id="save-handle-btn">प्रोफ़ाइल सेव करें</button>
</div>

<div id="main-app" class="container hidden">
    <div class="app-header">
        <i class="fas fa-bars header-icon" id="menu-btn"></i>
        <div class="brand-name">KRYA</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <i class="fas fa-sign-out-alt header-icon" id="logout-btn" style="color: #ff4d4d;"></i>
        </div>
    </div>
    <div id="feed-list"></div>
    <div class="input-area">
        <textarea id="msgInput" placeholder="संदेश लिखें..."></textarea>
        <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCtSIGAybHuIga19QpPRS1egRrsbhvJV2c",
        authDomain: "krya-94e55.firebaseapp.com",
        projectId: "krya-94e55",
        storageBucket: "krya-94e55.firebasestorage.app",
        messagingSenderId: "1025043894227",
        appId: "1:1025043894227:web:fa57c21ed2f6381a792926"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- साइन-अप ---
    document.getElementById('signup-btn').addEventListener('click', async () => {
        const name = document.getElementById('full-name').value;
        const email = document.getElementById('email-field').value.trim();
        const pass = document.getElementById('pass-field').value;
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "users", userCred.user.uid), { fullName: name, email: email, uid: userCred.user.uid });
        } catch (e) { alert("साइन-अप एरर: " + e.message); }
    });

    // --- लॉगिन ---
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email-field').value.trim();
        const pass = document.getElementById('pass-field').value;
        try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("लॉगिन एरर: " + e.message); }
    });

    // --- हैंडल सेव करना (नया) ---
    document.getElementById('save-handle-btn').addEventListener('click', async () => {
        const handle = document.getElementById('username-field').value.trim().toLowerCase();
        if (handle && auth.currentUser) {
            const handleRef = doc(db, "handles", handle);
            const snap = await getDoc(handleRef);
            if (snap.exists()) { alert("यह हैंडल पहले से बुक है!"); return; }
            
            await setDoc(handleRef, { uid: auth.currentUser.uid });
            await setDoc(doc(db, "users", auth.currentUser.uid), { handle: "@" + handle }, { merge: true });
            location.reload();
        }
    });

    // --- मैसेज भेजना ---
    document.getElementById('send-btn').addEventListener('click', async () => {
        const text = document.getElementById('msgInput').value;
        if (text.trim() !== "" && auth.currentUser) {
            const userSnap = await getDoc(doc(db, "users", auth.currentUser.uid));
            const userHandle = userSnap.data()?.handle || auth.currentUser.email.split('@')[0];
            
            await addDoc(collection(db, "messages"), {
                text: text,
                user: userHandle,
                uid: auth.currentUser.uid,
                createdAt: serverTimestamp()
            });
            document.getElementById('msgInput').value = '';
        }
    });

    // --- स्थिति चेक (AUTH STATE) ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists() && userSnap.data().handle) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('handle-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                loadMessages();
            } else {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('handle-screen').classList.remove('hidden');
            }
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }
    });

    function loadMessages() {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const isMe = (data.uid === auth.currentUser.uid);
                const card = document.createElement('div');
                card.className = `msg ${isMe ? 'sent' : 'received'}`;
                card.innerHTML = `<small style="font-weight:bold; color:${isMe ? '#0f172a' : '#fbbf24'};">${data.user}</small><p>${data.text}</p>`;
                feedList.appendChild(card);
            });
            feedList.scrollTop = feedList.scrollHeight;
        });
    }

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
