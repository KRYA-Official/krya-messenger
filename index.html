<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - बांका का सुपर ऐप</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root { --primary: #fbbf24; --success: #22c55e; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .hidden { display: none !important; }

        .auth-content { margin: auto; width: 100%; text-align: center; max-width: 400px; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 15px rgba(251,191,36,0.3); }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: var(--success); color: white; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }

        .header { height: 60px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #334155; }
        #content-area { height: calc(100vh - 120px); overflow-y: auto; padding: 15px; padding-bottom: 100px; }

        /* Card Design - NO QR, ID FIXED */
        .id-card-wrapper { padding: 5px; background: var(--bg); width: 100%; max-width: 360px; margin: auto; }
        .id-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2.5px solid var(--primary); border-radius: 20px; padding: 20px; position: relative; color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.6); overflow: hidden; }
        .id-card-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 12px; margin-bottom: 18px; }
        .id-body { display: flex; gap: 18px; align-items: flex-start; }
        .id-photo-box { width: 95px; height: 120px; background: #334155; border: 2px solid var(--primary); border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .id-photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .id-info { font-size: 14px; line-height: 1.8; text-align: left; flex: 1; }
        .id-number-box { margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(251,191,36,0.4); width: 100%; }
        .id-number { font-weight: 900; color: var(--primary); font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 1px; display: block; }

        /* Feature Grid */
        .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 25px; }
        .f-item { background: var(--card); padding: 12px 5px; border-radius: 15px; text-align: center; border: 1px solid #334155; cursor: pointer; }
        .f-item:active { background: #334155; }
        .f-item i { font-size: 22px; color: var(--primary); margin-bottom: 6px; display: block; }
        .f-item span { font-size: 10px; font-weight: bold; color: #cbd5e1; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; z-index: 500; }
        .nav-item { text-align: center; color: #64748b; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="screen-auth" class="screen">
        <div class="auth-content">
            <h1 style="color:var(--primary); font-size:50px; font-weight:900; margin-bottom:5px;">KRYA</h1>
            <p style="opacity:0.8; margin-bottom:40px;">बांका का अपना सुपर ऐप 🇮🇳</p>
            <input type="email" id="inp-email" placeholder="अपनी ईमेल आईडी भरें">
            <button class="btn" onclick="sendOTP()">ओटीपी प्राप्त करें</button>
            <p style="font-size:12px; margin-top:20px; opacity:0.5;">सच्चाई और ईमानदारी हमारी पहचान है।</p>
        </div>
    </div>

    <div id="screen-setup" class="screen hidden">
        <div class="auth-content">
            <h3 style="color:var(--primary); margin-bottom:20px;">डिजिटल सच्चाई कार्ड मेकर</h3>
            <div style="text-align:left; max-width:320px; margin:auto;">
                <input type="text" id="inp-name" placeholder="आपका पूरा नाम">
                <input type="text" id="inp-father" placeholder="पिता का नाम">
                <input type="text" id="inp-address" placeholder="पूरा पता (बांका, बिहार)">
                <select id="inp-skill">
                    <option value="डिजिटल उद्यमी">डिजिटल उद्यमी</option>
                    <option value="छात्र">छात्र</option>
                    <option value="व्यापारी">व्यापारी</option>
                    <option value="मिस्त्री">मिस्त्री</option>
                    <option value="दुकानदार">दुकानदार</option>
                </select>
                <p style="font-size:12px; color:var(--primary); margin:10px 0 5px;">अपनी फोटो अपलोड करें:</p>
                <input type="file" id="inp-file" accept="image/*" style="padding:10px;">
                <button class="btn" onclick="saveProfile()">सच्चाई कार्ड जनरेट करें</button>
            </div>
        </div>
    </div>

    <div id="screen-app" class="hidden">
        <div class="header">
            <div style="font-weight:900; color:var(--primary); font-size:24px;">KRYA</div>
            <div id="user-tag" style="font-size:12px; background:#334155; padding:4px 15px; border-radius:20px; color:var(--primary); border:1px solid rgba(251,191,36,0.3);"></div>
        </div>

        <div id="content-area">
            <div id="capture-zone" class="id-card-wrapper">
                <div class="id-card">
                    <div class="id-card-head">
                        <span style="font-weight:900; font-size:16px; letter-spacing:1px;">KRYA सच्चाई कार्ड 🇮🇳</span>
                        <span style="font-size:11px; color:var(--primary); font-weight:bold;">Verified ✅</span>
                    </div>
                    <div class="id-body">
                        <div class="id-photo-box"><img id="card-img" src=""></div>
                        <div class="id-info">
                            <b id="card-name" style="font-size:19px; color:var(--primary);"></b><br>
                            <span style="opacity:0.9;">पिता: <span id="card-father" style="color:white;"></span></span><br>
                            <span style="opacity:0.9;">पेशा: <span id="card-skill" style="color:white;"></span></span><br>
                            <span style="opacity:0.9; font-size:11px;">पता: <span id="card-address"></span></span>
                        </div>
                    </div>
                    <div class="id-number-box">
                        <span style="font-size:10px; opacity:0.6; display:block; margin-bottom:2px;">UNIQUE IDENTIFICATION NUMBER</span>
                        <span class="id-number" id="card-id"></span>
                    </div>
                </div>
            </div>

            <button class="btn btn-green" onclick="shareToWhatsApp()">
                <i class="fab fa-whatsapp" style="font-size:24px;"></i> कार्ड व्हाट्सएप पर शेयर करें
            </button>

            <h4 style="font-size:14px; margin:20px 0 10px; color:var(--primary);"><i class="fas fa-rocket"></i> KRYA सुपर सर्विसेज</h4>
            <div class="feature-grid">
                <div class="f-item" onclick="toolAlert('ग्लोबल चैट')"><i class="fas fa-globe"></i><span>चैट</span></div>
                <div class="f-item" onclick="toolAlert('बांका बाजार')"><i class="fas fa-store"></i><span>बाजार</span></div>
                <div class="f-item" onclick="toolAlert('डिजिटल खाता')"><i class="fas fa-book-open"></i><span>खाता</span></div>
                <div class="f-item" onclick="toolAlert('स्कैन एंड पे')"><i class="fas fa-qrcode"></i><span>पेमेंट</span></div>
                <div class="f-item" onclick="toolAlert('स्क्रैच कार्ड')"><i class="fas fa-gift"></i><span>इनाम</span></div>
                <div class="f-item" onclick="toolAlert('लकी ड्रा')"><i class="fas fa-trophy"></i><span>विजेता</span></div>
                <div class="f-item" onclick="toolAlert('VIP अर्निंग')"><i class="fas fa-crown"></i><span>VIP</span></div>
                <div class="f-item" onclick="window.open('https://wa.me/916379403821')"><i class="fas fa-headset"></i><span>हेल्प</span></div>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active"><i class="fas fa-home"></i><br>होम</div>
            <div class="nav-item" onclick="toolAlert('ग्लोबल चैट')"><i class="fas fa-comments"></i><br>चैट</div>
            <div class="nav-item" onclick="toolAlert('बांका बाजार')"><i class="fas fa-shopping-cart"></i><br>बाजार</div>
            <div class="nav-item" onclick="window.open('https://wa.me/916379403821')"><i class="fas fa-user-shield"></i><br>सपोर्ट</div>
        </nav>
    </div>

<script>
    // मुकेश जी, यहाँ आपका सुरक्षित कोड है
    emailjs.init("msEHMlMxmjBbBoqnn");
    let myData = JSON.parse(localStorage.getItem('krya_prod_session'));

    window.sendOTP = () => {
        const email = document.getElementById('inp-email').value;
        if(!email.includes('@')) return alert("सही ईमेल भरें!");
        const otp = Math.floor(100000 + Math.random() * 900000);
        emailjs.send('service_gls676h', 'template_6teuhl4', { email, otp }).then(() => {
            const code = prompt("आपके ईमेल पर 6 अंकों का OTP भेजा गया है, उसे यहाँ भरें:");
            if(code == otp) {
                document.getElementById('screen-auth').classList.add('hidden');
                document.getElementById('screen-setup').classList.remove('hidden');
            } else { alert("गलत ओटीपी! फिर से कोशिश करें।"); }
        });
    };

    window.saveProfile = () => {
        const name = document.getElementById('inp-name').value;
        const father = document.getElementById('inp-father').value;
        const skill = document.getElementById('inp-skill').value;
        const address = document.getElementById('inp-address').value;
        const idNum = "KRYA-" + Math.floor(1000+Math.random()*9000) + "-" + Math.floor(1000+Math.random()*9000);
        
        const file = document.getElementById('inp-file').files[0];
        if(!name || !father || !address) return alert("कृपया सभी जानकारी भरें!");

        const reader = new FileReader();
        reader.onloadend = () => {
            myData = { name, father, skill, address, idNum, photo: reader.result || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" };
            localStorage.setItem('krya_prod_session', JSON.stringify(myData));
            launchApp();
        };
        if(file) reader.readAsDataURL(file); else reader.onloadend();
    };

    function launchApp() {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-app').classList.remove('hidden');
        document.getElementById('user-tag').innerText = "@" + myData.name.split(' ')[0];
        document.getElementById('card-name').innerText = myData.name;
        document.getElementById('card-father').innerText = myData.father;
        document.getElementById('card-skill').innerText = myData.skill;
        document.getElementById('card-address').innerText = myData.address;
        document.getElementById('card-id').innerText = myData.idNum;
        document.getElementById('card-img').src = myData.photo;
    }

    window.shareToWhatsApp = async () => {
        const area = document.getElementById('capture-zone');
        const canvas = await html2canvas(area, { backgroundColor: '#0b1120', scale: 3 }); // High quality
        
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'KRYA_Card.png', { type: 'image/png' });
            const webLink = window.location.origin + window.location.pathname;
            const shareMsg = `नमस्ते! मैंने अपना KRYA 'सच्चाई कार्ड' बना लिया है। 🇮🇳\n\nबांका की अपनी डिजिटल पहचान बनाने के लिए अभी इस लिंक पर क्लिक करें और अपना फ्री कार्ड प्राप्त करें:\n👇\n${webLink}`;

            if (navigator.share) {
                await navigator.share({
                    title: 'KRYA Super App',
                    text: shareMsg,
                    files: [file]
                });
            } else {
                alert("व्हाट्सएप पर शेयर करने के लिए कार्ड का स्क्रीनशॉट लें और अपने दोस्तों को भेजें!");
            }
        });
    };

    window.toolAlert = (name) => {
        alert(`${name} टूल अभी अपडेट हो रहा है। कल सुबह तक यह पूरी तरह काम करना शुरू कर देगा!`);
    };

    if(myData) launchApp();
</script>
</body>
</html>
