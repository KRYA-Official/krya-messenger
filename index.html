<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA - Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .full-screen { height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; position: fixed; width: 100%; top: 0; left: 0; z-index: 100; background: var(--bg); }
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(251, 191, 36, 0.2); text-align: center; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: var(--primary); color: #0b1120; font-size: 16px; }
        .header { background: var(--card); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #334155; }
        #main-content { height: calc(100vh - 130px); overflow-y: auto; padding: 15px; }
        .talent-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; display: flex; align-items: center; gap: 15px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
        .hidden { display: none !important; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
    </style>
</head>
<body>

<div id="screen-auth" class="full-screen">
    <div class="auth-card">
        <h1 class="logo">KRYA</h1>
        <div id="step-email">
            <input type="email" id="user-email" placeholder="Email डालें">
            <button class="btn" onclick="sendOTP()">OTP भेजें</button>
        </div>
        <div id="step-otp" class="hidden">
            <input type="number" id="otp-input" placeholder="6 अंकों का OTP">
            <button class="btn" onclick="verifyOTP()">Verify करें</button>
        </div>
        <p id="auth-status" style="margin-top:10px; font-size:12px; color:var(--primary)"></p>
    </div>
</div>

<div id="screen-profile" class="full-screen hidden">
    <div class="auth-card">
        <h2>अपना टैलेंट चुनें</h2>
        <input type="text" id="prof-handle" placeholder="@username (उदा: @Mukesh)">
        <select id="prof-talent">
            <option value="व्यापारी">दुकानदार / व्यापारी</option>
            <option value="कारीगर">मिस्त्री / कारीगर</option>
            <option value="किसान">खेती - किसानी</option>
            <option value="सेवा">अन्य सेवाएँ</option>
        </select>
        <textarea id="prof-bio" placeholder="अपने बारे में लिखें..."></textarea>
        <button class="btn" onclick="saveProfile()">KRYA मार्केट में जुड़ें</button>
    </div>
</div>

<div id="app-main" class="hidden">
    <div class="header">
        <div class="logo">KRYA</div>
        <div id="user-tag" style="font-size:12px; color:var(--primary)"></div>
    </div>
    <div id="main-content">
        <h3 style="margin-bottom:15px;">लाइव मार्केट</h3>
        <div id="market-list"></div>
    </div>
    <div class="nav-bar">
        <div onclick="location.reload()"><i class="fas fa-home"></i><br>होम</div>
        <div onclick="alert('खोज जारी है...')"><i class="fas fa-search"></i><br>खोजें</div>
        <div onclick="alert('कमीशन और अर्निंग जल्द आएगी')"><i class="fas fa-wallet"></i><br>कमाई</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
      authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
      projectId: "sample-firebase-ai-app-37d2b",
      storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
      messagingSenderId: "652996597348",
      appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("msEHMlMxmjBbBoqnn");

    let tempOTP = null;
    let tempEmail = "";

    window.sendOTP = function() {
        tempEmail = document.getElementById('user-email').value;
        if(!tempEmail.includes('@')) return alert("सही ईमेल लिखें");
        tempOTP = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('auth-status').innerText = "भेजा जा रहा है...";
        emailjs.send('service_gls676h', 'template_6teuhl4', { email: tempEmail, otp: tempOTP })
            .then(() => {
                document.getElementById('step-email').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
                document.getElementById('auth-status').innerText = "OTP भेज दिया गया!";
            }).catch(err => alert("Email Error: " + err));
    };

    window.verifyOTP = async function() {
        const input = document.getElementById('otp-input').value;
        if(tempOTP && input == tempOTP) {
            tempOTP = null; 
            const uid = btoa(tempEmail).replace(/=/g, ""); 
            const userDoc = await getDoc(doc(db, "krya_users", uid));
            document.getElementById('screen-auth').classList.add('hidden');
            if(userDoc.exists()) { loadApp(userDoc.data()); } 
            else { document.getElementById('screen-profile').classList.remove('hidden'); }
        } else { alert("गलत OTP!"); }
    };

    window.saveProfile = async function() {
        const handle = document.getElementById('prof-handle').value.trim();
        const talent = document.getElementById('prof-talent').value;
        const bio = document.getElementById('prof-bio').value;
        if(!handle || !talent) return alert("नाम और टैलेंट जरूरी है");
        
        const uid = btoa(tempEmail).replace(/=/g, "");
        const userData = { handle, talent, bio, email: tempEmail, uid, joined: Date.now() };

        try {
            // FIXED LINE BELOW
            await setDoc(doc(db, "krya_users", uid), userData);
            document.getElementById('screen-profile').classList.add('hidden');
            loadApp(userData);
        } catch(e) {
            alert("डेटाबेस एरर: " + e.message);
        }
    };

    function loadApp(user) {
        document.getElementById('app-main').classList.remove('hidden');
        document.getElementById('user-tag').innerText = user.handle;
        const list = document.getElementById('market-list');
        onSnapshot(collection(db, "krya_users"), snap => {
            list.innerHTML = "";
            snap.forEach(d => {
                const u = d.data();
                const card = document.createElement('div');
                card.className = 'talent-card';
                card.innerHTML = `
                    <div style="width:50px; height:50px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold;">${u.handle[1] || 'K'}</div>
                    <div style="flex:1">
                        <div style="font-weight:bold">${u.handle}</div>
                        <div style="font-size:12px; color:var(--primary)">${u.talent}</div>
                        <div style="font-size:11px; opacity:0.7">${u.bio}</div>
                    </div>
                `;
                list.appendChild(card);
            });
        });
    }
</script>
</body>
</html>
