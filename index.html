<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - Jio Mukesh</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // आपकी सही Public Key यहाँ सेट है (बड़ा J)
            emailjs.init("msEHlMxmJBbBoqnn");
        })();
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #otpSection { display: none; }
        .success { color: green; margin-top: 10px; font-weight: bold; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>KRYA Messenger</h2>
    
    <div id="emailSection">
        <p>लॉगिन करने के लिए अपना ईमेल डालें</p>
        <input type="email" id="userEmail" placeholder="example@gmail.com">
        <button onclick="sendOTP()">OTP भेजें</button>
    </div>

    <div id="otpSection">
        <p>ईमेल पर भेजा गया 6 अंकों का कोड डालें</p>
        <input type="number" id="otpInput" placeholder="000000">
        <button onclick="verifyOTP()">वेरिफाई करें</button>
    </div>

    <div id="statusMsg"></div>
</div>

<script>
    let currentOTP;

    function sendOTP() {
        const email = document.getElementById('userEmail').value;
        const status = document.getElementById('statusMsg');
        
                if(!email) {
            status.innerHTML = "<p class='error'>कृपया ईमेल लिखें</p>";
            return;
                }
        

        status.innerHTML = "<p style='color: blue;'>भेजा जा रहा है...</p>";
        currentOTP = Math.floor(100000 + Math.random() * 900000);

        const params = {
            email: email,
            otp: currentOTP
        };

        // Service ID और Template ID यहाँ सेट है
        emailjs.send('service_gls676h', 'template_6touhl4', params)
            .then(function() {
               status.innerHTML = "<p class='success'>OTP आपके ईमेल पर भेज दिया गया है!</p>";
               document.getElementById('emailSection').style.display = 'none';
               document.getElementById('otpSection').style.display = 'block';
            }, function(err) {
               status.innerHTML = "<p class='error'>त्रुटि: " + err.text + "</p>";
            });
    }

    function verifyOTP() {
        const userInput = document.getElementById('otpInput').value;
        const status = document.getElementById('statusMsg');

        if(userInput == currentOTP) {
            status.innerHTML = "<p class='success'>लॉगिन सफल! KRYA में आपका स्वागत है।</p>";
        } else {
            status.innerHTML = "<p class='error'>गलत OTP, फिर से कोशिश करें।</p>";
        }
    }
</script>

</body>
</html>
