<div class="card auth-card">
    <h3>सुरक्षित लॉगिन</h3>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">अपना मोबाइल नंबर दर्ज करें</p>
    
    <div id="recaptcha-container"></div>
    
    <div class="input-group">
        <input type="tel" id="phone-number" placeholder="जैसे: 6379403821" style="font-size: 18px; font-weight: bold;">
    </div>
    
    <button class="btn btn-primary" id="send-otp-btn">
        <span id="btn-text">OTP भेजें</span>
        <div id="loader" style="display:none; width: 20px; height: 20px; border: 3px solid #fff; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </button>
    
    <div id="otp-section" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
        <input type="number" id="otp-code" placeholder="6-अंकों का कोड यहाँ डालें">
        <button class="btn btn-success" id="verify-otp-btn">वेरिफाई करें</button>
    </div>
</div>

<style>
    @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. Firebase Configuration (इसे अपनी असली चाबियों से बदलें)
    const firebaseConfig = {
        apiKey: "AIzaSyCJ_heMnqu6ENYS12hecty9V0IOKQlakFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf48199ba877246cd5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let confirmationResult = null;

    // 2. Recaptcha Setup (Invisible Mode)
    function setupRecaptcha() {
        if (!window.recaptchaVerifier) {
            console.log("Initializing Recaptcha...");
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                'size': 'invisible',
                'callback': (response) => { console.log("Recaptcha solved!"); }
            });
        }
    }

    // 3. Send OTP Function
    async function handleSendOTP() {
        const btn = document.getElementById('send-otp-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        let phone = document.getElementById('phone-number').value.trim();

        // ऑटो-फिक्स नंबर (अगर +91 नहीं लगा है)
        if (!phone.startsWith("+")) {
            phone = phone.startsWith("91") ? "+" + phone : "+91" + phone;
        }

        if (phone.length < 13) {
            alert("कृपया सही मोबाइल नंबर डालें");
            return;
        }

        // UI Loading State
        btn.disabled = true;
        btnText.style.display = 'none';
        loader.style.display = 'block';

        console.log("Sending OTP to:", phone);
        setupRecaptcha();

        try {
            const result = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
            confirmationResult = result;
            console.log("OTP Sent Successfully!");
            
            document.getElementById('otp-section').style.display = 'block';
            alert("OTP भेज दिया गया है!");
        } catch (error) {
            console.error("OTP Error:", error.code, error.message);
            alert("ओह! " + error.message);
            // Reset ReCaptcha on error
            if (window.recaptchaVerifier) {
                window.recaptchaVerifier.render().then(widgetId => {
                    grecaptcha.reset(widgetId);
                });
            }
        } finally {
            btn.disabled = false;
            btnText.style.display = 'block';
            loader.style.display = 'none';
        }
    }

    // 4. Verify OTP Function
    async function handleVerifyOTP() {
        const code = document.getElementById('otp-code').value;
        if (code.length !== 6) return alert("6 अंकों का कोड डालें");

        try {
            const result = await confirmationResult.confirm(code);
            const user = result.user;
            console.log("Login Success!", user.uid);
            
            // डेटाबेस में यूजर सेव करें
            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                phone: user.phoneNumber,
                lastLogin: serverTimestamp()
            }, { merge: true });

            alert("लॉगिन सफल!");
            location.reload();
        } catch (error) {
            alert("गलत OTP! कृपया फिर से जाँचें।");
        }
    }

    // 5. Event Listeners (बटन क्लिक फिक्स)
    document.getElementById('send-otp-btn').addEventListener('click', (e) => {
        e.preventDefault();
        handleSendOTP();
    });

    document.getElementById('verify-otp-btn').addEventListener('click', (e) => {
        e.preventDefault();
        handleVerifyOTP();
    });

    // 6. Auth State Check
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("User is logged in:", user.phoneNumber);
            // यहाँ आप होम पेज पर भेज सकते हैं (nav('home'))
        }
    });

            </script>
