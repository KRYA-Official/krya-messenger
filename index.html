<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - Royal VIP Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #fbbf24; --silver: #d1d5db; --bg: #070b14; --card-dark: #111827; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid #1f2937; }
        
        /* कार्ड डिजाइन */
        .id-card { 
            width: 94%; max-width: 450px; border-radius: 25px; margin: 25px auto; 
            padding: 25px; position: relative; overflow: hidden; transition: 0.4s;
        }

        /* 1. VIP GOLD DESIGN (Premium) */
        .gold { 
            background: linear-gradient(145deg, #1a1a1a, #000); 
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }
        /* VIP वाटरमार्क पैटर्न */
        .gold::before {
            content: "KRYA VIP"; position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            font-size: 12px; font-weight: bold; color: rgba(251, 191, 36, 0.03);
            transform: rotate(-30deg); line-height: 40px; pointer-events: none;
        }

        .silver { background: linear-gradient(145deg, #2d3748, #1a202c); border: 3px solid var(--silver); }
        .classic { background: #1f2937; border: 2px solid #4b5563; }

        .verified-badge { position: absolute; top: 20px; right: 20px; font-weight: bold; font-size: 12px; }

        /* फोटो और नाम का हिस्सा */
        .card-main { display: flex; gap: 20px; align-items: center; margin-top: 10px; z-index: 2; position: relative; }
        .user-pic { width: 110px; height: 140px; border-radius: 15px; object-fit: cover; border: 2px solid var(--gold); }
        
        /* बड़ा और फैला हुआ ID नंबर (Hero Style) */
        .footer-id {
            margin-top: 30px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
            font-family: 'Courier New', monospace; text-align: center;
            font-size: 20px; font-weight: bold; letter-spacing: 4px;
            color: var(--gold); width: 100%; display: block;
        }

        /* बटन स्टाइल */
        .btn { width: 90%; padding: 16px; margin: 10px 5%; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-share { background: #22c55e; color: #fff; }

        /* फॉर्म और एडमिन पैनल */
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; padding: 25px; overflow-y: auto; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; background: #1f2937; border: 1px solid #374151; border-radius: 10px; color: #fff; }

        .nav { position: fixed; bottom: 0; width: 100%; background: #111827; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1f2937; }
        .nav-item { color: #94a3b8; font-size: 13px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color:var(--gold); letter-spacing:3px;">KRYA</h2>
    </div>

    <div id="capture-area" style="background:var(--bg); padding:10px;">
        <div id="final-card" class="id-card gold">
            <div id="badge-ui" class="verified-badge" style="color:var(--gold);">VIP MEMBER ⭐️</div>
            <h4 style="font-size:18px; color:rgba(255,255,255,0.8); margin-bottom:15px;">KRYA सच्चाई कार्ड</h4>
            
            <div class="card-main">
                <img id="disp-img" src="https://via.placeholder.com/110x140" class="user-pic">
                <div style="line-height:1.6;">
                    <b id="disp-name" style="font-size:24px; color:var(--gold);">मुकेश राय</b><br>
                    <span style="font-size:14px; color:#94a3b8;">पेशा: <span id="disp-skill" style="color:#fff;">डिजिटल उद्यमी</span></span><br>
                    <span style="font-size:14px; color:#94a3b8;">पता: <span id="disp-address" style="color:#fff;">बांका, बिहार</span></span>
                </div>
            </div>

            <div class="footer-id" id="disp-id">KRYA 2026 8877 4432</div>
        </div>
    </div>

    <button id="setup-btn" class="btn btn-gold" onclick="openSettings()"><i class="fas fa-magic"></i> अपना VIP कार्ड तैयार करें</button>
    <button class="btn btn-share" onclick="shareMe()"><i class="fab fa-whatsapp"></i> व्हाट्सएप पर शेयर करें</button>

    <div id="settings-ui" class="overlay">
        <h2 style="color:var(--gold);">प्रोफाइल सेटअप</h2>
        <input type="file" id="in-photo" accept="image/*" onchange="handleFile(event)">
        <input type="text" id="in-name" placeholder="आपका नाम">
        <input type="text" id="in-skill" placeholder="आपका पेशा">
        <input type="text" id="in-address" placeholder="आपका शहर">
        <input type="tel" id="in-phone" placeholder="WhatsApp नंबर">
        <button class="btn btn-gold" onclick="finalSave()">सेव और कार्ड जेनरेट करें</button>
        <button class="btn" style="background:#374151;" onclick="closeSettings()">वापस</button>
    </div>

    <div id="decorate-ui" class="overlay">
        <h2 style="color:var(--gold);">एडमिन कंट्रोल</h2>
        <input type="password" id="admin-pass" placeholder="पासवर्ड">
        <button class="btn btn-gold" onclick="checkAdmin('edit')">प्रोफाइल एडिट करें</button>
        <hr style="border:0.5px solid #374151; margin:20px 0;">
        <label>VIP ID बदलें:</label>
        <input type="text" id="new-id" placeholder="जैसे: KRYA 7777 0000">
        <label>बैज चुनें:</label>
        <select id="new-badge">
            <option value="vip">VIP Gold ⭐️</option>
            <option value="std">Verified ✅</option>
        </select>
        <button class="btn btn-gold" onclick="checkAdmin('vip')">VIP सेटिंग्स लागू करें</button>
        <button class="btn" style="background:#374151;" onclick="closeDecorate()">बंद करें</button>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i><br>होम</div>
        <div class="nav-item" onclick="openDecorate()"><i class="fas fa-crown"></i><br>सजाएं</div>
    </nav>

<script>
    const S_ID = "service_gls676h";
    const T_ID = "template_6teuhi4";
    const P_K = "msEHMIMxmjBbBoqnn";

    let userData = JSON.parse(localStorage.getItem('krya_v44')) || {
        name: "मुकेश राय", skill: "डिजिटल उद्यमी", address: "बांका, बिहार", photo: "", id: "KRYA 2026 8877 4432", badge: "vip", isDone: false
    };

    function updateUI() {
        document.getElementById('disp-name').innerText = userData.name;
        document.getElementById('disp-skill').innerText = userData.skill;
        document.getElementById('disp-address').innerText = userData.address;
        document.getElementById('disp-id').innerText = userData.id;
        if(userData.photo) document.getElementById('disp-img').src = userData.photo;
        
        const badge = document.getElementById('badge-ui');
        if(userData.badge === 'vip') {
            badge.innerText = "VIP MEMBER ⭐️"; badge.style.color = "#fbbf24";
        } else {
            badge.innerText = "Verified ✅"; badge.style.color = "#22c55e";
        }

        if(userData.isDone) document.getElementById('setup-btn').style.display = 'none';
    }

    function openSettings() { document.getElementById('settings-ui').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-ui').style.display = 'none'; }
    function openDecorate() { document.getElementById('decorate-ui').style.display = 'flex'; }
    function closeDecorate() { document.getElementById('decorate-ui').style.display = 'none'; }

    function handleFile(e) {
        const reader = new FileReader();
        reader.onload = () => { userData.photo = reader.result; };
        reader.readAsDataURL(e.target.files[0]);
    }

    function finalSave() {
        userData.name = document.getElementById('in-name').value || userData.name;
        userData.skill = document.getElementById('in-skill').value || userData.skill;
        userData.address = document.getElementById('in-address').value || userData.address;
        userData.isDone = true;
        
        localStorage.setItem('krya_v44', JSON.stringify(userData));
        emailjs.send(S_ID, T_ID, { from_name: userData.name, user_mobile: document.getElementById('in-phone').value }, P_K);
        
        updateUI(); closeSettings();
        alert("आपका रॉयल कार्ड तैयार है!");
    }

    function checkAdmin(type) {
        if(document.getElementById('admin-pass').value === 'KRYA2026') {
            if(type === 'edit') { closeDecorate(); openSettings(); }
            else {
                userData.id = document.getElementById('new-id').value || userData.id;
                userData.badge = document.getElementById('new-badge').value;
                localStorage.setItem('krya_v44', JSON.stringify(userData));
                updateUI(); alert("VIP सेटिंग्स अपडेट हुई!"); closeDecorate();
            }
        } else { alert("गलत पासवर्ड!"); }
    }

    async function shareMe() {
        const canvas = await html2canvas(document.getElementById('capture-area'), { scale: 2 });
        canvas.toBlob(blob => {
            const file = new File([blob], 'KRYA_VIP_Card.png', {type: 'image/png'});
            if(navigator.share) navigator.share({files: [file], title: 'KRYA VIP'});
        });
    }

    updateUI();
</script>
</body>
</html>
