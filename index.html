<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive.com</title>

<style>
body{margin:0;font-family:Poppins;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff}
.frame{position:fixed;inset:10px;border:2px solid #00ffd5;border-radius:18px;box-shadow:0 0 25px #00ffd5;pointer-events:none}
.header{text-align:center;padding:15px;font-size:24px;font-weight:bold}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}

/* Card */
.card{background:rgba(255,255,255,0.08);padding:15px;border-radius:15px;text-align:center}
.badge{background:red;padding:4px 8px;border-radius:6px;font-size:12px}
.price{color:#00ffd5;font-size:20px}

/* Buttons */
.btn{display:block;margin-top:10px;padding:10px;border-radius:20px;text-decoration:none;font-weight:bold}
.buy{background:#ff9800;color:#000}
.chat{background:#25D366}

/* Form */
.formBox{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;border-radius:10px;
display:none;width:300px
}
.formBox input{width:100%;margin:5px 0;padding:8px}

/* Popup */
.popup{
position:fixed;bottom:80px;left:20px;
background:#111;padding:10px;border-radius:10px;display:none
}
</style>
</head>

<body>

<div class="frame"></div>
<div class="header">🚀 KryaLive.com</div>

<div class="container" id="container"></div>

<!-- FORM -->
<div class="formBox" id="formBox">
<h3>Order Details</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="service" placeholder="Service">
<input id="coupon" placeholder="Coupon (optional)">
<button onclick="submitOrder()">Submit</button>
</div>

<div class="popup" id="popup"></div>

<script>

const UPI="93690mukeshkumar@axl";
const WA="916379403821";

const services=[
{name:"Website",price:2999},
{name:"Firebase",price:999},
{name:"App Dev",price:4999},
{name:"SEO",price:999},
{name:"Logo",price:299}
];

// Render
let html="";
services.forEach((s,i)=>{
html+=`
<div class="card">
<div class="badge">🔥 OFFER</div>
<h3>${s.name}</h3>
<div class="price">₹${s.price}</div>
<div>⭐⭐⭐⭐⭐ (50+ sold)</div>
<a class="btn buy" onclick="openForm('${s.name}',${s.price})">Book</a>
<a class="btn chat" onclick="wa('${s.name}')">Chat</a>
</div>`;
});
document.getElementById("container").innerHTML=html;

// Open form
let currentService="",currentPrice=0;
function openForm(name,price){
currentService=name;
currentPrice=price;
document.getElementById("formBox").style.display="block";
document.getElementById("service").value=name;
}

// Submit order
function submitOrder(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let service=currentService;
let coupon=document.getElementById("coupon").value;

let finalPrice=currentPrice;
if(coupon==="SAVE50"){finalPrice-=50;}

let order={name,phone,service,finalPrice,date:new Date().toLocaleString()};

// Save locally
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));

// Payment
window.open(`upi://pay?pa=${UPI}&pn=Mukesh&am=${finalPrice}&cu=INR`);

// WhatsApp message
let msg=`Order:\nName:${name}\nService:${service}\nPrice:${finalPrice}`;
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`);

// Close form
document.getElementById("formBox").style.display="none";
}

// WhatsApp
function wa(service){
let msg=`मुझे ${service} चाहिए`;
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`);
}

// Fake popup
let names=["Rahul","Amit","Vikas"];
setInterval(()=>{
let n=names[Math.floor(Math.random()*names.length)];
let popup=document.getElementById("popup");
popup.innerText=n+" ने अभी order किया";
popup.style.display="block";
setTimeout(()=>popup.style.display="none",3000);
},4000);

</script>

</body>
</html>
