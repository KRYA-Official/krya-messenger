<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive.com</title>

<style>
body {
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
}

/* HERO SECTION */
.hero {
    height:100vh;
    background: url('https://images.unsplash.com/photo-1522199710521-72d69614c702') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.hero::before {
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

/* CARD */
.card {
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:320px;
    box-shadow:0 0 30px rgba(0,255,200,0.4);
    transition:0.4s;
}

.card:hover {
    transform:translateY(-10px) scale(1.05);
}

/* IMAGE */
.card img {
    width:100%;
    border-radius:10px;
    margin-bottom:15px;
}

/* TEXT */
.card h2 {
    margin:10px 0;
}

.card p {
    color:#ccc;
    font-size:14px;
}

/* BUTTON */
.btn {
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    border-radius:25px;
    background:linear-gradient(45deg,#00ffcc,#00c3ff);
    color:black;
    font-weight:bold;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover {
    transform:scale(1.1);
}

/* MOBILE */
@media(max-width:600px){
    .card {width:90%;}
}
</style>
</head>

<body>

<section class="hero">

<div class="card">

<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Service">

<h2>🚀 KryaLive.com</h2>

<p>

तेज़, भरोसेमंद और सस्ते दाम में 💻
</p>

<a href="https://wa.me/916379403821?text=नमस्ते%20मुझे%20आपकी%20service%20चाहिए" class="btn">
💬 अभी संपर्क करें
</a>

</div>

</section>

</body>
</html>
