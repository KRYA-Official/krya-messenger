<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Digital | Real-World Platform</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #10b981; --accent: #2563eb; --gold: #fbbf24;
            --dark: #0f172a; --slate: #475569; --light: #f8fafc;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--light); }
        .app-container { display: flex; flex-direction: column; height: 100vh; }

        header { background: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; z-index: 1000; }
        .brand { font-size: 20px; font-weight: 800; color: var(--dark); }
        .brand span { color: var(--primary); }
        
        main { flex: 1; overflow-y: auto; padding: 15px 15px 90px; scrollbar-width: none; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0 25px; border-top: 1px solid #e2e8f0; z-index: 1001; }
        .nav-item { border: none; background: none; color: #94a3b8; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; outline: none; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 700; }

        .card { background: #fff; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #f1f5f9; }
        .btn-primary { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--slate); }
        .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; outline: none; }

        .chat-view { height: calc(100vh - 250px); display: flex; flex-direction: column; background: #0f172a; border-radius: 20px; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; color: #fff; }
        .msg-me { align-self: flex-end; background: var(--primary); border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 2px; }
        
        .chat-input-box { padding: 10px; background: #1e293b; display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; background: #0f172a; color: #fff; }

        .badge-status { padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fef3c7; color: #92400e; }

        .hidden { display: none !important; }
        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 10px; color: white; display: none; z-index: 9999; text-align: center; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">KRYA<span>Digital</span></div>
            <div id="auth-status" style="font-size: 10px; font-weight: bold; color: var(--primary);">● Live</div>
        </header>

        <main id="main-content">
            <section id="view-home" class="view animate__animated animate__fadeIn">
                <div class="card">
                    <h2 style="margin-bottom: 10px; color: var(--accent);">राष्ट्रीय एकता संघ</h2>
                    <p style="font-size: 12px; color: var(--slate); margin-bottom: 20px;">मजदूर कल्याण एवं डिजिटल सदस्यता पंजीकरण</p>
                    <form id="regForm">
                        <div class="input-group">
                            <label>पूरा नाम *</label>
                            <input type="text" id="reg_name" class="form-control" placeholder="नाम लिखें" required>
                        </div>
                        <div class="input-group">
                            <label>मोबाइल नंबर *</label>
                            <input type="tel" id="reg_phone" class="form-control" placeholder="10 अंकों का नंबर" pattern="[0-9]{10}" required>
                        </div>
                        <div class="input-group">
                            <label>जिला *</label>
                            <select id="reg_district" class="form-control" required>
                                <option value="">चुनें...</option>
                                <option value="Banka">बांका</option>
                                <option value="Delhi">दिल्ली</option>
                                <option value="Munger">मुंगेर</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary" id="regBtn">
                            <div class="loader" id="regLoader"></div> <span id="regText">सुरक्षित पंजीकरण करें</span>
                        </button>
                    </form>
                </div>
            </section>

            <section id="view-market" class="view hidden animate__animated animate__fadeIn">
                <h3 style="margin-bottom: 15px;">KRYA मार्केटप्लेस</h3>
                <div class="card">
                    <h4>3D Professional Logo</h4>
                    <p style="font-size: 12px; color: var(--slate); margin: 5px 0 15px;">आपके ब्रांड के लिए प्रीमियम लोगो डिजाइन।</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 800; color: var(--primary);">₹199</span>
                        <button onclick="handleOrder('3D Logo', 199)" class="btn-primary" style="width: auto; padding: 8px 20px;">अभी खरीदें</button>
                    </div>
                </div>
            </section>

            <section id="view-chat" class="view hidden animate__animated animate__fadeIn">
                <div class="chat-view">
                    <div class="chat-messages" id="chatList"></div>
                    <div class="chat-input-box">
                        <input type="text" id="chatMsg" placeholder="मैसेज लिखें...">
                        <button id="sendChatBtn" style="background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 50%;"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>

            <section id="view-panel" class="view hidden animate__animated animate__fadeIn">
                <div class="card">
                    <h4>मेरा डिजिटल कार्ड</h4>
                    <hr style="margin: 10px 0; opacity: 0.1;">
                    <p id="p_name">नाम: लोड हो रहा है...</p>
                    <p id="p_id" style="font-size: 10px; color: var(--slate);">ID: ---</p>
                    <button onclick="logout()" style="margin-top:15px; background:#fee2e2; color:#b91c1c; border:none; padding:8px 15px; border-radius:8px; font-size:11px; font-weight:bold;">लॉगआउट (Logout)</button>
                </div>
                <h4 style="margin-top:20px;">मेरे ऑर्डर्स</h4>
                <div id="orderList"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-home"><i class="fas fa-id-card"></i><span>संघ</span></button>
            <button class="nav-item" id="nav-market"><i class="fas fa-shopping-bag"></i><span>Market</span></button>
            <button class="nav-item" id="nav-chat"><i class="fas fa-comments"></i><span>Chat</span></button>
            <button class="nav-item" id="nav-panel"><i class="fas fa-user-circle"></i><span>Panel</span></button>
        </nav>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ नया 'Signing' प्रोजेक्ट कॉन्फ़िगरेशन अपडेट कर दिया गया है
        const firebaseConfig = {
            apiKey: "AIzaSyCJ_heMnqu6ENYS12hecty9V0IOKQlakFs",
            authDomain: "signing-9fc01.firebaseapp.com",
            projectId: "signing-9fc01",
            storageBucket: "signing-9fc01.firebasestorage.app",
            messagingSenderId: "926296137348",
            appId: "1:926296137348:web:c42cdf48199ba877246cd5",
            measurementId: "G-2821V0DH0F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('krya_user')) || null;

        const nav = (id) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + id).classList.remove('hidden');
            document.getElementById('nav-' + id).classList.add('active');
            if (id === 'panel') loadUserData();
        };

        document.getElementById('nav-home').onclick = () => nav('home');
        document.getElementById('nav-market').onclick = () => nav('market');
        document.getElementById('nav-chat').onclick = () => nav('chat');
        document.getElementById('nav-panel').onclick = () => nav('panel');

        window.handleOrder = (s, p) => placeOrder(s, p);
        window.logout = () => { localStorage.clear(); location.reload(); };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const loader = document.getElementById('regLoader');
            btn.disabled = true;
            loader.style.display = 'block';

            const userData = {
                name: document.getElementById('reg_name').value,
                phone: document.getElementById('reg_phone').value,
                district: document.getElementById('reg_district').value,
                createdAt: serverTimestamp()
            };

            try {
                const docRef = await addDoc(collection(db, "users"), userData);
                userData.id = docRef.id;
                localStorage.setItem('krya_user', JSON.stringify(userData));
                currentUser = userData;
                showToast("✅ पंजीकरण सफल!", "#10b981");
                nav('panel');
            } catch (err) {
                console.error(err);
                showToast("❌ एरर! कृपया दोबारा कोशिश करें", "#ef4444");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        };

        document.getElementById('sendChatBtn').onclick = async () => {
            const input = document.getElementById('chatMsg');
            if (!currentUser) return showToast("कृपया पहले रजिस्टर करें", "#fbbf24");
            if (!input.value.trim()) return;

            try {
                await addDoc(collection(db, "chats"), {
                    uid: currentUser.id,
                    userName: currentUser.name,
                    msg: input.value,
                    time: serverTimestamp()
                });
                input.value = "";
            } catch (e) { showToast("कनेक्शन एरर", "#ef4444"); }
        };

        onSnapshot(query(collection(db, "chats"), orderBy("time", "asc")), (snap) => {
            const list = document.getElementById('chatList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                const side = data.uid === currentUser?.id ? 'msg-me' : 'msg-them';
                list.innerHTML += `<div class="msg ${side}"><b>${data.userName}:</b><br>${data.msg}</div>`;
            });
            list.scrollTop = list.scrollHeight;
        });

        async function placeOrder(service, price) {
            if (!currentUser) { showToast("कृपया पहले पंजीकरण करें", "#fbbf24"); return nav('home'); }
            try {
                await addDoc(collection(db, "orders"), {
                    uid: currentUser.id,
                    uName: currentUser.name,
                    service: service,
                    price: price,
                    status: 'pending',
                    time: serverTimestamp()
                });
                showToast("📦 ऑर्डर बुक हो गया!", "#2563eb");
                nav('panel');
            } catch (e) { showToast("ऑर्डर फेल हुआ", "#ef4444"); }
        }

        function loadUserData() {
            if (!currentUser) {
                document.getElementById('p_name').innerText = "कृपया रजिस्टर करें";
                return;
            }
            document.getElementById('p_name').innerText = "नाम: " + currentUser.name;
            document.getElementById('p_id').innerText = "ID: " + currentUser.id;
            
            onSnapshot(query(collection(db, "orders"), where("uid", "==", currentUser.id)), (snap) => {
                const list = document.getElementById('orderList');
                list.innerHTML = "";
                if(snap.empty) list.innerHTML = "<p style='font-size:12px; color:gray;'>कोई ऑर्डर नहीं मिला।</p>";
                snap.forEach(doc => {
                    const d = doc.data();
                    list.innerHTML += `<div class="card" style="padding:15px; font-size:13px;">${d.service} <span class="badge-status status-pending">Pending</span></div>`;
                });
            });
        }

        function showToast(msg, color) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.background = color; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        if(currentUser) nav('panel');
    </script>
</body>
</html>
