<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - सुपर ऐप (पावर एडिशन)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        #content-area { height: calc(100vh - 120px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }

        /* KRYA ID Card Design */
        .id-card-wrapper { padding: 10px; background: transparent; }
        .id-card { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            border: 2px solid var(--primary); 
            border-radius: 15px; 
            padding: 15px; 
            position: relative; 
            color: white; 
            width: 100%;
            max-width: 350px;
            margin: auto;
        }
        .id-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 5px; margin-bottom: 10px; }
        .id-content { display: flex; gap: 15px; }
        .id-photo { width: 80px; height: 100px; background: #334155; border: 1px solid var(--primary); border-radius: 8px; overflow: hidden; }
        .id-photo img { width: 100%; height: 100%; object-fit: cover; }
        .id-details { font-size: 12px; line-height: 1.6; text-align: left; }
        .id-number { font-weight: bold; color: var(--primary); font-family: monospace; font-size: 14px; }

        /* Buttons */
        .share-btn { width: 100%; background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; margin-top: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .action-btn { background: var(--card); padding: 10px 5px; border-radius: 10px; text-align: center; border: 1px solid #334155; font-size: 10px; }
        .action-btn i { font-size: 20px; color: var(--primary); margin-bottom: 5px; display: block; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="app-main">
        <div id="content-area">
            <div id="card-to-capture" class="id-card-wrapper">
                <div class="id-card">
                    <div class="id-card-header">
                        <span style="font-weight:900;">KRYA 🇮🇳</span>
                        <span style="font-size:10px; color:var(--primary);">Sacchai Verified ✅</span>
                    </div>
                    <div class="id-content">
                        <div class="id-photo"><img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User"></div>
                        <div class="id-details">
                            <b style="font-size:14px;" id="disp-name">Mukesh Rai</b><br>
                            <span>पिता: <span id="disp-father">...</span></span><br>
                            <span>पेशा: <span id="disp-skill">उद्यमी</span></span><br>
                            <span>पता: <span id="disp-address">बांका, बिहार</span></span><br>
                            <div class="id-number">ID: 2026-8842-1039</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="share-btn" onclick="shareCard()">
                <i class="fab fa-whatsapp" style="font-size:24px;"></i> कार्ड व्हाट्सएप पर शेयर करें
            </button>

            <div class="action-grid">
                <div class="action-btn"><i class="fas fa-globe"></i>चैट</div>
                <div class="action-btn"><i class="fas fa-store"></i>बाजार</div>
                <div class="action-btn"><i class="fas fa-book"></i>खाता</div>
                <div class="action-btn"><i class="fas fa-bell"></i>अलर्ट</div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div style="color:var(--primary); text-align:center;"><i class="fas fa-home"></i><br><small>होम</small></div>
            <div style="text-align:center;"><i class="fas fa-comments"></i><br><small>चैट</small></div>
            <div style="text-align:center;"><i class="fas fa-user"></i><br><small>सपोर्ट</small></div>
        </nav>
    </div>

<script>
    // मुकेश जी, यह फंक्शन कार्ड को फोटो बनाकर व्हाट्सएप पर शेयर करेगा
    async function shareCard() {
        const element = document.getElementById('card-to-capture');
        const canvas = await html2canvas(element, { backgroundColor: '#0b1120' });
        
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'krya_card.png', { type: 'image/png' });
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'मेरा KRYA सच्चाई कार्ड',
                        text: 'बांका का अपना सुपर ऐप! अपना सच्चाई कार्ड बनाने के लिए अभी जुड़ें।',
                        files: [file]
                    });
                } catch (err) {
                    console.error("Sharing failed", err);
                    alert("व्हाट्सएप पर शेयर करने के लिए कार्ड का स्क्रीनशॉट लें!");
                }
            } else {
                alert("आपका ब्राउज़र शेयरिंग सपोर्ट नहीं करता। कृपया स्क्रीनशॉट लें।");
            }
        });
    }

    // यहाँ हम पुराने डेटा को कार्ड में भर रहे हैं
    const userData = JSON.parse(localStorage.getItem('krya_session'));
    if(userData) {
        document.getElementById('disp-name').innerText = userData.name;
        document.getElementById('disp-father').innerText = userData.father || "---";
        document.getElementById('disp-skill').innerText = userData.skill;
        document.getElementById('disp-address').innerText = userData.address;
    }
</script>
</body>
</html>
