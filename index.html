<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYAlife.com</title>
    <style>
        /* बॉडी को पूरा फैलाना */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column; /* सब कुछ एक के नीचे एक लाने के लिए */
            min-height: 100vh;
        }

        /* हेडर (हरा वाला हिस्सा) */
        header {
            background-color: #0c845c;
            color: white;
            text-align: center;
            padding: 20px 10px;
            width: 100%;
            box-sizing: border-box;
        }

        /* मुख्य कंटेनर */
        .container {
            width: 100%;
            max-width: 500px; /* मोबाइल के लिए सही चौड़ाई */
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        /* बैनर इमेज (स्लाइडर एरिया) */
        .banner-box {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .banner-box img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        /* सर्विस कार्ड */
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #0c845c;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price {
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* बटन स्टाइल */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .btn-wa { background: #0c845c; color: white; }
        .btn-form { background: #007bff; color: white; }

    </style>
</head>
<body>

    <header>
        <div style="font-size: 22px; font-weight: bold;">🔥 KRYAlife.com</div>
        <div style="font-size: 14px; opacity: 0.9;">Digital Services & Online Help</div>
    </header>

    <div class="container">
        <div class="banner-box">
            <img src="https://via.placeholder.com/400x150?text=Special+Offers+Live" alt="Banner">
        </div>

        <div class="card">
            <h3>🎨 Logo Design</h3>
            <div class="price">Price: <b>₹49</b> <small>(Limited Time)</small></div>
            <a href="https://wa.me/916379403821" class="btn btn-wa">Order on WhatsApp</a>
            <a href="#" class="btn btn-form">Fill Order Form</a>
        </div>

        <div class="card">
            <h3>📢 WhatsApp Promotion</h3>
            <div class="price">Price: <b>₹49</b></div>
            <a href="https://wa.me/916379403821" class="btn btn-wa">Order on WhatsApp</a>
        </div>
    </div>

</body>
</html>
