<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Enterprise Business Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ff4757; --gold: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; }

        /* UI Elements */
        header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--primary); }
        
        main { min-height: calc(100vh - 140px); padding: 15px; padding-bottom: 100px; }
        .view { display: none; }
        .view.active { display: block; animation: slideIn 0.4s ease-out; }

        /* Dashboard & Cards */
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; text-align: center; }
        .stat-card h2 { font-size: 26px; font-weight: 800; color: var(--dark); }
        .stat-card p { font-size: 11px; color: gray; text-transform: uppercase; font-weight: 600; margin-top: 5px; }

        .card { background: white; border-radius: 28px; padding: 25px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        input, select { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; margin-bottom: 15px; outline: none; background: #f8fafc; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: #fff; }

        /* Buttons */
        .btn { width: 100%; padding: 16px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2); }
        .btn-live { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1.5px solid #eee; }

        /* Service & Order Items */
        .service-item { background: white; border-radius: 28px; overflow: hidden; margin-bottom: 25px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; position: relative; }
        .service-img { width: 100%; height: 220px; object-fit: cover; }
        .discount-badge { position: absolute; top: 15px; left: 15px; background: var(--red); color: white; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; z-index: 10; }

        .order-card { background: #fff; padding: 18px; border-radius: 20px; margin-bottom: 15px; border-left: 6px solid var(--accent); }
        .status-pill { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-paid { background: #dcfce7; color: #15803d; }
        .status-pending { background: #fef3c7; color: #d97706; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #eee; padding: 15px 0 30px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--accent); transform: translateY(-3px); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header" style="display: none;">
    <div class="brand">KRYA<span>LIVE</span></div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; padding: 4px 12px; border-radius: 20px; background: var(--accent);">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div style="text-align: center; padding-top: 120px;">
            <div style="width: 80px; height: 80px; background: var(--primary); border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);">
                <i class="fas fa-shield-check fa-2x" style="color: white;"></i>
            </div>
            <h2 style="font-weight: 800; font-size: 28px;">KRYALIVE Hub</h2>
            <p style="color: gray; margin-bottom: 50px; font-size: 14px;">सुरक्षित व्यापार, असली तरक्की।</p>
            <button class="btn btn-outline" id="login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google के साथ जुड़ें
            </button>
        </div>
    </section>

    <section id="view-admin" class="view">
        <div class="stat-grid">
            <div class="stat-card"><h2><span id="stat-orders">0</span></h2><p>ऑर्डर्स</p></div>
            <div class="stat-card"><h2><span id="stat-subs">0</span></h2><p>ग्राहक</p></div>
            <div class="stat-card" style="grid-column: span 2; border-bottom-color: var(--primary);">
                <h2>₹<span id="stat-rev">0</span></h2><p>कुल राजस्व (Paid)</p>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 15px;">नई सर्विस जोड़ें</h3>
            <input type="text" id="s-name" placeholder="नाम">
            <input type="number" id="s-mrp" placeholder="MRP">
            <input type="number" id="s-price" placeholder="सेलिंग प्राइस (Amount)">
            <input type="text" id="s-img" placeholder="फोटो URL">
            <button class="btn btn-live" id="btn-publish"><i class="fas fa-plus-circle"></i> लाइव पब्लिश करें</button>
        </div>

        <h3>ऑर्डर मैनेजमेंट</h3>
        <div id="admin-orders-list" style="margin-top: 15px;"></div>
    </section>

    <section id="view-store" class="view">
        <h3 id="user-greet" style="font-weight: 800; margin-bottom: 20px;">नमस्ते!</h3>
        <div id="store-list"></div>
    </section>

    <section id="view-orders" class="view">
        <h3 style="margin-bottom: 20px;">मेरे ऑर्डर्स (Tracking)</h3>
        <div id="user-orders-list"></div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav" style="display: none;">
    <button class="nav-item active" id="n-store" onclick="nav('store')"><i class="fas fa-grid-2"></i><span>Store</span></button>
    <button class="nav-item" id="n-orders" onclick="nav('orders')"><i class="fas fa-receipt"></i><span>Orders</span></button>
    <button class="nav-item" id="n-admin" style="display: none;" onclick="nav('admin')"><i class="fas fa-user-crown"></i><span>Admin</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, onSnapshot, query, orderBy, serverTimestamp, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    const RAZORPAY_KEY = "rzp_test_YOUR_KEY"; // अपनी Razorpay ID डालें
    let user = null, isOwner = false;

    const toast = (m, c="var(--primary)") => Toastify({text: m, duration: 3000, style: {background: c, borderRadius: "18px"}}).showToast();

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        document.getElementById('n-' + id).classList.add('active');
        if(id === 'orders') loadUserOrders();
    };

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async u => {
        if(u) {
            user = u;
            isOwner = u.email === OWNER_EMAIL;
            await setDoc(doc(db, "subscribers", u.uid), { name: u.displayName, email: u.email, lastSeen: serverTimestamp() }, { merge: true });

            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('app-nav').style.display = 'flex';
            document.getElementById('n-admin').style.display = isOwner ? 'block' : 'none';
            document.getElementById('role-badge').innerText = isOwner ? "OWNER" : "USER";
            document.getElementById('user-greet').innerText = "नमस्ते, " + u.displayName.split(' ')[0] + "!";
            
            nav('store');
            loadStore();
            if(isOwner) loadAdminStats();
        } else { nav('auth'); }
    });

    // 💰 RAZORPAY INTEGRATION
    window.initiatePayment = (sName, sPrice, sCode) => {
        const options = {
            key: RAZORPAY_KEY,
            amount: sPrice * 100, // पैसा पैसे में होता है
            currency: "INR",
            name: "KRYALIVE",
            description: sName,
            handler: async function (response) {
                await createOrder(sName, sPrice, sCode, response.razorpay_payment_id);
            },
            prefill: { name: user.displayName, email: user.email },
            theme: { color: "#2563eb" }
        };
        const rzp = new Razorpay(options);
        rzp.open();
    };

    async function createOrder(n, p, c, payId) {
        const oID = "KRYA-" + Math.floor(1000 + Math.random() * 9000);
        await addDoc(collection(db, "orders"), {
            orderID: oID, serviceCode: c, serviceName: n, amount: p,
            userEmail: user.email, userName: user.displayName,
            paymentId: payId, status: "Paid", createdAt: serverTimestamp()
        });
        toast("भुगतान सफल! ऑर्डर दर्ज हो गया।");
        window.open(`https://wa.me/919122501657?text=Payment Success! OrderID: ${oID}`, '_blank');
    }

    // --- ADMIN LOGIC ---
    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const price = document.getElementById('s-price').value;
        const mrp = document.getElementById('s-mrp').value;
        const img = document.getElementById('s-img').value;
        const sCode = "KRYA-S-" + Math.floor(100 + Math.random() * 900);

        if(!name || !price) return toast("विवरण भरें", "var(--red)");
        await addDoc(collection(db, "services"), { name, mrp, price, img, serviceCode: sCode, createdAt: serverTimestamp() });
        toast("सर्विस लाइव हो गई!");
    };

    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                const discount = Math.round(((s.mrp - s.price) / s.mrp) * 100);
                list.innerHTML += `
                    <div class="service-item">
                        <div class="discount-badge">${discount}% OFF</div>
                        <img src="${s.img}" class="service-img">
                        <div style="padding: 20px;">
                            <small style="color:gray;">${s.serviceCode}</small>
                            <h4 style="font-weight: 800; margin: 5px 0;">${s.name}</h4>
                            <div style="margin-bottom: 15px;">
                                <span style="font-size: 24px; font-weight: 800; color: var(--primary);">₹${s.price}</span>
                                <span style="text-decoration: line-through; color: gray; font-size: 14px; margin-left: 10px;">₹${s.mrp}</span>
                            </div>
                            <button class="btn btn-primary" onclick="initiatePayment('${s.name}', '${s.price}', '${s.serviceCode}')">अभी खरीदें</button>
                        </div>
                    </div>`;
            });
        });
    }

    function loadUserOrders() {
        const q = query(collection(db, "orders"), where("userEmail", "==", user.email), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const list = document.getElementById('user-orders-list');
            list.innerHTML = snap.empty ? "<p>कोई ऑर्डर नहीं मिला।</p>" : "";
            snap.forEach(d => {
                const o = d.data();
                list.innerHTML += `
                    <div class="order-card">
                        <span class="status-pill status-paid">${o.status}</span>
                        <div style="margin-top:10px;">
                            <b>${o.serviceName}</b><br>
                            <small>ID: ${o.orderID} | ₹${o.amount}</small>
                        </div>
                    </div>`;
            });
        });
    }

    function loadAdminStats() {
        onSnapshot(collection(db, "orders"), snap => {
            document.getElementById('stat-orders').innerText = snap.size;
            let rev = 0; snap.forEach(d => rev += Number(d.data().amount));
            document.getElementById('stat-rev').innerText = rev;
            
            const list = document.getElementById('admin-orders-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const o = d.data();
                list.innerHTML += `
                    <div class="card" style="padding:15px; font-size:12px;">
                        <b>${o.userName}</b> - ${o.serviceName}<br>
                        Status: ${o.status} | ₹${o.amount}
                        <div style="margin-top:10px; display:flex; gap:10px;">
                            <button class="btn btn-live" style="padding:5px; height:auto;" onclick="updateStatus('${d.id}', 'Approved')">Approve</button>
                        </div>
                    </div>`;
            });
        });
        onSnapshot(collection(db, "subscribers"), snap => document.getElementById('stat-subs').innerText = snap.size);
    }

    window.updateStatus = async (id, s) => {
        await updateDoc(doc(db, "orders", id), { status: s });
        toast("ऑर्डर अपडेट!");
    };
</script>
</body>
    </html>
