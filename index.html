<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - World Class</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --krya-bg: #0b1426; --krya-gold: #d4af37; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--krya-bg); overflow: hidden; height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: white; display: flex; flex-direction: column; position: relative; }
        
        /* Header */
        .header { background: var(--krya-bg); padding: 20px; text-align: center; color: var(--krya-gold); }
        .header h1 { font-size: 24px; letter-spacing: 2px; }

        /* Chat Window */
        .chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e5ddd5; z-index: 1000; display: none; flex-direction: column; }
        .chat-header { background: var(--krya-bg); padding: 15px; color: var(--krya-gold); display: flex; align-items: center; gap: 15px; }
        
        /* Message Area */
        .message-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        
        /* व्हाट्सएप स्टाइल बबल्स */
        .bubble { padding: 10px 15px; border-radius: 12px; max-width: 75%; font-size: 15px; line-height: 1.4; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        /* आपका मैसेज (Right Side) */
        .msg-me { align-self: flex-end; background: #dcf8c6; color: #000; border-top-right-radius: 2px; }
        /* दूसरे का मैसेज (Left Side) */
        .msg-them { align-self: flex-start; background: #ffffff; color: #000; border-top-left-radius: 2px; }

        .msg-user { font-size: 10px; font-weight: bold; margin-bottom: 3px; display: block; }
        .user-me { color: #075e54; }
        .user-them { color: #d4af37; }

        /* Input Bar */
        .input-bar { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; align-items: center; }
        .input-bar input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .send-btn { background: var(--krya-bg); color: var(--krya-gold); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* Welcome Page */
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--krya-bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .login-input { width: 80%; padding: 15px; margin: 15px 0; border-radius: 10px; border: none; }
        .login-btn { background: var(--krya-gold); color: black; padding: 15px 40px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color:var(--krya-gold); margin-bottom: 10px;">KRYA</h1>
    <p style="color:white; margin-bottom: 30px;">अपना नाम डालें और चैटिंग शुरू करें</p>
    <input type="text" id="user-name" class="login-input" placeholder="आपका नाम (जैसे: मुकेश)">
    <button class="login-btn" onclick="startApp()">प्रवेश करें</button>
</div>

<div class="app-container">
    <div class="header"><h1>KRYA Portal</h1></div>
    <div style="padding: 20px; text-align: center;">
        <button onclick="openChat('global', 'Global Chat')" style="padding: 15px; width: 100%; border-radius: 10px; border: 2px solid var(--krya-gold); background: var(--krya-bg); color: white; cursor: pointer;">
            <i class="fas fa-globe"></i> Global Chat खोलें
        </button>
    </div>
</div>

<div id="chat-overlay" class="chat-overlay">
    <div class="chat-header">
        <i class="fas fa-arrow-left" onclick="closeChat()"></i>
        <h3 id="chat-title"></h3>
    </div>
    <div class="message-flow" id="message-flow"></div>
    <div class="input-bar">
        <input type="text" id="chat-input" placeholder="संदेश लिखें...">
        <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
      authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
      projectId: "sample-firebase-ai-app-37d2b",
      storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
      messagingSenderId: "652996597348",
      appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let myName = "";

    window.startApp = () => {
        const input = document.getElementById('user-name').value.trim();
        if(!input) return alert("कृपया नाम डालें");
        myName = input;
        document.getElementById('login-screen').style.display = 'none';
    };

    let unsubscribe = null;

    window.openChat = (type, title) => {
        document.getElementById('chat-overlay').style.display = 'flex';
        document.getElementById('chat-title').innerText = title;
        
        const q = query(collection(db, "messages"), orderBy("time", "asc"));
        
        unsubscribe = onSnapshot(q, snap => {
            const flow = document.getElementById('message-flow');
            flow.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                // मुख्य लॉजिक: अगर मैसेज भेजने वाला 'मेरा नाम' है तो Right, वर्ना Left
                const isMe = m.user === myName;
                
                const div = document.createElement('div');
                div.className = `bubble ${isMe ? 'msg-me' : 'msg-them'}`;
                div.innerHTML = `
                    <small class="msg-user ${isMe ? 'user-me' : 'user-them'}">${m.user}</small>
                    ${m.text}
                `;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        });
    };

    document.getElementById('send-btn').onclick = async () => {
        const txt = document.getElementById('chat-input').value.trim();
        if(!txt) return;
        document.getElementById('chat-input').value = "";
        await addDoc(collection(db, "messages"), {
            text: txt,
            user: myName,
            time: serverTimestamp()
        });
    };

    window.closeChat = () => {
        document.getElementById('chat-overlay').style.display = 'none';
        if(unsubscribe) unsubscribe();
    };
</script>
</body>
</html>
