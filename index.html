<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Digital | Super App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow: hidden; position: fixed; width: 100%; }
        
        .app-shell { height: 100vh; display: flex; flex-direction: column; }
        header { background: #fff; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; padding: 10px 0 25px; z-index: 100; }
        .nav-item { flex: 1; text-align: center; color: #64748b; font-size: 11px; border: none; background: none; outline: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        .card { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #f1f5f9; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; outline: none; margin-bottom: 10px; }

        /* Chat System */
        #chat-container { height: calc(100vh - 250px); display: flex; flex-direction: column; background: #f1f5f9; border-radius: 20px; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 13px; line-height: 1.4; }
        .msg.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: white; color: var(--dark); border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <h2 style="color: var(--dark); font-weight: 800;">KRYA<span style="color:var(--primary)">Digital</span></h2>
        <div id="user-info" style="font-size: 10px; font-weight: 700; color: var(--primary);">● Live</div>
    </header>

    <main id="app-view">
        <section id="view-auth" class="view active">
            <div class="card">
                <h3 style="margin-bottom: 5px;">पंजीकरण / लॉगिन</h3>
                <p style="font-size: 12px; color: gray; margin-bottom: 20px;">सुरक्षित OTP आधारित लॉगिन</p>
                <div id="recaptcha-container"></div>
                <input type="tel" id="phone-number" placeholder="+91 0000000000">
                <button class="btn btn-primary" onclick="sendOTP()" id="otp-btn">OTP भेजें</button>
                
                <div id="otp-section" style="display:none; margin-top: 20px;">
                    <input type="number" id="otp-code" placeholder="6 अंकों का OTP कोड">
                    <button class="btn btn-primary" onclick="verifyOTP()" style="background: var(--primary);">सत्यापित करें</button>
                </div>
            </div>
        </section>

        <section id="view-home" class="view">
            <div class="card" style="background: linear-gradient(135deg, var(--accent), #1e40af); color: white; border:none;">
                <h3>नमस्ते, <span id="display-name">यूजर</span></h3>
                <p style="font-size: 12px; opacity: 0.8;">KRYA डिजिटल परिवार में आपका स्वागत है।</p>
            </div>
            <h4 style="margin: 15px 0 10px;">मेरे डिजिटल ऑर्डर्स</h4>
            <div id="order-history"></div>
        </section>

        <section id="view-store" class="view">
            <h3 style="margin-bottom: 15px;">डिजिटल स्टोर</h3>
            <div id="product-list">
                </div>
        </section>

        <section id="view-chat" class="view">
            <h3 style="margin-bottom: 15px;">KRYA Voice AI</h3>
            <div id="chat-container">
                <div id="messages">
                    <div class="msg ai">नमस्ते! मैं KRYA AI हूँ। मैं आपकी आवाज़ सुनकर भी जवाब दे सकता हूँ।</div>
                </div>
                <div style="padding: 10px; background: white; display: flex; gap: 8px; border-top: 1px solid #eee;">
                    <input type="text" id="ai-input" placeholder="AI से कुछ पूछें..." style="margin:0; border-radius: 25px;">
                    <button onclick="askAI()" style="background: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%;"><i class="fas fa-paper-plane"></i></button>
                    <button onclick="startVoice()" style="background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%;"><i class="fas fa-microphone"></i></button>
                </div>
            </div>
        </section>
    </main>

    <nav class="nav-bar">
        <button class="nav-item" id="nav-home" onclick="showView('home')"><i class="fas fa-home"></i><br>Home</button>
        <button class="nav-item" id="nav-store" onclick="showView('store')"><i class="fas fa-shopping-bag"></i><br>Store</button>
        <button class="nav-item" id="nav-chat" onclick="showView('chat')"><i class="fas fa-robot"></i><br>AI Chat</button>
        <button class="nav-item active" id="nav-auth" onclick="showView('auth')"><i class="fas fa-user-circle"></i><br>Profile</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, onSnapshot, addDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ मुकेश जी, आपकी नई चाबी यहाँ अपडेट कर दी गई है
    const firebaseConfig = {
        apiKey: "AIzaSyCJ_heMnqu6ENYS12hecty9V0IOKQlakFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf48199ba877246cd5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let confirmationResult;
    let currentUserData = null;

    // --- OTP सिस्टम ---
    window.sendOTP = function() {
        const phone = document.getElementById('phone-number').value;
        if(!phone.includes("+91")) { alert("कृपया नंबर से पहले +91 लगायें"); return; }
        
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
        signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
            .then(result => {
                confirmationResult = result;
                document.getElementById('otp-section').style.display = 'block';
                document.getElementById('otp-btn').innerText = "OTP दोबारा भेजें";
                alert("OTP भेज दिया गया है!");
            }).catch(error => { alert("Error: " + error.message); location.reload(); });
    }

    window.verifyOTP = function() {
        const code = document.getElementById('otp-code').value;
        confirmationResult.confirm(code).then(async (result) => {
            const user = result.user;
            await saveUserToDb(user);
            location.reload();
        }).catch(() => alert("गलत OTP!"));
    }

    async function saveUserToDb(user) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if(!snap.exists()) {
            await setDoc(userRef, { uid: user.uid, phone: user.phoneNumber, createdAt: serverTimestamp() });
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUserData = user;
            document.getElementById('display-name').innerText = user.phoneNumber;
            showView('home');
            loadStore();
            loadUserOrders();
        }
    });

    // --- नेविगेशन ---
    window.showView = function(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        document.getElementById('nav-' + viewId).classList.add('active');
    }

    // --- स्टोर और ऑर्डर्स ---
    function loadStore() {
        onSnapshot(collection(db, "products"), snap => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `
                    <div class="card">
                        <h4 style="color:var(--accent)">${p.name}</h4>
                        <p style="font-size:11px; color:gray; margin:5px 0;">${p.desc}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:var(--primary)">₹${p.price}</b>
                            <button onclick="initPay('${doc.id}', ${p.price})" class="btn" style="width:auto; padding:5px 15px; font-size:11px; background:var(--accent); color:white;">अभी खरीदें</button>
                        </div>
                    </div>`;
            });
            if(snap.empty) list.innerHTML = "<p style='text-align:center; font-size:12px; color:gray;'>स्टोर अपडेट हो रहा है...</p>";
        });
    }

    function loadUserOrders() {
        const q = query(collection(db, "orders"), where("uid", "==", currentUserData.uid), orderBy("timestamp", "desc"));
        onSnapshot(q, snap => {
            const list = document.getElementById('order-history');
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div class="card" style="padding:12px; font-size:11px;"><b>ID: ${doc.id.substring(0,8)}</b> | Status: <span style="color:var(--primary)">${d.status}</span></div>`;
            });
            if(snap.empty) list.innerHTML = "<p style='font-size:12px; color:gray;'>कोई ऑर्डर नहीं मिला।</p>";
        });
    }

    // --- AI चैट और आवाज़ ---
    window.askAI = async function() {
        const input = document.getElementById('ai-input');
        const text = input.value.trim();
        if(!text) return;
        addMsg('user', text);
        input.value = "";
        
        // AI रिस्पांस सिम्युलेशन (इसे अपने Gemini API से जोड़ सकते हैं)
        setTimeout(() => {
            const reply = "नमस्ते मुकेश जी, KRYA AI आपकी सेवा में हाजिर है। हम आपके डिजिटल सपनों को सच करेंगे।";
            addMsg('ai', reply);
            const s = new SpeechSynthesisUtterance(reply);
            s.lang = 'hi-IN';
            window.speechSynthesis.speak(s);
        }, 1000);
    }

    function addMsg(s, t) {
        const m = document.getElementById('messages');
        m.innerHTML += `<div class="msg ${s}">${t}</div>`;
        m.scrollTop = m.scrollHeight;
    }

    window.startVoice = function() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        recognition.start();
        recognition.onresult = (e) => {
            document.getElementById('ai-input').value = e.results[0][0].transcript;
            askAI();
        };
    }
</script>

</body>
</html>
