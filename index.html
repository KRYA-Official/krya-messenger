<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KRYA Admin | Secure Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        
        /* Secure Login Screen */
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #0c845c, #086345); display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; color: white; }
        .login-box { background: white; padding: 40px; border-radius: 15px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 400px; width: 90%; }
        .login-box h2 { color: #0c845c; margin-top: 0; }
        .login-box input { width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; box-sizing: border-box; font-family: 'Poppins'; }
        .login-box button { width: 100%; padding: 12px; font-size: 16px; background: #FFD700; color: #333; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-box button:hover { background: #e6c200; }
        .error-msg { color: #d32f2f; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }
        
        /* Dashboard Container */
        #dashboardContainer { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid #0c845c; }
        .header h1 { color: #0c845c; margin: 0; font-size: 22px; }
        .logout-btn { background: #d32f2f; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .filters { margin-bottom: 20px; display: flex; gap: 15px; }
        .filters select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: 'Poppins'; outline: none; }

        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 14px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #0c845c; color: white; }
        
        .btn-sm { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; margin-right: 5px; text-decoration: none; display: inline-block; }
        .btn-verify { background: #28a745; }
        .btn-complete { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-img { background: #6c757d; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2><i class="fas fa-shield-alt"></i> KRYA Admin</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Authorized Personnel Only</p>
            <input type="email" id="adminEmail" placeholder="Enter Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Enter Password" required>
            <button onclick="loginAdmin()" id="loginBtn">Secure Login</button>
            <p class="error-msg" id="errorMsg">Invalid Email or Password!</p>
        </div>
    </div>

    <div id="dashboardContainer">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> KRYA Control Panel</h1>
            <div>
                <span style="margin-right: 20px; font-weight: 600;">Total Orders: <span id="orderCount" style="color:#0c845c;">0</span></span>
                <button class="logout-btn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="filters">
            <select id="filterStatus" onchange="loadOrders()">
                <option value="All">All Orders</option>
                <option value="Pending">Pending Verification</option>
                <option value="Completed">Completed Work</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Client Details</th>
                    <th>Service & Amount</th>
                    <th>UTR No.</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        // 👉 अपना Firebase Config यहाँ डालें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is logged in, show dashboard
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                loadOrders();
            } else {
                // User is not logged in, show login screen
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardContainer').style.display = 'none';
            }
        });

        // Login Logic
        function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            if(!email || !password) return;

            btn.innerText = "Verifying...";
            btn.disabled = true;
            errorMsg.style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    btn.innerText = "Secure Login";
                    btn.disabled = false;
                })
                .catch((error) => {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = error.message;
                    btn.innerText = "Secure Login";
                    btn.disabled = false;
                });
        }

        // Logout Logic
        function logoutAdmin() {
            auth.signOut().then(() => {
                document.getElementById('adminEmail').value = '';
                document.getElementById('adminPassword').value = '';
            }).catch((error) => {
                alert("Error logging out!");
            });
        }

        // Load Orders from Firestore
        function loadOrders() {
            const filter = document.getElementById('filterStatus').value;
            
            db.collection("orders").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                let count = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    if(filter !== "All" && data.orderStatus !== filter && data.paymentStatus !== filter) return;
                    count++;

                    const payBadge = data.paymentStatus === "Verified" ? "badge-success" : "badge-pending";
                    const ordBadge = data.orderStatus === "Completed" ? "badge-success" : "badge-pending";

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${data.orderId}</strong></td>
                            <td>${data.name}<br><small><i class="fab fa-whatsapp"></i> ${data.whatsapp}</small></td>
                            <td>${data.service}<br><strong style="color:#0c845c;">₹${data.amount}</strong></td>
                            <td>${data.utr}</td>
                            <td>
                                Pay: <span class="badge ${payBadge}">${data.paymentStatus}</span><br>
                                Work: <span class="badge ${ordBadge}">${data.orderStatus}</span>
                            </td>
                            <td>
                                <a href="${data.screenshotUrl}" target="_blank" class="btn-sm btn-img"><i class="fas fa-image"></i> Proof</a>
                                ${data.paymentStatus !== "Verified" ? `<button class="btn-sm btn-verify" onclick="updateStatus('${data.orderId}', 'paymentStatus', 'Verified')"><i class="fas fa-check"></i> Verify</button>` : ''}
                                ${data.orderStatus !== "Completed" ? `<button class="btn-sm btn-complete" onclick="updateStatus('${data.orderId}', 'orderStatus', 'Completed')"><i class="fas fa-flag-checkered"></i> Done</button>` : ''}
                                <a href="https://wa.me/91${data.whatsapp}" target="_blank" class="btn-sm btn-wa"><i class="fab fa-whatsapp"></i> Chat</a>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('orderCount').innerText = count;
            });
        }

        // Update Order Status
        async function updateStatus(id, field, value) {
            if(confirm(`Mark ${field} as ${value}?`)) {
                await db.collection("orders").doc(id).update({
                    [field]: value
                });
            }
        }
    </script>
</body>
</html>
