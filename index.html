<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Smart Business Hub</title>
    
    <meta property="og:title" content="KRYALIVE | Smart Business Hub">
    <meta property="og:description" content="Kryalive.com: घर बैठे प्रोफेशनल डिजिटल सर्विसेज। ईमानदारी हमारी पहचान।">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg">
    <meta property="og:url" content="https://kryalive.com">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ff4757; --gold: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; height: 100vh; }
        
        header, .bottom-nav { display: none !important; }
        .view { display: none !important; }
        .view.active { display: block !important; animation: slideUp 0.4s ease; }

        header { background: white; padding: 10px 20px; border-bottom: 1px solid #eee; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .brand { font-size: 20px; font-weight: 800; }
        .brand span { color: var(--primary); }
        
        main { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card { background: #fff; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; background: #f8fafc; outline: none; font-family: inherit; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }

        .service-item { border-radius: 24px; overflow: hidden; background: #fff; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transition: 0.3s; }
        .service-image-container { width: 100%; overflow: hidden; background: #f1f5f9; }
        .service-img { width: 100%; height: 220px; object-fit: cover; display: block; transition: 0.3s ease; }
        @media (min-width: 769px) { .service-img { height: 300px; } }
        .service-item:hover .service-img { transform: scale(1.03); }
        .service-desc { font-size: 12px; color: #475569; margin-bottom: 15px; line-height: 1.5; }

        #v-card { width: 100%; max-width: 350px; height: 200px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 15px; position: relative; margin: 0 auto; overflow: hidden; color: white; text-align: left; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
        .card-photo { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 10px 0 25px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 700; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        /* Verified Tick UI */
        .v-badge { color: var(--accent); margin-left: 5px; font-size: 14px; display: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header">
    <div class="brand-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" class="logo-img">
        <div class="brand">KRYA<span>LIVE</span></div>
    </div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; padding: 5px 12px; border-radius: 20px;">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div style="text-align: center; padding-top: 80px;">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" style="width: 110px; height: 110px; border-radius: 50%; margin-bottom: 20px; border: 3px solid var(--primary);">
            <h2 style="font-weight: 800; font-size: 26px;">नमस्ते!</h2>
            <button class="btn" id="login-btn" style="background: white; color: #000; border: 1.5px solid #eee; width: 85%; margin: 40px auto 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google के साथ शुरू करें
            </button>
        </div>
    </section>

    <section id="view-owner" class="view">
        <div class="stat-grid">
            <div class="stat-card"><i class="fas fa-shopping-cart" style="color:var(--accent);"></i><h2 id="total-ord">0</h2><p>ऑर्डर्स</p></div>
            <div class="stat-card"><i class="fas fa-boxes" style="color:var(--primary);"></i><h2 id="total-services">0</h2><p>कुल सर्विस</p></div>
            <div class="stat-card" style="grid-column: span 2;"><i class="fas fa-wallet" style="color:var(--gold);"></i><h2 id="total-rev">₹0</h2><p>कुल राजस्व</p></div>
        </div>
        <div class="card">
            <h3>नया सर्विस पब्लिश करें</h3>
            <input type="text" id="s-name" placeholder="सर्विस का नाम">
            <input type="number" id="s-mrp" placeholder="MRP">
            <input type="number" id="s-price" placeholder="कीमत">
            <input type="text" id="s-img" placeholder="फोटो लिंक">
            <textarea id="s-desc" placeholder="जानकारी..." rows="3"></textarea>
            <button class="btn btn-primary" id="btn-publish">पब्लिश करें</button>
        </div>
        <div id="admin-product-list"></div>
    </section>

    <section id="view-store" class="view">
        <h3 id="user-greet" style="font-weight: 800;">नमस्ते!</h3>
        <p style="font-size: 12px; color: gray; margin-bottom: 20px;">आपकी डिजिटल तरक्की यहाँ से शुरू होती है।</p>
        <div id="store-list"></div>
    </section>

    <section id="view-orders" class="view">
        <h3 style="margin-bottom: 20px; font-weight: 800;">मेरे ऑर्डर्स</h3>
        <div id="user-orders-display"></div>
    </section>

    <section id="view-profile" class="view">
        <div class="card" style="text-align: center; padding: 20px;">
            <div style="position: relative; width: 80px; margin: 0 auto 10px;">
                <img id="u-photo" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary);">
                <div id="u-v-tick" style="display:none; position: absolute; bottom: 0; right: 0; background: var(--accent); color: white; width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; font-size: 12px; align-items: center; justify-content: center;">
                    <i class="fas fa-check"></i>
                </div>
            </div>
            <h4 id="u-name">Name <i class="fas fa-check-circle v-badge" id="name-v-badge"></i></h4>
            <p id="u-email" style="color: gray; font-size: 11px; margin-bottom: 15px;">email</p>
            
            <button class="btn btn-primary" style="margin-bottom: 20px;" onclick="shareWebsite()"><i class="fas fa-share-alt"></i> KRYALIVE शेयर करें</button>

            <div id="v-card-section" style="margin-bottom: 20px;">
                <div id="v-card">
                    <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: var(--primary); border-radius: 50%; opacity: 0.1;"></div>
                    <div style="padding: 20px; display: flex; gap: 15px; align-items: center; height: 100%;">
                        <img id="card-u-photo" src="" class="card-photo">
                        <div style="flex: 1; z-index: 1;">
                            <h2 id="card-u-name" style="font-size: 16px; margin: 0; font-weight: 800;">NAME</h2>
                            <p id="v-status-text" style="font-size: 9px; color: var(--primary); font-weight: 600; text-transform: uppercase; margin-bottom: 5px;">KRYA Partner</p>
                            <div style="font-size: 10px; opacity: 0.8;">
                                <i class="fas fa-envelope"></i> <span id="card-u-email">email</span><br>
                                <i class="fas fa-globe"></i> Kryalive.com
                            </div>
                        </div>
                    </div>
                    <div style="position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.3); padding: 5px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
                        <span style="font-weight: 800;">KRYA<span style="color:var(--primary)">LIVE</span></span>
                    </div>
                </div>
                <button class="btn" onclick="downloadCard()" style="background: #f1f5f9; color: #475569; margin-top: 10px; font-size: 12px; height: 35px;">
                    <i class="fas fa-download"></i> कार्ड सेव करें
                </button>
            </div>

            <button class="btn" style="background: #fee2e2; color: #ef4444;" id="logout-btn">लॉगआउट</button>
        </div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav">
    <button class="nav-item active" id="n-main" onclick="openMain()"><i class="fas fa-store"></i><span id="n-txt">Store</span></button>
    <button class="nav-item" id="n-orders" onclick="nav('orders')"><i class="fas fa-box"></i><span>Orders</span></button>
    <button class="nav-item" id="n-profile" onclick="nav('profile')"><i class="fas fa-user-circle"></i><span>Profile</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    const WHATSAPP_NUMBER = "916379403821";
    const DOMAIN_NAME = "Kryalive.com";

    let user = null, isOwner = false;

    const showToast = (m, c="var(--primary)") => Toastify({text: m, duration: 3000, style: {background: c, borderRadius: "15px"}}).showToast();

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        const navMap = { 'orders': 'n-orders', 'profile': 'n-profile', 'owner': 'n-main', 'store': 'n-main' };
        document.getElementById(navMap[id]).classList.add('active');
        if(id === 'orders') loadUserOrders();
    };

    window.openMain = () => isOwner ? nav('owner') : nav('store');

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        const header = document.getElementById('app-header');
        const navBar = document.getElementById('app-nav');
        if(u) {
            user = u;
            isOwner = u.email === OWNER_EMAIL;

            // --- वेरिफिकेशन सिस्टम लॉजिक ---
            const userRef = doc(db, "users", u.uid);
            await setDoc(userRef, { 
                name: u.displayName, 
                email: u.email, 
                photo: u.photoURL, 
                lastLogin: serverTimestamp() 
            }, { merge: true });

            onSnapshot(userRef, (snap) => {
                const userData = snap.data();
                const vTick = document.getElementById('u-v-tick');
                const nBadge = document.getElementById('name-v-badge');
                const vStatus = document.getElementById('v-status-text');
                const cardName = document.getElementById('card-u-name');

                if(userData && userData.isVerified === true) {
                    vTick.style.display = "flex";
                    nBadge.style.display = "inline-block";
                    vStatus.innerText = "Verified Partner";
                    vStatus.style.color = "var(--accent)";
                    cardName.innerHTML = `${u.displayName} <i class="fas fa-check-circle" style="color:#2563eb; font-size:12px;"></i>`;
                } else {
                    vTick.style.display = "none";
                    nBadge.style.display = "none";
                    vStatus.innerText = "KRYA Partner";
                    cardName.innerText = u.displayName;
                }
            });

            header.style.setProperty('display', 'flex', 'important');
            navBar.style.setProperty('display', 'flex', 'important');
            
            document.getElementById('u-name').firstChild.textContent = u.displayName + " ";
            document.getElementById('u-email').innerText = u.email;
            document.getElementById('u-photo').src = u.photoURL;
            document.getElementById('card-u-email').innerText = u.email;
            document.getElementById('card-u-photo').src = u.photoURL;

            document.getElementById('role-badge').innerText = isOwner ? "OWNER" : "USER";
            document.getElementById('role-badge').style.background = isOwner ? "var(--accent)" : "var(--primary)";
            document.getElementById('user-greet').innerText = "नमस्ते, " + u.displayName.split(' ')[0] + "!";
            
            openMain();
            loadStore();
            if(isOwner) loadAdminStats();
        } else {
            header.style.setProperty('display', 'none', 'important');
            navBar.style.setProperty('display', 'none', 'important');
            nav('auth');
        }
    });

    window.downloadCard = () => {
        const card = document.getElementById('v-card');
        html2canvas(card, { useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `KRYA-Partner-${user.displayName}.png`;
            link.href = canvas.toDataURL();
            link.click();
            showToast("विजिटिंग कार्ड सेव हुआ!");
        });
    };

    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const mrp = document.getElementById('s-mrp').value;
        const price = document.getElementById('s-price').value;
        const img = document.getElementById('s-img').value;
        const desc = document.getElementById('s-desc').value;
        if(!name || !price) return showToast("विवरण भरें", "var(--red)");
        const sCode = "KRYA-S-" + Math.floor(1000 + Math.random() * 9000);
        await addDoc(collection(db, "services"), { name, mrp, price, img, desc, serviceCode: sCode, createdAt: serverTimestamp() });
        showToast("सफल!");
        document.querySelectorAll('input, textarea').forEach(i => i.value="");
    };

    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-list');
            const adminList = document.getElementById('admin-product-list');
            list.innerHTML = ""; if(isOwner) adminList.innerHTML = "";
            document.getElementById('total-services').innerText = snap.size;

            snap.forEach(d => {
                const s = d.data();
                list.innerHTML += `
                    <div class="service-item">
                        <div class="service-image-container">
                            <img src="${s.img || 'https://via.placeholder.com/400x200'}" class="service-img">
                        </div>
                        <div style="padding: 15px;">
                            <h4 style="font-weight: 800; font-size: 16px;">${s.name}</h4>
                            <div style="margin: 5px 0 12px; display:flex; align-items:baseline; gap:8px;">
                                <span style="font-size: 20px; font-weight: 800; color: var(--primary);">₹${s.price}</span>
                                ${s.mrp ? `<span style="text-decoration:line-through; color:gray; font-size:12px;">₹${s.mrp}</span>` : ''}
                            </div>
                            <p class="service-desc">${s.desc || ''}</p>
                            <button class="btn btn-primary" onclick="buyNow('${s.name}', '${s.price}', '${s.serviceCode}')">अभी खरीदें</button>
                        </div>
                    </div>`;
                if(isOwner) {
                    adminList.innerHTML += `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:10px;">
                            <div><b>${s.name}</b></div>
                            <button class="btn" style="background:#fee2e2;color:red;width:auto;padding:5px 10px;" onclick="deleteProduct('${d.id}')">हटाएं</button>
                        </div>`;
                }
            });
        });
    }

    window.buyNow = async (n, p, c) => {
        const oID = "KRYA-ORD-" + Math.floor(1000 + Math.random() * 9000);
        await
