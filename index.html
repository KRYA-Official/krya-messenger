<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA PRO SUPER APP</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --success: #22c55e; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        /* स्क्रीन फिक्स: कीबोर्ड खुलने पर भी दिक्कत नहीं होगी */
        body, html { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

        #app-root { display: flex; flex-direction: column; height: 100vh; width: 100%; }

        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
        
        .news-ticker { background: #1e3a8a; color: var(--primary); padding: 5px; font-weight: bold; overflow: hidden; }

        /* मुख्य एरिया जहाँ सब दिखेगा */
        .main-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }

        /* ID कार्ड स्टाइल */
        .id-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--primary); border-radius: 15px; padding: 15px; position: relative; }
        .id-photo { width: 80px; height: 100px; border-radius: 8px; border: 1px solid var(--primary); object-fit: cover; }

        /* चैट सिस्टम फिक्स */
        #tab-chat { display: none; flex-direction: column; height: 100%; }
        .chat-flow { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; }
        .msg-me { align-self: flex-end; background: var(--primary); color: #000; }
        .msg-them { align-self: flex-start; background: var(--card); }

        /* इनपुट बॉक्स जो कभी नहीं दबेगा */
        .chat-input-footer { 
            background: var(--card); padding: 10px; display: flex; gap: 8px; 
            border-top: 1px solid #334155; margin-bottom: 60px; /* नेविगेशन के लिए जगह */
        }
        .chat-input-footer input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: white; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; padding: 10px 0; border-top: 1px solid #334155; }
        .nav-item { flex: 1; text-align: center; color: #94a3b8; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        .btn-p { background: var(--primary); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-root">
    <div class="header">
        <b style="color:var(--primary);">KRYA PRO</b>
        <span>🪙 <span id="balance">700</span></span>
    </div>

    <div class="news-ticker">
        <marquee>🚀 KRYA प्रो मॉल लाइव है! अपना 3D लोगो बनवाएं | मुकेश राय की पहल...</marquee>
    </div>

    <div class="main-content">
        <div id="tab-home">
            <div class="id-card">
                <div style="display:flex; gap:12px;">
                    <img id="card-img" src="https://via.placeholder.com/80" class="id-photo">
                    <div>
                        <h4 id="u-name" style="color:var(--primary);">मुकेश राय</h4>
                        <p id="u-skill" style="font-size:12px;">टेक स्पेशलिस्ट</p>
                        <p id="u-addr" style="font-size:11px;">📍 बांका, बिहार</p>
                    </div>
                </div>
            </div>
            <button class="btn-p" style="margin-top:20px; background:#8b5cf6; color:white;" onclick="alert('मॉल खुल रहा है...')">🛍️ क्रांतिकारी मॉल</button>
        </div>

        <div id="tab-chat">
            <div class="chat-flow" id="chat-box">
                </div>
            <div class="chat-input-footer">
                <input type="text" id="m-input" placeholder="संदेश लिखें...">
                <button onclick="sendMsg()" style="background:var(--primary); border:none; padding:10px; border-radius:8px;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="n-home" onclick="go('home')"><i class="fas fa-id-card"></i><br>आईडी</div>
        <div class="nav-item" id="n-chat" onclick="go('chat')"><i class="fas fa-comments"></i><br>चैट</div>
        <div class="nav-item" onclick="alert('सेटिंग्स जल्द आएगी')"><i class="fas fa-cog"></i><br>सेटिंग्स</div>
    </div>
</div>

<script>
    function go(t) {
        document.getElementById('tab-home').style.display = t === 'home' ? 'block' : 'none';
        document.getElementById('tab-chat').style.display = t === 'chat' ? 'flex' : 'none';
        document.getElementById('n-home').classList.toggle('active', t === 'home');
        document.getElementById('n-chat').classList.toggle('active', t === 'chat');
    }

    function sendMsg() {
        const inp = document.getElementById('m-input');
        if(!inp.value) return;
        const div = document.createElement('div');
        div.className = 'msg msg-me';
        div.innerText = inp.value;
        document.getElementById('chat-box').appendChild(div);
        inp.value = "";
        const box = document.getElementById('chat-box');
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
