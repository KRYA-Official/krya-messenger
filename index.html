<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Professional Business Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ff4757; --gold: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; width: 100%; height: 100vh; }
        
        /* Glassmorphism Header */
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--primary); }
        
        main { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.4s ease; }

        /* Modern Dashboard Cards */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 24px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-bottom: 4px solid var(--accent); transition: 0.3s; }
        .stat-card i { font-size: 20px; margin-bottom: 10px; color: var(--accent); }
        .stat-card h2 { font-size: 24px; font-weight: 800; color: var(--dark); }
        .stat-card p { font-size: 10px; color: gray; font-weight: 600; text-transform: uppercase; }

        /* Forms & Inputs */
        .card { background: #fff; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 20px; border: 1px solid #f1f5f9; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; font-size: 14px; outline: none; margin-bottom: 12px; background: #f8fafc; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: #fff; }

        /* Action Buttons */
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.2); }
        .btn-live { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; text-decoration: none; }

        /* Store Listing */
        .service-item { position: relative; border-radius: 26px; overflow: hidden; background: #fff; margin-bottom: 25px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
        .service-img { width: 100%; height: 200px; object-fit: cover; transition: 0.5s; }
        .service-item:hover .service-img { transform: scale(1.05); }
        .discount-tag { position: absolute; top: 15px; left: 15px; background: var(--red); color: white; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; z-index: 10; }

        /* Order Row */
        .order-row { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--accent); font-size: 12px; }
        .order-status { float: right; padding: 2px 8px; border-radius: 5px; font-weight: 800; text-transform: uppercase; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #eee; padding: 12px 0 25px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 4px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header" style="display: none;">
    <div class="brand">KRYA<span>LIVE</span></div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; padding: 5px 15px; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div style="text-align: center; padding-top: 100px;">
            <div style="width: 100px; height: 100px; background: #fff; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <i class="fas fa-rocket fa-3x" style="color: var(--accent);"></i>
            </div>
            <h2 style="font-weight: 800; font-size: 28px;">नमस्ते!</h2>
            <p style="color: gray; margin-bottom: 50px;">KRYALIVE के डिजिटल सफर में आपका स्वागत है।</p>
            <button class="btn btn-primary" id="login-btn" style="background: white; color: #000; border: 1.5px solid #eee;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google के साथ शुरू करें
            </button>
        </div>
    </section>

    <section id="view-owner" class="view">
        <div class="stat-grid">
            <div class="stat-card"><i class="fas fa-shopping-cart"></i><h2 id="total-ord">0</h2><p>कुल ऑर्डर</p></div>
            <div class="stat-card"><i class="fas fa-users"></i><h2 id="total-subs">0</h2><p>सब्सक्राइबर्स</p></div>
            <div class="stat-card" style="grid-column: span 2;"><i class="fas fa-wallet"></i><h2 id="total-rev">₹0</h2><p>कुल राजस्व</p></div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 15px;">नई सर्विस पब्लिश करें</h3>
            <input type="text" id="s-name" placeholder="सर्वis का नाम">
            <input type="number" id="s-mrp" placeholder="MRP (कटी हुई कीमत)">
            <input type="number" id="s-price" placeholder="अमाउंट (असली कीमत)">
            <input type="text" id="s-img" placeholder="प्रोफेशनल फोटो लिंक">
            <button class="btn btn-live" id="btn-publish"><i class="fas fa-bullhorn"></i> स्टोर में लाइव करें</button>
        </div>

        <div class="card">
            <h3>हाल के ऑर्डर मैनेज करें</h3>
            <div id="admin-orders-list" style="margin-top: 15px;">
                <p style="text-align: center; color: gray;">ऑर्डर लोड हो रहे हैं...</p>
            </div>
        </div>
    </section>

    <section id="view-store" class="view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h3 id="user-greet" style="font-weight: 800;">नमस्ते!</h3>
                <p style="font-size: 12px; color: gray;">आपके लिए बेस्ट डील्स यहाँ हैं।</p>
            </div>
            <div style="background: var(--gold); color: white; padding: 5px 12px; border-radius: 10px; font-size: 10px; font-weight: 800;"><i class="fas fa-crown"></i> VIP</div>
        </div>
        <div id="store-list"></div>
    </section>

    <section id="view-profile" class="view">
        <div class="card" style="text-align: center; padding: 40px 20px;">
            <img id="u-photo" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
            <h4 id="u-name" style="font-size: 20px; font-weight: 800;">Name</h4>
            <p id="u-email" style="color: gray; font-size: 13px; margin-bottom: 40px;">email@example.com</p>
            <button class="btn" style="background: #fee2e2; color: #ef4444;" id="logout-btn"><i class="fas fa-sign-out-alt"></i> सुरक्षित लॉगआउट</button>
        </div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav" style="display: none;">
    <button class="nav-item active" id="n-main" onclick="openMain()"><i class="fas fa-store"></i><span id="n-txt">Store</span></button>
    <button class="nav-item" id="n-profile" onclick="nav('profile')"><i class="fas fa-user-circle"></i><span>Profile</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, onSnapshot, query, orderBy, serverTimestamp, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    const WHATSAPP_NUMBER = "919122501657";
    let user = null, isOwner = false;

    // EmailJS Initialize
    emailjs.init("YOUR_PUBLIC_KEY"); 

    const showToast = (msg, color = "var(--primary)") => {
        Toastify({ text: msg, duration: 3000, style: { background: color, borderRadius: "15px" } }).showToast();
    };

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        document.getElementById(id === 'owner' || id === 'store' ? 'n-main' : 'n-' + id).classList.add('active');
    };

    window.openMain = () => isOwner ? nav('owner') : nav('store');

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        if(u) {
            user = u;
            isOwner = u.email === OWNER_EMAIL;
            
            // Subscriber Management
            await setDoc(doc(db, "subscribers", u.uid), { name: u.displayName, email: u.email, lastSeen: serverTimestamp() }, { merge: true });

            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('app-nav').style.display = 'flex';
            document.getElementById('u-name').innerText = u.displayName;
            document.getElementById('u-email').innerText = u.email;
            document.getElementById('u-photo').src = u.photoURL;
            document.getElementById('role-badge').innerText = isOwner ? "OWNER" : "USER";
            document.getElementById('role-badge').style.background = isOwner ? "var(--accent)" : "var(--primary)";
            document.getElementById('n-txt').innerText = isOwner ? "Admin" : "Store";
            
            document.getElementById('user-greet').innerText = "नमस्ते, " + u.displayName.split(' ')[0] + "!";
            
            openMain();
            loadStore();
            if(isOwner) loadAdminStats();
        } else { nav('auth'); }
    });

    // --- OWNER: Publish Service & Notify ---
    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const price = document.getElementById('s-price').value;
        const mrp = document.getElementById('s-mrp').value;
        const img = document.getElementById('s-img').value;

        if(!name || !price) return showToast("कृपया नाम और कीमत भरें", "var(--red)");

        try {
            await addDoc(collection(db, "services"), { name, mrp, price, img, createdAt: serverTimestamp() });
            showToast("सफलता! नया प्रोडक्ट लाइव हो गया।");
            // Clear inputs
            document.querySelectorAll('input').forEach(i => i.value = "");
        } catch (e) { showToast(e.message, "var(--red)"); }
    };

    // --- USER: Buy System ---
    window.buyNow = async (sName, sPrice) => {
        if(!user) return;
        try {
            const orderRef = await addDoc(collection(db, "orders"), {
                orderID: "KRYA-" + Math.floor(1000 + Math.random() * 9000),
                userName: user.displayName,
                userEmail: user.email,
                serviceName: sName,
                amount: sPrice,
                status: "Pending",
                createdAt: serverTimestamp()
            });
            
            const waMsg = `नमस्ते KRYALIVE!%0Aमैंने ऑर्डर किया है: ${sName}%0Aकीमत: ₹${sPrice}%0Aनाम: ${user.displayName}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`, '_blank');
            showToast("ऑर्डर दर्ज! व्हाट्सएप चेक करें।");
        } catch (e) { showToast("ऑर्डर एरर", "var(--red)"); }
    };

    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                const discount = s.mrp ? Math.round(((s.mrp - s.price) / s.mrp) * 100) : 0;
                list.innerHTML += `
                    <div class="service-item">
                        ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                        <img src="${s.img || 'https://via.placeholder.com/400x200'}" class="service-img" loading="lazy">
                        <div style="padding: 20px;">
                            <h4 style="font-weight: 800;">${s.name}</h4>
                            <div style="margin: 10px 0; display:flex; align-items:baseline; gap:8px;">
                                <span style="font-size: 24px; font-weight: 800; color: var(--primary);">₹${s.price}</span>
                                ${s.mrp ? `<span style="text-decoration: line-through; color: gray; font-size: 14px;">₹${s.mrp}</span>` : ''}
                            </div>
                            <button class="btn btn-primary" onclick="buyNow('${s.name}', '${s.price}')">
                                <i class="fas fa-shopping-cart"></i> अभी खरीदें
                            </button>
                        </div>
                    </div>`;
            });
        });
    }

    // --- ADMIN: Orders & Stats ---
    function loadAdminStats() {
        // Orders Monitor
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('admin-orders-list');
            let revenue = 0; list.innerHTML = "";
            document.getElementById('total-ord').innerText = snap.size;
            
            snap.forEach(d => {
                const o = d.data();
                if(o.status === "Approved") revenue += Number(o.amount);
                
                list.innerHTML += `
                    <div class="order-row">
                        <span class="order-status" style="color: ${o.status==='Approved'?'var(--primary)':'var(--gold)'}">${o.status}</span>
                        <b>${o.serviceName}</b><br>
                        ग्राहक: ${o.userName}<br>
                        <button onclick="updateOrder('${d.id}', 'Approved')" style="margin-top:5px; font-size:10px; padding:2px 8px; border-radius:5px; border:none; background:var(--primary); color:white;">Approve</button>
                    </div>`;
            });
            document.getElementById('total-rev').innerText = "₹" + revenue;
        });

        onSnapshot(collection(db, "subscribers"), snap => document.getElementById('total-subs').innerText = snap.size);
    }

    window.updateOrder = async (id, status) => {
        await updateDoc(doc(db, "orders", id), { status });
        showToast("ऑर्डर अपडेट!");
    };
</script>
</body>
</html>
