<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Digital - Premium Services</title>
    <style>
        body {
            background-color: #002D04; /* Monaco Green */
            color: #D4AF37; /* Gold */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(0, 45, 4, 0.9);
            border: 2px solid #D4AF37;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .logo-container {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #D4AF37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.05);
        }
        h1 {
            font-size: 2.8em;
            margin: 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 1.1em;
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        .services-box {
            text-align: left;
            background: rgba(212, 175, 55, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .services-box h3 {
            margin-top: 0;
            color: #D4AF37;
            border-left: 4px solid #D4AF37;
            padding-left: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 8px 0;
            font-size: 1.1em;
        }
        li::before {
            content: "✦ ";
            color: #D4AF37;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #002D04;
            padding: 16px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #F6E27A 0%, #D4AF37 100%);
        }
        footer {
            margin-top: 30px;
            font-size: 0.8em;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <a href="https://kryalive.com">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg" 
                     alt="KRYA Digital Logo" class="logo-img">
            </a>
        </div>

        <h1>KRYA Digital</h1>
        <p class="tagline">प्रोफेशनल डिजिटल सर्विसेज और वेब डेवलपमेंट सॉल्यूशंस</p>

        <div class="services-box">
            <h3>हमारी प्रीमियम सेवाएँ:</h3>
            <ul>
                <li>कस्टम वेबसाइट डेवलपमेंट</li>
                <li>SEO और डिजिटल मार्केटिंग</li>
                <li>ब्लॉग सेटअप और कस्टमाइजेशन</li>
                <li>UI/UX डिज़ाइन</li>
            </ul>
        </div>

        <a href="mailto:krya.global@gmail.com" class="btn">हमसे संपर्क करें</a>

        <footer>
            &copy; 2026 KRYA. सर्वाधिकार सुरक्षित।
        </footer>
    </div>
</body>
</html>
