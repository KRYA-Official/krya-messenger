<style>
    /* नेविगेशन बार को हमेशा नीचे फिक्स रखने के लिए */
    .bottom-nav { 
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 70px; /* फिक्स हाइट */
        background: white; 
        display: flex; 
        justify-content: space-around; 
        align-items: center; 
        border-top: 1px solid #eee; 
        z-index: 1000; /* सबसे ऊपर रखने के लिए */
        padding-bottom: env(safe-area-inset-bottom); /* iPhone/Android नेविगेशन बार के लिए जगह */
    }

    /* ऐप के कंटेंट को नेविगेशन के पीछे छिपने से बचाने के लिए */
    .content-card { 
        flex: 1; 
        background: white; 
        border-top-left-radius: 40px; 
        border-top-right-radius: 40px; 
        margin-top: 15px; 
        padding: 20px 10px 80px 10px; /* नीचे 80px का गैप ताकि बटन कंटेंट को न ढकें */
        overflow-y: auto; 
    }

    .nav-item { 
        flex: 1; 
        text-align: center; 
        color: #9ca3af; 
        font-size: 11px; 
        cursor: pointer; 
        padding: 5px 0;
    }

    .nav-item i { 
        font-size: 20px; 
        display: block; 
        margin-bottom: 3px; 
    }

    .nav-item.active { 
        color: var(--krya-navy); 
        font-weight: bold; 
    }

    /* फ्लोटिंग बटन (+) को भी थोड़ा ऊपर सेट किया गया है */
    .fab-add { 
        position: fixed; 
        bottom: 90px; /* नेविगेशन बार से ठीक ऊपर */
        right: 20px; 
        width: 55px; 
        height: 55px; 
        background: var(--krya-navy); 
        color: var(--krya-gold); 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 24px; 
        border: 2px solid var(--krya-gold); 
        box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        z-index: 999; 
    }
</style>

<div id="app-main" class="app-container hidden">
    <div class="fab-add"><i class="fas fa-plus"></i></div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-globe"></i>Feed</div>
        <div class="nav-item"><i class="fas fa-users"></i>Family</div>
        <div class="nav-item"><i class="fas fa-shield-alt"></i>Security</div>
        <div class="nav-item" onclick="openRegistry()"><i class="fas fa-file-contract"></i>Registry</div>
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-user-circle"></i>Account</div>
    </div>
</div>
