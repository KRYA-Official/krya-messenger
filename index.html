<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - बिजनेस एडिशन</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        .header { background: var(--card); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #334155; }
        .brand { font-weight: 900; color: var(--primary); font-size: 24px; letter-spacing: 2px; }
        
        #main-content { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; }
        .search-bar { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; margin-bottom: 15px; }

        /* Market Cards */
        .user-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        
        /* Fixed Chat Overlays */
        .chat-view { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .chat-head { background: var(--card); padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #334155; }
        .msg-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-item { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; }
        .msg-item.sent { align-self: flex-end; background: var(--primary); color: #000; }
        .msg-item.received { align-self: flex-start; background: #334155; color: #fff; }
        
        .input-box { background: var(--card); padding: 15px; display: flex; gap: 10px; }
        .btn-send { background: var(--primary); border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="brand">KRYA</div>
        <div id="user-display" style="color:var(--primary); font-size:12px;"></div>
    </div>

    <div id="main-content">
        <input type="text" id="search" class="search-bar" placeholder="हुनरमंदों को खोजें..." onkeyup="doSearch()">
        <div id="market"></div>
    </div>

    <div id="global-overlay" class="chat-view">
        <div class="chat-head"><i class="fas fa-arrow-left" onclick="closeChat('global-overlay')"></i> <b>ग्लोबल चैट 🇮🇳</b></div>
        <div id="g-messages" class="msg-list"></div>
        <div class="input-box">
            <input type="text" id="g-input" class="search-bar" style="margin:0" placeholder="मैसेज लिखें...">
            <button class="btn-send" id="btn-g-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-home"></i><br>होम</div>
        <div class="nav-item" onclick="showGlobalChat()"><i class="fas fa-comments"></i><br>ग्लोबल चैट</div>
        <div class="nav-item" onclick="window.open('https://wa.me/916379403821')"><i class="fas fa-headset"></i><br>सपोर्ट</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
      authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
      projectId: "sample-firebase-ai-app-37d2b",
      storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
      messagingSenderId: "652996597348",
      appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // मुकेश जी, यहाँ हम यूजर का नाम सेट कर रहे हैं
    const myName = "Mukesh Rai"; 
    document.getElementById('user-display').innerText = "@" + myName;

    // 1. ग्लोबल मैसेज भेजने का फंक्शन
    async function sendGlobal() {
        const text = document.getElementById('g-input').value;
        if(!text) return;
        await addDoc(collection(db, "global_chat"), {
            user: myName,
            msg: text,
            time: serverTimestamp()
        });
        document.getElementById('g-input').value = "";
    }

    document.getElementById('btn-g-send').onclick = sendGlobal;

    // 2. ग्लोबल मैसेज लाइव दिखाने का फंक्शन
    onSnapshot(query(collection(db, "global_chat"), orderBy("time", "asc")), (snap) => {
        const box = document.getElementById('g-messages');
        box.innerHTML = "";
        snap.forEach(doc => {
            const data = doc.data();
            const isMe = data.user === myName;
            box.innerHTML += `<div class="msg-item ${isMe ? 'sent' : 'received'}">
                <small style="font-size:10px; display:block;">${data.user}</small>
                ${data.msg}
            </div>`;
        });
        box.scrollTop = box.scrollHeight;
    });

    window.showGlobalChat = () => { document.getElementById('global-overlay').style.display = 'flex'; };
    window.closeChat = (id) => { document.getElementById(id).style.display = 'none'; };

</script>
</body>
</html>
