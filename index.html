<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYA Store Pro</title>

<style>
body{margin:0;font-family:Poppins;background:#f5f5f5}

/* HEADER */
.header{background:#fff;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0}
.top-bar{display:flex;gap:10px}
.top-bar input{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc}
.icons{font-size:22px;cursor:pointer}

/* GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:10px}
.product-card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.product-card img{width:100%;border-radius:8px}
.price{color:green;font-weight:bold}

.btn{margin-top:5px;padding:8px;border:none;border-radius:5px;background:#ff9800;color:#fff;width:100%}

/* CART */
.cart{position:fixed;top:0;right:-100%;width:300px;height:100%;background:#fff;transition:0.3s;padding:10px}
.cart.active{right:0}

/* ADMIN */
.admin{position:fixed;bottom:70px;right:10px;background:#fff;padding:10px;border-radius:10px;box-shadow:0 0 10px #ccc}
</style>
</head>

<body>

<header class="header">
<div class="top-bar">
<input type="text" id="search" placeholder="Search...">
<div class="icons" onclick="toggleCart()">🛒 (<span id="count">0</span>)</div>
</div>
</header>

<main class="product-grid" id="products"></main>

<!-- CART -->
<div class="cart" id="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">Total: ₹0</h4>
<button class="btn" onclick="checkout()">Pay Now</button>
</div>

<!-- ADMIN PANEL -->
<div class="admin">
<h4>Admin</h4>

<select id="productSelect"></select><br><br>
<input type="number" id="priceInput" placeholder="New Price"><br><br>
<button onclick="updatePrice()">Update</button>
</div>

<script>

// PRODUCTS (Load or default)
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"Airpods",price:217,img:"https://via.placeholder.com/150"},
{name:"Watch",price:283,img:"https://via.placeholder.com/150"},
{name:"T-shirt",price:199,img:"https://via.placeholder.com/150"},
{name:"Shoes",price:499,img:"https://via.placeholder.com/150"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

// SAVE
function saveProducts(){
localStorage.setItem("products", JSON.stringify(products));
}

// RENDER PRODUCTS
function render(list){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="product-card">
<img src="${p.img}">
<p>${p.name}</p>
<p class="price">₹${p.price}</p>
<button class="btn" onclick="addToCart(${i})">Add</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}
render(products);

// SEARCH
document.getElementById("search").oninput=function(){
let val=this.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(val)));
}

// CART
function addToCart(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
let html="";
let total=0;

cart.forEach((p,i)=>{
html+=`<p>${p.name} - ₹${p.price} <button onclick="removeItem(${i})">❌</button></p>`;
total+=p.price;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="Total: ₹"+total;
document.getElementById("count").innerText=cart.length;

localStorage.setItem("cart", JSON.stringify(cart));
}
updateCart();

function removeItem(i){
cart.splice(i,1);
updateCart();
}

// TOGGLE CART
function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

// CHECKOUT (UPI AUTO AMOUNT)
function checkout(){
let total = cart.reduce((sum,p)=>sum+p.price,0);

if(total===0){
alert("Cart empty");
return;
}

let upi = `upi://pay?pa=93690mukeshkumar@axl&pn=KRYA Store&am=${total}&cu=INR`;
window.location.href = upi;
}

// ADMIN PANEL
function loadAdmin(){
let select=document.getElementById("productSelect");
select.innerHTML="";
products.forEach((p,i)=>{
select.innerHTML += `<option value="${i}">${p.name}</option>`;
});
}
loadAdmin();

function updatePrice(){
let i=document.getElementById("productSelect").value;
let newPrice=document.getElementById("priceInput").value;

if(newPrice){
products[i].price = Number(newPrice);
saveProducts();
render(products);
loadAdmin();
alert("Updated ✅");
}
}

</script>

</body>
</html>
