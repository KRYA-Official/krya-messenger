<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Pro - स्मार्ट आईडी सिस्टम</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --success: #22c55e; --coin: #ffd700; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }
        
        /* Header & Wallet */
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 1000; }
        .wallet-badge { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--primary); padding: 5px 12px; border-radius: 20px; color: var(--coin); font-weight: bold; display: flex; align-items: center; gap: 5px; }

        /* Status Section */
        .status-bar { display: flex; gap: 15px; overflow-x: auto; padding: 15px; background: #161e2e; border-bottom: 1px solid #334155; }
        .status-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed var(--primary); padding: 2px; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .status-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        /* ID Card Styles (Classic - पहले जैसा) */
        .id-card { border-radius: 20px; padding: 20px; margin: 20px auto; width: 92%; position: relative; min-height: 200px; border: 2.5px solid #a3a3a3; background: linear-gradient(135deg, #1e293b, #0f172a); }
        .verified-tag { position: absolute; top: 15px; right: 15px; color: var(--success); font-size: 10px; font-weight: bold; }
        
        /* Buttons and Elements */
        .btn { width: 90%; padding: 15px; margin: 10px 5%; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; display: block; text-align: center; text-decoration: none; }
        .btn-voice { background: #3b82f6; color: white; border-radius: 50%; width: 60px; height: 60px; margin: 20px auto; font-size: 24px; border: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        
        /* Mall Overlay */
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .mall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .product-card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid #334155; position: relative; }
        .product-card img { width: 100%; height: 110px; border-radius: 10px; object-fit: cover; }
        .tag { position: absolute; top: 10px; right: 10px; background: var(--danger); font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1a202c; border: 1px solid #334155; border-radius: 10px; color: white; outline: none; }
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 12px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <b style="color:var(--primary); font-size:22px;">KRYA Pro</b>
        <div class="wallet-badge"><i class="fas fa-coins"></i> <span id="balance-display">0</span></div>
    </div>

    <div class="status-bar">
        <div class="status-circle" onclick="openSettings()"><i class="fas fa-plus" style="color:var(--primary)"></i></div>
        <small style="font-size: 10px; color: #94a3b8; margin-left: 10px;">Status जल्द आ रहा है</small>
    </div>

    <div id="capture-area">
        <div id="final-card" class="id-card">
            <span id="badge-text" class="verified-tag">Verified ✅</span>
            <h4 style="margin-bottom:15px; border-bottom:1px solid rgba(251,191,36,0.3); padding-bottom:5px;">KRYA Pro सच्चाई कार्ड</h4>
            <div style="display:flex; gap:15px;">
                <img id="disp-img" src="https://via.placeholder.com/100" style="width:95px; height:120px; border-radius:12px; border:2px solid var(--primary); object-fit:cover;">
                <div style="font-size:14px; line-height:1.6;">
                    <b id="disp-name" style="font-size:18px; color:var(--primary);">...</b><br>
                    <span>पेशा: <span id="disp-skill">डिजिटल उद्यमी</span></span><br>
                    <span>पता: <span id="disp-address">बांका, बिहार</span></span>
                </div>
            </div>
            <div id="disp-id-box" style="margin-top:15px; padding-top:10px; border-top:1px dashed #444; font-family:monospace; font-weight:bold; font-size:12px; color:var(--coin);">
                ID: KRYA-2026-0000
            </div>
        </div>
    </div>

    <div style="text-align:center;">
        <button class="btn-voice" onclick="startAI()"><i class="fas fa-microphone"></i></button>
        <p id="ai-status" style="font-size: 12px; color: var(--primary);">KRYA AI से बात करें</p>
    </div>

    <button class="btn" style="background:#8b5cf6; color:white;" onclick="openMall()"><i class="fas fa-shopping-bag"></i> KRYA क्रांतिकारी मॉल</button>

    <div id="mall-ui" class="overlay">
        <h2>KRYA डिजिटल मॉल</h2>
        <button class="btn" style="background:var(--success); color:white;" onclick="openAddProduct()">+ 3D लोगो/AI इमेज लिस्ट करें</button>
        <div class="mall-grid" id="product-list"></div>
        <button class="btn" style="background:#444;" onclick="closeMall()">वापस</button>
    </div>

    <div id="add-product-ui" class="overlay">
        <h2>नया डिजिटल प्रोडक्ट</h2>
        <input type="file" id="p-img" accept="image/*">
        <input type="text" id="p-name" placeholder="नाम (उदा: 3D Professional Logo)">
        <input type="number" id="p-mrp" placeholder="MRP (असली कीमत)">
        <input type="number" id="p-discount" placeholder="डिस्काउंट % (0-100)">
        <button class="btn" style="background:var(--primary); color:black;" onclick="saveProduct()">Live Public करें</button>
        <button class="btn" style="background:#444;" onclick="closeAddProduct()">रद्द करें</button>
    </div>

    <div id="settings-ui" class="overlay">
        <h2 style="color:var(--primary);">प्रोफाइल सेटअप</h2>
        <input type="file" id="in-photo" accept="image/*" onchange="handleFile(event)">
        <input type="text" id="in-name" placeholder="अपना नाम">
        <input type="text" id="in-skill" placeholder="पेशा">
        <input type="text" id="in-address" placeholder="शहर, राज्य">
        <button class="btn" style="background:var(--primary); color:black;" onclick="finalSave()">सेव करें</button>
        <button class="btn" style="background:#444;" onclick="closeSettings()">वापस</button>
    </div>

    <nav class="nav">
        <a href="#" class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i><br>होम</a>
        <a href="#" class="nav-item" onclick="openMall()"><i class="fas fa-store"></i><br>मॉल</a>
        <a href="#" class="nav-item" onclick="openSettings()"><i class="fas fa-user-cog"></i><br>सेटिंग्स</a>
    </nav>

<script>
    let userData = JSON.parse(localStorage.getItem('krya_pro')) || {
        name: "मुकेश राय", skill: "ब्रैंड फाउंडर", address: "बांका, बिहार",
        balance: 700, photo: "", products: [], vip_id: "KRYA-2026-" + Math.floor(1000 + Math.random() * 9000)
    };

    const apiKey = "AIzaSyD8uts-FMY4A9emoiGvo1l2XnQmiCE_s30"; //

    function updateUI() {
        document.getElementById('disp-name').innerText = userData.name;
        document.getElementById('disp-skill').innerText = userData.skill;
        document.getElementById('disp-address').innerText = userData.address;
        document.getElementById('balance-display').innerText = userData.balance;
        document.getElementById('disp-id-box').innerText = "ID: " + userData.vip_id;
        if(userData.photo) document.getElementById('disp-img').src = userData.photo;
        
        renderProducts();
        localStorage.setItem('krya_pro', JSON.stringify(userData));
    }

    // AI Voice assistant
    async function startAI() {
        const status = document.getElementById('ai-status');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        recognition.onstart = () => status.innerText = "KRYA सुन रहा है...";
        recognition.onresult = async (event) => {
            const query = event.results[0][0].transcript;
            status.innerText = "आपने पूछा: " + query;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({contents: [{ parts: [{ text: "तुम KRYA के डिजिटल एसेट एक्सपर्ट हो। हिंदी में छोटा समाधान दो: " + query }] }]})
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                status.innerText = aiText;
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(aiText));
            } catch { status.innerText = "AI कनेक्ट नहीं हुआ।"; }
        };
        recognition.start();
    }

    // Mall Functions
    function openMall() { document.getElementById('mall-ui').style.display = 'flex'; }
    function closeMall() { document.getElementById('mall-ui').style.display = 'none'; }
    function openAddProduct() { document.getElementById('add-product-ui').style.display = 'flex'; }
    function closeAddProduct() { document.getElementById('add-product-ui').style.display = 'none'; }

    function saveProduct() {
        const name = document.getElementById('p-name').value;
        const mrp = parseFloat(document.getElementById('p-mrp').value);
        const discountPercent = parseFloat(document.getElementById('p-discount').value) || 0;
        const file = document.getElementById('p-img').files[0];

        if(name && mrp && file) {
            const finalPrice = Math.round(mrp - (mrp * (discountPercent / 100)));
            const reader = new FileReader();
            reader.onload = (e) => {
                userData.products.push({ name, mrp, discount: discountPercent, price: finalPrice, img: e.target.result });
                updateUI(); closeAddProduct(); alert("डिजिटल प्रोडक्ट लाइव हुआ!");
            };
            reader.readAsDataURL(file);
        } else { alert("पूरी जानकारी भरें!"); }
    }

    function renderProducts() {
        document.getElementById('product-list').innerHTML = userData.products.map(p => `
            <div class="product-card">
                <img src="${p.img}">
                ${p.discount > 0 ? `<div class="tag">${p.discount}% OFF</div>` : ''}
                <p><b>${p.name}</b></p>
                <p style="text-decoration:line-through; font-size:10px; color:#94a3b8">🪙 ${p.mrp}</p>
                <p style="color:var(--coin); font-weight:bold;">🪙 ${p.price}</p>
                <button class="btn" style="width:100%; margin:0; padding:5px; background:var(--primary); font-size:12px;">Buy</button>
            </div>
        `).join('');
    }

    // Profile Functions
    function openSettings() { document.getElementById('settings-ui').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-ui').style.display = 'none'; }
    function handleFile(e) {
        const reader = new FileReader();
        reader.onload = () => { userData.photo = reader.result; updateUI(); };
        reader.readAsDataURL(e.target.files[0]);
    }
    function finalSave() {
        userData.name = document.getElementById('in-name').value || userData.name;
        userData.skill = document.getElementById('in-skill').value || userData.skill;
        userData.address = document.getElementById('in-address').value || userData.address;
        updateUI(); closeSettings();
    }

    updateUI();
</script>
</body>
</html>
