<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYA Firebase Store</title>

<style>
body{font-family:Poppins;margin:0;background:#f5f5f5}
.header{background:#fff;padding:10px;display:flex;gap:10px}
input{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:10px}
.price{color:green;font-weight:bold}
.btn{background:#ff9800;color:#fff;border:none;padding:8px;width:100%;margin-top:5px}
.cart{position:fixed;right:-100%;top:0;width:300px;height:100%;background:#fff;padding:10px;transition:0.3s}
.cart.active{right:0}
.admin{position:fixed;bottom:10px;right:10px;background:#fff;padding:10px;border-radius:10px}
</style>

</head>
<body>

<div class="header">
<input id="search" placeholder="Search...">
<button onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
<button onclick="login()">Login</button>
</div>

<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">₹0</h4>
<button class="btn" onclick="checkout()">Pay</button>
</div>

<!-- ADMIN -->
<div class="admin" id="adminPanel" style="display:none">
<h4>Admin</h4>
<input id="name" placeholder="Name"><br>
<input id="price" placeholder="Price"><br>
<input id="img" placeholder="Image URL"><br>
<button onclick="addProduct()">Add Product</button>
</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 अपना Firebase config डालें
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();

// ADMIN EMAIL (अपना डालें)
const ADMIN_EMAIL = "your@gmail.com";

let products=[];
let cart=[];

// LOAD PRODUCTS
async function loadProducts(){
const querySnapshot = await getDocs(collection(db,"products"));
products=[];
querySnapshot.forEach(doc=>{
products.push({...doc.data(),id:doc.id});
});
render(products);
}
loadProducts();

// RENDER
function render(list){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="card">
<img src="${p.img}" width="100%">
<p>${p.name}</p>
<p class="price">₹${p.price}</p>
<button class="btn" onclick="addToCart(${i})">Add</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

// SEARCH
document.getElementById("search").oninput=function(){
let val=this.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(val)));
}

// CART
window.addToCart=(i)=>{
cart.push(products[i]);
updateCart();
}

function updateCart(){
let html="",total=0;
cart.forEach((p,i)=>{
html+=`<p>${p.name} ₹${p.price}</p>`;
total+=p.price;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="₹"+total;
document.getElementById("count").innerText=cart.length;
}

// CART TOGGLE
window.toggleCart=()=>{
document.getElementById("cart").classList.toggle("active");
}

// CHECKOUT
window.checkout=async ()=>{
let total=cart.reduce((s,p)=>s+p.price,0);

let upi=`upi://pay?pa=93690mukeshkumar@axl&pn=KRYA&am=${total}&cu=INR`;
window.location.href=upi;

// SAVE ORDER
await addDoc(collection(db,"orders"),{
items:cart,
total:total,
status:"pending",
time:new Date()
});

alert("Order Saved ✅");
}

// LOGIN
window.login=async ()=>{
const provider = new GoogleAuthProvider();
const result = await signInWithPopup(auth, provider);

if(result.user.email === ADMIN_EMAIL){
document.getElementById("adminPanel").style.display="block";
alert("Admin Login ✅");
}else{
alert("User Login");
}
}

// ADD PRODUCT
window.addProduct=async ()=>{
let name=document.getElementById("name").value;
let price=document.getElementById("price").value;
let img=document.getElementById("img").value;

await addDoc(collection(db,"products"),{
name,price:Number(price),img
});

alert("Product Added ✅");
loadProducts();
}

</script>

</body>
</html>
