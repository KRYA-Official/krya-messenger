<!-- 🔥 NAV ADD करें (header के अंदर) -->
<div style="display:flex;gap:15px">
<button onclick="showChat()">Chat</button>
<button onclick="showStore()">Store</button>
</div>

<!-- 🔥 STORE UI ADD करें -->
<div id="store-section" class="hidden" style="padding:10px">
<h2>🛍️ KRYA Store</h2>

<div id="products"></div>

<div id="cartBox" style="margin-top:10px">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4 id="total">₹0</h4>
<button onclick="checkout()">Pay Now</button>
</div>

<!-- ADMIN -->
<div id="adminPanel" style="margin-top:10px">
<h3>Admin</h3>
<input id="pname" placeholder="Product Name"><br>
<input id="pprice" placeholder="Price"><br>
<input id="pimg" placeholder="Image URL"><br>
<button onclick="addProduct()">Add Product</button>
</div>

</div>

<script type="module">

// 🔥 Firebase same रहेगा
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =========================
// 🔥 STORE SYSTEM
// =========================
let products=[];
let cart=[];

// LOAD PRODUCTS
async function loadProducts(){
const snap = await getDocs(collection(db,"products"));
products=[];
snap.forEach(d=>products.push({...d.data(),id:d.id}));
renderProducts();
}
loadProducts();

// RENDER
function renderProducts(){
let html="";
products.forEach((p,i)=>{
html+=`
<div style="background:#1e293b;padding:10px;margin:5px;border-radius:10px">
<img src="${p.img}" width="100%">
<p>${p.name}</p>
<p>₹${p.price}</p>
<button onclick="addToCart(${i})">Add</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

// ADD CART
window.addToCart=(i)=>{
cart.push(products[i]);
updateCart();
}

// UPDATE CART
function updateCart(){
let total=0,html="";
cart.forEach(p=>{
total+=p.price;
html+=`<p>${p.name} ₹${p.price}</p>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="₹"+total;
}

// CHECKOUT
window.checkout=async ()=>{
let total = cart.reduce((s,p)=>s+p.price,0);

let upi=`upi://pay?pa=93690mukeshkumar@axl&pn=KRYA&am=${total}&cu=INR`;
window.location.href=upi;

await addDoc(collection(db,"orders"),{
items:cart,
total,
time:new Date()
});

alert("Order Saved");
}

// ADMIN ADD PRODUCT
window.addProduct=async ()=>{
let name=pname.value;
let price=Number(pprice.value);
let img=pimg.value;

await addDoc(collection(db,"products"),{name,price,img});
alert("Added");
loadProducts();
}

// =========================
// 🔥 NAVIGATION
// =========================
window.showChat=()=>{
document.getElementById("chat-flow").parentElement.style.display="flex";
document.getElementById("store-section").classList.add("hidden");
}

window.showStore=()=>{
document.getElementById("chat-flow").parentElement.style.display="none";
document.getElementById("store-section").classList.remove("hidden");
}

</script>
