<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KRYA - दुनिया की एक पहचान</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --krya-navy: #0b1426; --krya-gold: #d4af37; --bg-gradient: linear-gradient(180deg, #0b1426 0%, #1a2a44 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--krya-navy); height: 100vh; display: flex; justify-content: center; overflow: hidden; color: white; }
        .app-container { width: 100%; max-width: 450px; background: var(--bg-gradient); display: flex; flex-direction: column; height: 100%; position: relative; }

        /* Auth & UI Elements */
        .auth-card { padding: 40px; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .hidden { display: none !important; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn-gold { width: 100%; padding: 16px; background: var(--krya-gold); color: black; border: none; border-radius: 35px; font-weight: bold; cursor: pointer; }

        /* App Layout */
        .header { padding: 45px 20px 15px; text-align: center; }
        .header h1 { color: var(--krya-gold); font-size: 30px; letter-spacing: 4px; }
        .content-card { flex: 1; background: white; border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 25px 15px 100px; overflow-y: auto; color: #333; }
        
        /* Chat List Style */
        .list-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f1f1; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--krya-gold); margin-right: 15px; display: flex; align-items: center; justify-content: center; background: #eee; font-weight: bold; }

        /* Bottom Nav Fix */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; color: #9ca3af; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--krya-navy); font-weight: bold; }

        /* Overlay View (Chat/Search) */
        .overlay { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; }
        .overlay-header { background: var(--krya-navy); color: var(--krya-gold); padding: 15px; display: flex; align-items: center; gap: 15px; }
        .msg-flow { flex: 1; overflow-y: auto; padding: 20px; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 15px; border-radius: 15px; max-width: 80%; color: black; font-size: 15px; }
        .mine { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 2px; }
        .theirs { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }
    </style>
</head>
<body>

<div id="screen-otp" class="auth-card">
    <h1 style="color:var(--krya-gold)">KRYA</h1>
    <div id="email-step">
        <input type="email" id="user-email" placeholder="ईमेल डालें">
        <button class="btn-gold" onclick="sendOTP()">OTP भेजें</button>
    </div>
    <div id="otp-step" class="hidden">
        <input type="number" id="otp-input" placeholder="000000">
        <button class="btn-gold" onclick="verifyOTP()">वेरिफाई करें</button>
    </div>
</div>

<div id="screen-handle" class="auth-card hidden">
    <h1>KRYA</h1>
    <input type="text" id="input-handle" placeholder="अपना @हैंडल चुनें">
    <button class="btn-gold" id="btn-save-handle">प्रोफ़ाइल बनाएं</button>
</div>

<div id="app-main" class="app-container hidden">
    <div class="header"><h1>KRYA</h1><p>दुनिया की एक पहचान</p></div>
    <div class="content-card" id="chat-list">
        <div class="list-item" onclick="openChat('global_room', 'GlobalTalk')">
            <div class="avatar" style="background:var(--krya-gold); color:white;">G</div>
            <div><h4>GlobalTalk <i class="fas fa-check-circle" style="color:#00c2cb;"></i></h4><p style="font-size:12px; color:gray;">सबके लिए खुला संदेश</p></div>
        </div>
        <p style="padding:15px; font-size:12px; color:gray; text-align:center;">प्राइवेट चैट शुरू करने के लिए सर्च का उपयोग करें</p>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-globe"></i>Feed</div>
        <div class="nav-item" onclick="toggleSearch()"><i class="fas fa-search"></i>Search</div>
        <div class="nav-item" onclick="openRegistry()"><i class="fas fa-file-contract"></i>Registry</div>
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-user-circle"></i>Account</div>
    </div>
</div>

<div class="overlay" id="chat-view">
    <div class="overlay-header">
        <i class="fas fa-arrow-left" onclick="closeChat()"></i>
        <span id="chat-title" style="font-weight:bold;">Chat</span>
    </div>
    <div class="msg-flow" id="msg-flow"></div>
    <div style="padding:10px; background:#f0f0f0; display:flex; gap:10px;">
        <input type="text" id="msg-input" placeholder="संदेश लिखें..." style="margin:0; flex:1;">
        <button id="send-btn" style="background:var(--krya-navy); color:var(--krya-gold); border:none; width:45px; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div class="overlay" id="search-view">
    <div class="overlay-header">
        <i class="fas fa-arrow-left" onclick="toggleSearch()"></i>
        <span>यूजर सर्च करें</span>
    </div>
    <div style="padding:15px;">
        <input type="text" id="search-input" placeholder="@handle टाइप करें..." style="color:black; background:#eee;">
        <div id="search-results"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
        authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
        projectId: "sample-firebase-ai-app-37d2b",
        storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
        messagingSenderId: "652996597348",
        appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("msEHMlMxmjBbBoqnn");

    let genOTP, uEmail, myHandle, myUid, currentChatId;

    // Auth Logic
    window.sendOTP = () => {
        uEmail = document.getElementById('user-email').value;
        genOTP = Math.floor(100000 + Math.random() * 900000);
        emailjs.send('service_gls676h', 'template_6teuhl4', { email: uEmail, otp: genOTP })
            .then(() => { document.getElementById('email-step').classList.add('hidden'); document.getElementById('otp-step').classList.remove('hidden'); });
    };

    window.verifyOTP = async () => {
        if(document.getElementById('otp-input').value == genOTP) {
            myUid = btoa(uEmail);
            const userDoc = await getDoc(doc(db, "users", myUid));
            document.getElementById('screen-otp').classList.add('hidden');
            if(userDoc.exists()) startApp(userDoc.data().handle);
            else document.getElementById('screen-handle').classList.remove('hidden');
        } else alert("गलत OTP");
    };

    document.getElementById('btn-save-handle').onclick = async () => {
        const h = document.getElementById('input-handle').value.trim();
        await setDoc(doc(db, "users", myUid), { handle: h, email: uEmail });
        startApp(h);
    };

    function startApp(handle) {
        myHandle = handle;
        document.getElementById('screen-handle').classList.add('hidden');
        document.getElementById('app-main').classList.remove('hidden');
    }

    // Search Logic
    window.toggleSearch = () => {
        const sv = document.getElementById('search-view');
        sv.style.display = sv.style.display === 'flex' ? 'none' : 'flex';
    };

    document.getElementById('search-input').oninput = async (e) => {
        const val = e.target.value.trim();
        if(val.length < 2) return;
        const q = query(collection(db, "users"), where("handle", "==", val));
        const snap = await getDocs(q);
        const res = document.getElementById('search-results');
        res.innerHTML = "";
        snap.forEach(d => {
            const u = d.data();
            if(u.handle !== myHandle) {
                res.innerHTML += `<div class="list-item" onclick="startPrivateChat('${u.handle}')">
                    <div class="avatar">${u.handle[0]}</div>
                    <h4>${u.handle}</h4>
                </div>`;
            }
        });
    };

    window.startPrivateChat = (otherHandle) => {
        const chatId = [myHandle, otherHandle].sort().join("_");
        toggleSearch();
        openChat(chatId, otherHandle);
    };

    // Chat Engine
    let unsub = null;
    window.openChat = (chatId, title) => {
        currentChatId = chatId;
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('chat-title').innerText = title;
        const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"));
        unsub = onSnapshot(q, snap => {
            const flow = document.getElementById('msg-flow');
            flow.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const isMe = m.sender === myHandle;
                flow.innerHTML += `<div class="bubble ${isMe?'mine':'theirs'}">
                    <small style="display:block; font-size:10px; opacity:0.6;">${m.sender}</small>
                    ${m.text}
                </div>`;
            });
            flow.scrollTop = flow.scrollHeight;
        });
    };

    document.getElementById('send-btn').onclick = async () => {
        const inp = document.getElementById('msg-input');
        if(!inp.value || !currentChatId) return;
        await addDoc(collection(db, "chats", currentChatId, "messages"), {
            text: inp.value,
            sender: myHandle,
            time: serverTimestamp()
        });
        inp.value = "";
    };

    window.closeChat = () => { 
        document.getElementById('chat-view').style.display = 'none'; 
        if(unsub) unsub();
    };

    window.openRegistry = () => alert("Registry Portal Opening...");
</script>
</body>
</html>
