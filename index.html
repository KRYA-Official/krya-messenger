<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive Offers</title>

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#f1f3f6;
}

/* Container */
.container{
padding:20px;
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

/* Card */
.card{
background:#fff;
width:260px;
border-radius:12px;
padding:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
position:relative;
transition:0.3s;
}
.card:hover{
transform:translateY(-8px);
}

/* Offer Badge */
.badge{
position:absolute;
top:10px;
left:10px;
background:red;
color:#fff;
padding:5px 10px;
border-radius:5px;
font-size:12px;
}

/* Image */
.card img{
width:100%;
border-radius:8px;
}

/* Title */
.card h3{
margin:10px 0;
}

/* Price */
.price{
color:green;
font-weight:bold;
font-size:18px;
}
.old{
text-decoration:line-through;
color:#999;
font-size:14px;
}

/* Timer */
.timer{
color:#ff0000;
font-size:14px;
margin-top:5px;
}

/* Button */
.btn{
display:block;
margin-top:10px;
padding:10px;
text-align:center;
background:#ff9900;
color:white;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<!-- CARD 1 -->
<div class="card">
<div class="badge">🔥 50% OFF</div>

<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">

<h3>Website Development</h3>

<div class="price">₹2999 <span class="old">₹5999</span></div>

<div class="timer" id="timer1">Offer ends in: 00:00:00</div>

<a class="btn" href="https://wa.me/916379403821?text=मुझे%20Website%20service%20चाहिए">Buy Now</a>
</div>

<!-- CARD 2 -->
<div class="card">
<div class="badge">⚡ 40% OFF</div>

<img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c">

<h3>Firebase Setup</h3>

<div class="price">₹999 <span class="old">₹1999</span></div>

<div class="timer" id="timer2">Offer ends in: 00:00:00</div>

<a class="btn" href="https://wa.me/916379403821?text=मुझे%20Firebase%20चाहिए">Buy Now</a>
</div>

</div>

<script>
// Timer function
function startTimer(id, duration){
let timer = duration, hours, minutes, seconds;

setInterval(function(){
hours = parseInt(timer / 3600);
minutes = parseInt((timer % 3600) / 60);
seconds = parseInt(timer % 60);

document.getElementById(id).innerHTML =
"Offer ends in: " +
hours + ":" + minutes + ":" + seconds;

if(--timer < 0) timer = duration;
},1000);
}

// 2 hours timer
startTimer("timer1",7200);
startTimer("timer2",7200);

</script>

</body>
</html>
