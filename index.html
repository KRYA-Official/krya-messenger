<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Digital | Super-Platform</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #10b981; 
            --accent: #2563eb; 
            --gold: #fbbf24; 
            --dark: #0f172a;
            --slate: #475569;
            --light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: var(--light); color: var(--dark); }

        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100%; }

        /* 1. FIXED HEADER */
        header {
            background: #ffffff; padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000; border-bottom: 1px solid #e2e8f0;
        }
        .brand { font-size: 22px; font-weight: 800; color: var(--dark); letter-spacing: -1px; }
        .brand span { color: var(--primary); }
        .live-status { font-size: 11px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 5px; }

        main { flex: 1; overflow-y: auto; padding: 15px 15px 100px; scrollbar-width: none; }
        main::-webkit-scrollbar { display: none; }

        /* 2. HERO SECTION IMPROVEMENT */
        .hero {
            text-align: center; padding: 40px 20px; border-radius: 24px;
            background: linear-gradient(135deg, #2563eb, #10b981);
            color: white; margin-bottom: 25px; box-shadow: var(--shadow);
        }
        .hero h1 { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
        .hero p { font-size: 13px; opacity: 0.9; margin-bottom: 25px; line-height: 1.6; }
        .btn-cta {
            background: var(--gold); color: #000; padding: 14px 28px;
            border-radius: 14px; font-weight: 700; border: none; font-size: 15px;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); cursor: pointer;
        }

        /* 3. FORM CONTAINER FIX (Visibility) */
        .form-container {
            background: #ffffff; padding: 25px; border-radius: 24px;
            box-shadow: var(--shadow); border: 1px solid #f1f5f9;
        }
        .form-title { border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 25px; }
        .form-title h2 { color: var(--dark); font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .form-title p { color: var(--slate); font-size: 12px; font-weight: 500; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .form-control {
            width: 100%; padding: 15px; border-radius: 14px; border: 1.5px solid #e2e8f0;
            font-size: 14px; background: #fdfdfd; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--accent); color: white;
            border: none; border-radius: 14px; font-weight: 700; font-size: 16px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); cursor: pointer;
        }

        /* 4. NAVIGATION FIX */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; padding: 12px 0 25px;
            border-top: 1px solid #e2e8f0; z-index: 1001;
        }
        .nav-item { border: none; background: none; color: #94a3b8; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 700; }

        .hidden { display: none !important; }

        /* Floating WA */
        .wa-float {
            position: fixed; bottom: 95px; right: 20px; background: #25d366;
            color: white; width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 999;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="brand">KRYA<span>Digital</span></div>
            <div class="live-status"><i class="fas fa-circle animate__animated animate__flash animate__infinite"></i> Live</div>
        </header>

        <a href="https://wa.me/916379403821" class="wa-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

        <main id="main-scroller">
            <section id="view-home" class="view animate__animated animate__fadeIn">
                <div class="hero">
                    <h1>Grow Your Business with KRYA Digital</h1>
                    <p>India's first modular super-platform for services, community unity, and digital growth.</p>
                    <button class="btn-cta" onclick="navigate('services')">Explore Marketplace</button>
                </div>
                
                <div class="form-container">
                    <div class="form-title">
                        <h2>राष्ट्रीय एकता संघ</h2>
                        <p>मजदूर कल्याण एवं डिजिटल पंजीकरण</p>
                    </div>
                    <form id="leadForm">
                        <div class="input-group">
                            <label>पूरा नाम / Full Name *</label>
                            <input type="text" id="l_name" class="form-control" placeholder="अपना नाम लिखें" required>
                        </div>
                        <div class="input-group">
                            <label>मोबाइल नंबर / Mobile *</label>
                            <input type="tel" id="l_phone" class="form-control" placeholder="10 अंकों का नंबर" pattern="[0-9]{10}" required>
                        </div>
                        <div class="input-group">
                            <label>जिला / District *</label>
                            <select id="l_district" class="form-control" required>
                                <option value="">चुनें...</option>
                                <option value="Banka">बांका (Bihar)</option>
                                <option value="Delhi">दिल्ली (NCR)</option>
                                <option value="Other">अन्य</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">सुरक्षित पंजीकरण करें</button>
                    </form>
                </div>
            </section>

            <section id="view-services" class="view hidden animate__animated animate__fadeIn">
                <h2 style="margin: 10px 0 20px; font-weight: 800;">Digital Marketplace</h2>
                <div style="background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px;">
                    <img src="https://images.unsplash.com/photo-1626785774573-4b799315345d?w=500" style="width: 100%; border-radius: 15px; margin-bottom: 15px;">
                    <h3>3D Logo Design</h3>
                    <p style="color: var(--slate); font-size: 13px; margin: 5px 0 15px;">High-quality branding for your business.</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 20px; font-weight: 800; color: var(--primary);">₹199</span>
                        <button style="background: var(--dark); color: white; padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold;">Buy Now</button>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navigate('home')" id="nav-home">
                <i class="fas fa-home"></i><span>Home</span>
            </button>
            <button class="nav-item" onclick="navigate('services')" id="nav-services">
                <i class="fas fa-th-large"></i><span>Market</span>
            </button>
            <button class="nav-item" onclick="navigate('chat')" id="nav-chat">
                <i class="fas fa-comment-dots"></i><span>Chat</span>
            </button>
            <button class="nav-item" onclick="navigate('panel')" id="nav-panel">
                <i class="fas fa-user-circle"></i><span>Panel</span>
            </button>
            <button class="nav-item" onclick="navigate('info')" id="nav-info">
                <i class="fas fa-info-circle"></i><span>Info</span>
            </button>
        </nav>
    </div>

    <script>
        function navigate(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('view-' + viewId).classList.remove('hidden');
            document.getElementById('nav-' + viewId).classList.add('active');
            document.getElementById('main-scroller').scrollTop = 0;
        }
    </script>
</body>
                </html>
