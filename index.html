<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryaLive.com</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
}

/* Header */
.header {
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #00ffcc;
}

/* News Ticker */
.ticker {
    background: black;
    overflow: hidden;
    white-space: nowrap;
}
.ticker p {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 18s linear infinite;
}
@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}

/* Services */
.services {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 30px;
}
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 12px;
    width: 260px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}
.card:hover {
    transform: scale(1.05);
}
.price {
    color: #00ffcc;
    font-size: 18px;
    font-weight: bold;
}
.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: #00ffcc;
    color: black;
    border-radius: 20px;
    text-decoration: none;
}

/* Live Users */
.live {
    text-align: center;
    padding: 10px;
    color: #00ffcc;
}

/* Reviews */
.review {
    text-align: center;
    padding: 20px;
    font-style: italic;
}

/* Form */
form {
    max-width: 400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
input, select, textarea {
    padding: 10px;
    border-radius: 6px;
    border: none;
}
button {
    padding: 12px;
    background: #ff512f;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

/* WhatsApp Button */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    padding: 15px;
    border-radius: 50%;
    color: white;
    text-decoration: none;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="header">🚀 KryaLive.com</div>

<!-- News -->
<div class="ticker">
<p>🔥 आज का ऑफर: Website ₹2999 | ⚡ Limited Slots | 💬 WhatsApp Support 24x7 | 🎯 आज ही बुक करें</p>
</div>

<!-- Services -->
<div class="services">

<div class="card">
<h3>Firebase Setup</h3>
<p class="price">₹999</p>
<a class="btn" href="https://wa.me/916379403821?text=Firebase%20Setup%20चाहिए">Start</a>
</div>

<div class="card">
<h3>Website Development</h3>
<p class="price">₹2,999</p>
<a class="btn" href="https://wa.me/916379403821?text=Website%20बनवानी%20है">Order</a>
</div>

<div class="card">
<h3>Tech Support</h3>
<p class="price">₹499</p>
<a class="btn" href="https://wa.me/916379403821?text=Tech%20Support%20चाहिए">Fix</a>
</div>

</div>

<!-- Live Users -->
<div class="live">
👥 Live Users: <span id="users">32</span>
</div>

<!-- Reviews -->
<div class="review" id="review">
⭐ बहुत बढ़िया सर्विस!
</div>

<!-- Contact Form -->
<h2 style="text-align:center;">📩 Contact करें</h2>

<form onsubmit="sendWhatsApp(event)">
<input type="text" id="name" placeholder="आपका नाम" required>
<select id="service">
<option>Firebase Setup</option>
<option>Website Development</option>
<option>Tech Support</option>
</select>
<textarea id="msg" placeholder="आपकी जरूरत लिखें"></textarea>
<button type="submit">Send on WhatsApp</button>
</form>

<!-- WhatsApp Floating -->
<a href="https://wa.me/916379403821" class="whatsapp">💬</a>

<script>
// Live Users
setInterval(()=>{
document.getElementById("users").innerText = Math.floor(Math.random()*50)+20;
},3000);

// Reviews
let reviews = [
"⭐ बहुत बढ़िया सर्विस!",
"🔥 काम जल्दी हुआ",
"💯 Trusted service",
"⚡ Instant support मिला",
"👍 पैसे वसूल काम"
];
let i=0;
setInterval(()=>{
document.getElementById("review").innerText = reviews[i];
i=(i+1)%reviews.length;
},3000);

// WhatsApp Form Send
function sendWhatsApp(e){
e.preventDefault();

let name = document.getElementById("name").value;
let service = document.getElementById("service").value;
let msg = document.getElementById("msg").value;

let url = "https://wa.me/916379403821?text="
+ "नाम: "+name+"%0a"
+ "Service: "+service+"%0a"
+ "Message: "+msg;

window.open(url, "_blank");
}
</script>

</body>
</html>
