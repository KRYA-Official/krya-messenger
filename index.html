<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Professional Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <style>
        :root { 
            --primary: #00c853; 
            --accent: #2962ff; 
            --dark: #0a0f18; 
            --glass: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { background: #f4f7fa; color: var(--dark); height: 100vh; overflow: hidden; }

        /* Modern Header */
        header { 
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .brand-logo { display: flex; align-items: center; gap: 12px; }
        .brand-logo img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,200,83,0.3); }
        .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
        .brand-name span { color: var(--primary); }

        /* Main Scroll Area */
        main { height: calc(100vh - 145px); overflow-y: auto; padding: 20px; scroll-behavior: smooth; }

        /* Professional Service Cards */
        .service-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .service-card:active { transform: scale(0.98); }

        .image-box { width: 100%; height: 200px; background: #eee; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .price-tag { 
            position: absolute; bottom: 15px; left: 15px; 
            background: var(--dark); color: white; 
            padding: 5px 15px; border-radius: 50px; font-weight: 700; font-size: 14px;
        }

        .details-box { padding: 20px; }
        .details-box h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .details-box p { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 15px; }

        /* Order Button Customization */
        .btn-order {
            background: var(--dark);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* Profile & Visiting Card Styling */
        .v-card-pro {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 20px;
            padding: 25px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* Bottom Nav Modern */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: white;
            display: flex; justify-content: space-around;
            padding: 15px 10px 30px;
            border-top: 1px solid rgba(0,0,0,0.05);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
        }

        .nav-link { 
            display: flex; flex-direction: column; align-items: center; 
            text-decoration: none; color: #94a3b8; font-size: 11px; font-weight: 600;
        }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 20px; margin-bottom: 5px; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="brand-logo">
        <img src="YOUR_LOGO_URL" alt="KRYA">
        <div class="brand-name">KRYA<span>LIVE</span></div>
    </div>
    <div id="user-status" style="font-size: 11px; font-weight: 800; background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px;">
        GUEST
    </div>
</header>

<main>
    <section id="view-store" class="view active">
        <div style="margin-bottom: 25px;">
            <h2 style="font-size: 24px; font-weight: 800;">हमारे डिजिटल टूल्स</h2>
            <p style="font-size: 13px; color: #64748b;">बेहतरीन सेवाएं, ईमानदारी के साथ।</p>
        </div>
        <div id="service-container">
            </div>
    </section>

    <section id="view-orders" class="view">
        <h2 style="margin-bottom: 20px;">मेरे ऑर्डर्स</h2>
        <div id="order-list"></div>
    </section>

    <section id="view-profile" class="view">
        <div class="v-card-pro">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img id="p-img" src="" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--primary);">
                <div>
                    <h3 id="p-name" style="font-size: 18px;">नमस्ते!</h3>
                    <p id="p-email" style="font-size: 12px; opacity: 0.7;"></p>
                </div>
            </div>
            <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; font-size: 12px;">
                <span><i class="fas fa-check-circle" style="color: var(--primary);"></i> Verified Partner</span>
            </div>
        </div>
        <button onclick="logout()" style="width:100%; margin-top: 20px; padding: 15px; border-radius: 15px; border: none; background: #fee2e2; color: #ef4444; font-weight: 700;">लॉगआउट</button>
    </section>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active" onclick="switchView('store', this)"><i class="fas fa-th-large"></i>स्टोर</a>
    <a href="#" class="nav-link" onclick="switchView('orders', this)"><i class="fas fa-shopping-bag"></i>ऑर्डर्स</a>
    <a href="#" class="nav-link" onclick="switchView('profile', this)"><i class="fas fa-user"></i>प्रोफाइल</a>
</nav>

<script type="module">
    // Firebase Logic (Same as your previous config)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // View Switching
    window.switchView = (id, el) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        el.classList.add('active');
    };

    // Load Services
    function loadServices() {
        const q = query(collection(db, "services"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snap) => {
            const container = document.getElementById('service-container');
            container.innerHTML = '';
            snap.forEach(doc => {
                const s = doc.data();
                container.innerHTML += `
                    <div class="service-card">
                        <div class="image-box">
                            <img src="${s.img}" onerror="this.src='https://via.placeholder.com/400x200'">
                            <div class="price-tag">₹${s.price}</div>
                        </div>
                        <div class="details-box">
                            <h3>${s.name}</h3>
                            <p>${s.desc}</p>
                            <button class="btn-order" onclick="placeOrder('${s.name}', '${s.price}')">
                                <i class="fab fa-whatsapp"></i> अभी ऑर्डर करें
                            </button>
                        </div>
                    </div>
                `;
            });
        });
    }

    window.placeOrder = async (name, price) => {
        if(!currentUser) return alert("कृपया पहले लॉगइन करें");
        
        const orderData = {
            product: name,
            price: price,
            user: currentUser.displayName,
            email: currentUser.email,
            status: "Pending",
            time: serverTimestamp()
        };

        await addDoc(collection(db, "orders"), orderData);
        
        // Professional WhatsApp Message
        const msg = `नमस्ते KRYALIVE, मैं '${name}' सर्विस खरीदना चाहता हूँ। मेरा ईमेल: ${currentUser.email}`;
        window.open(`https://wa.me/916379403821?text=${encodeURIComponent(msg)}`);
    };

    onAuthStateChanged(auth, u => {
        if(u) {
            currentUser = u;
            document.getElementById('p-name').innerText = u.displayName;
            document.getElementById('p-email').innerText = u.email;
            document.getElementById('p-img').src = u.photoURL;
            document.getElementById('user-status').innerText = "ACTIVE USER";
            loadServices();
        } else {
            // Redirect to Login if needed
        }
    });

    window.logout = () => signOut(auth).then(() => location.reload());

</script>
</body>
</html>
