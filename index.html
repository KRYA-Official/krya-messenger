<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Portal | राष्ट्रीय एकता संघ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0c845c; 
            --secondary: #FFD700; 
            --org-blue: #004a99; 
            --org-red: #d32f2f;
            --dark: #0f172a; 
            --bg: #f4f7f6; 
            --card: #ffffff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg); color: #333; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* HEADER & NAVIGATION */
        header { 
            background: var(--dark); color: white; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom: 3px solid var(--primary); 
        }
        .logo { font-size: 22px; font-weight: 800; color: white; }
        .logo span { color: var(--secondary); }
        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { 
            background: transparent; color: white; border: 1px solid var(--primary); 
            padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn.org-btn { border-color: var(--secondary); color: var(--secondary); }
        .tab-btn.org-btn.active { background: var(--secondary); color: black; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px 15px; }

        /* SECTION: SERVICES */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .service-card { background: var(--card); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: center; padding-bottom: 20px; border-bottom: 4px solid var(--primary); }
        .service-card img { width: 100%; height: 160px; object-fit: cover; }
        .btn-pay { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 90%; font-weight: bold; margin-top: 10px; }

        /* SECTION: MESSENGER */
        .messenger-wrapper { background: var(--dark); height: 500px; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; color: white; border: 2px solid var(--primary); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; }
        .msg-them { align-self: flex-start; background: #1e293b; color: white; border: 1px solid #334155; }

        /* SECTION: SANGH ROOM */
        .org-header-box { background: white; border-radius: 15px; padding: 25px 15px; text-align: center; border-top: 6px solid var(--org-blue); box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .org-header-box h1 { color: var(--org-red); font-size: 24px; margin-bottom: 5px; }
        .org-header-box img { border-radius: 50%; border: 3px solid var(--org-blue); width: 100px; height: 100px; margin-bottom: 10px; }
        
        .support-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-call { flex: 1; background: #007bff; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-wa { flex: 1; background: #25d366; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        .reg-form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .btn-submit { background: var(--org-blue); color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">KRYA<span>live</span></div>
        <div class="nav-tabs">
            <button id="btn-services" class="tab-btn active" onclick="switchTab('services')">Services</button>
            <button id="btn-messenger" class="tab-btn" onclick="switchTab('messenger')">Messenger</button>
            <button id="btn-sangh" class="tab-btn org-btn" onclick="switchTab('sangh')"><i class="fas fa-users"></i> संघ</button>
        </div>
    </header>

    <div class="container">

        <div id="tab-services">
            <h2 style="text-align:center; color:var(--primary); margin-bottom: 20px;">Digital Services</h2>
            <div class="services-grid">
                <div class="service-card">
                    <img src="https://images.unsplash.com/photo-1626785774573-4b799315345d?w=500" alt="Logo">
                    <h3 style="margin-top:10px;">3D Logo Design</h3>
                    <p style="font-weight: 800; color: var(--primary);">₹199</p>
                    <button class="btn-pay">Buy Now</button>
                </div>
            </div>
        </div>

        <div id="tab-messenger" class="hidden">
            <div class="messenger-wrapper">
                <div style="padding:15px; background:#1e293b; text-align:center; font-weight:bold;">KRYA Global Chat</div>
                <div id="chat-flow">
                    <div class="msg msg-them">नमस्ते! आपका KRYA Messenger में स्वागत है।</div>
                </div>
            </div>
        </div>

        <div id="tab-sangh" class="hidden">
            <div class="org-header-box">
                <img src="https://via.placeholder.com/100" alt="MD Siraj">
                <h1>राष्ट्रीय एकता संघ</h1>
                <p style="color:var(--org-blue); font-weight:bold;">अखिल भारतीय मजदूर कल्याण सेवा संघ</p>
                <p style="font-size:12px; margin-top:5px;">आदेशानुसार: <strong>एमडी सिराज जी</strong></p>
            </div>

            <div class="support-btns">
                <a href="tel:+916379403821" class="btn-call"><i class="fas fa-phone"></i> कॉल करें</a>
                <a href="https://wa.me/916379403821" class="btn-wa"><i class="fab fa-whatsapp"></i> वॉट्सऐप</a>
            </div>

            <div class="reg-form">
                <h3 style="text-align:center; margin-bottom:15px; color:var(--org-blue);">मजदूर पंजीकरण</h3>
                <form id="labourForm">
                    <input type="text" id="m_name" class="input-field" placeholder="मजदूर का नाम *" required>
                    <input type="number" id="m_phone" class="input-field" placeholder="मोबाइल नंबर *" required>
                    <select id="m_district" class="input-field" required>
                        <option value="">जिला चुनें</option>
                        <option value="Banka">बांका</option>
                        <option value="Munger">मुंगेर</option>
                        <option value="Delhi">दिल्ली</option>
                    </select>
                    <textarea id="m_issue" class="input-field" placeholder="अपनी समस्या लिखें..." style="height:80px;"></textarea>
                    <button type="submit" id="submitBtn" class="btn-submit">डेटा सुरक्षित जमा करें</button>
                </form>
                <p id="formStatus" style="text-align:center; margin-top:10px; font-weight:bold; display:none;"></p>
            </div>

            <p style="text-align:center; margin-top:20px; font-size:11px; color:#888;">
                Developed by <strong>KRYA Digital (मुकेश राय)</strong>
            </p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // यहाँ अपना Firebase Config पेस्ट करें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tab Switcher
        window.switchTab = function(tabName) {
            document.getElementById('tab-services').classList.add('hidden');
            document.getElementById('tab-messenger').classList.add('hidden');
            document.getElementById('tab-sangh').classList.add('hidden');
            
            document.getElementById('btn-services').classList.remove('active');
            document.getElementById('btn-messenger').classList.remove('active');
            document.getElementById('btn-sangh').classList.remove('active');

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).classList.add('active');
        };

        // Form Submission to Firestore
        const labourForm = document.getElementById('labourForm');
        if(labourForm) {
            labourForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const status = document.getElementById('formStatus');
                
                btn.disabled = true;
                btn.innerText = "जमा हो रहा है...";

                try {
                    await addDoc(collection(db, "labour_registrations"), {
                        name: document.getElementById('m_name').value,
                        phone: document.getElementById('m_phone').value,
                        district: document.getElementById('m_district').value,
                        issue: document.getElementById('m_issue').value,
                        timestamp: serverTimestamp()
                    });
                    status.style.display = "block";
                    status.style.color = "green";
                    status.innerText = "✅ सफलतापूर्वक जमा हो गया!";
                    labourForm.reset();
                } catch (err) {
                    status.style.display = "block";
                    status.style.color = "red";
                    status.innerText = "❌ त्रुटि! कृपया दोबारा कोशिश करें।";
                } finally {
                    btn.disabled = false;
                    btn.innerText = "डेटा सुरक्षित जमा करें";
                }
            });
        }
    </script>
</body>
</html>
