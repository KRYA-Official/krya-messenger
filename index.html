<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Smart Business Hub</title>
    
    <meta property="og:title" content="KRYALIVE | Smart Business Hub">
    <meta property="og:description" content="Kryalive.com: घर बैठे प्रोफेशनल डिजिटल सर्विसेज। ईमानदारी हमारी पहचान।">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    <meta property="og:url" content="https://kryalive.com">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ff4757; --gold: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; height: 100vh; }
        
        /* गेटकीपर सुरक्षा */
        header, .bottom-nav { display: none !important; }
        .view { display: none !important; }
        .view.active { display: block !important; animation: slideUp 0.4s ease; }

        header { background: white; padding: 10px 20px; border-bottom: 1px solid #eee; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .brand { font-size: 20px; font-weight: 800; }
        .brand span { color: var(--primary); }
        
        main { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card { background: #fff; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; background: #f8fafc; outline: none; font-family: inherit; }
        textarea { resize: vertical; }

        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }

        .service-item { border-radius: 24px; overflow: hidden; background: #fff; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .service-img { width: 100%; height: 190px; object-fit: cover; }
        .service-desc { font-size: 13px; color: #475569; margin-bottom: 15px; line-height: 1.6; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 10px 0 25px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 700; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header">
    <div class="brand-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" class="logo-img">
        <div class="brand">KRYA<span>LIVE</span></div>
    </div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; padding: 5px 12px; border-radius: 20px;">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div style="text-align: center; padding-top: 80px;">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s3264/1000537308.jpg" style="width: 110px; height: 110px; border-radius: 50%; margin-bottom: 20px; border: 3px solid var(--primary);">
            <h2 style="font-weight: 800; font-size: 26px;">नमस्ते!</h2>
            <p style="color: gray; margin-bottom: 40px; padding: 0 20px;">Kryalive.com में प्रवेश के लिए लॉगिन करें।</p>
            <button class="btn" id="login-btn" style="background: white; color: #000; border: 1.5px solid #eee; width: 85%; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google के साथ शुरू करें
            </button>
        </div>
    </section>

    <section id="view-owner" class="view">
        <div class="stat-grid">
            <div class="stat-card"><i class="fas fa-shopping-cart" style="color:var(--accent);"></i><h2 id="total-ord">0</h2><p>ऑर्डर्स</p></div>
            <div class="stat-card"><i class="fas fa-boxes" style="color:var(--primary);"></i><h2 id="total-services">0</h2><p>कुल सर्विस</p></div>
            <div class="stat-card" style="grid-column: span 2;"><i class="fas fa-wallet" style="color:var(--gold);"></i><h2 id="total-rev">₹0</h2><p>कुल राजस्व</p></div>
        </div>
        <div class="card">
            <h3>नया सर्विस पब्लिश करें</h3>
            <input type="text" id="s-name" placeholder="सर्विस का नाम">
            <input type="number" id="s-mrp" placeholder="MRP (बाजार भाव)">
            <input type="number" id="s-price" placeholder="असली कीमत (आपका भाव)">
            <input type="text" id="s-img" placeholder="फोटो का लिंक">
            <label style="font-size: 12px; color: gray; margin-bottom: 5px; display: block; font-weight: bold;">ऑफर खत्म होने का समय (ऑप्शनल):</label>
            <input type="datetime-local" id="s-timer">
            <textarea id="s-desc" placeholder="सर्विस की पूरी जानकारी, नियम और शर्तें लिखें..." rows="5"></textarea>
            
            <button class="btn btn-primary" id="btn-publish"><i class="fas fa-plus"></i> पब्लिश करें</button>
        </div>
        <div id="admin-product-list"></div>
    </section>

    <section id="view-store" class="view">
        <h3 id="user-greet" style="font-weight: 800;">नमस्ते!</h3>
        <p style="font-size: 12px; color: gray; margin-bottom: 20px;">आपकी डिजिटल तरक्की यहाँ से शुरू होती है।</p>
        <div id="store-list"></div>
    </section>

    <section id="view-orders" class="view">
        <h3 style="margin-bottom: 20px; font-weight: 800;">मेरे ऑर्डर्स</h3>
        <div id="user-orders-display"></div>
    </section>

    <section id="view-profile" class="view">
        <div class="card" style="text-align: center; padding: 40px 20px;">
            <img id="u-photo" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 15px;">
            <h4 id="u-name">Name</h4>
            <p id="u-email" style="color: gray; font-size: 12px; margin-bottom: 25px;">email</p>
            <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="shareWebsite()"><i class="fas fa-share-alt"></i> Kryalive.com शेयर करें</button>
            <div style="font-size: 11px; color: gray; text-align: left; background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #eee;">
                <b>हमारी नीति:</b> हम ईमानदारी और पारदर्शिता में विश्वास रखते हैं।
            </div>
            <button class="btn" style="background: #fee2e2; color: #ef4444; margin-top: 20px;" id="logout-btn">लॉगआउट</button>
        </div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav">
    <button class="nav-item active" id="n-main" onclick="openMain()"><i class="fas fa-store"></i><span id="n-txt">Store</span></button>
    <button class="nav-item" id="n-orders" onclick="nav('orders')"><i class="fas fa-box"></i><span>Orders</span></button>
    <button class="nav-item" id="n-profile" onclick="nav('profile')"><i class="fas fa-user-circle"></i><span>Profile</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, doc, updateDoc, onSnapshotMetadata, onSnapshotOptions, onSnapshotOptionsWithFieldValue, onSnapshotListenOptions,onSnapshot, query, orderBy, serverTimestamp, deleteDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    
    let user = null, isOwner = false;

    const showToast = (m, c="var(--primary)") => Toastify({text: m, duration: 3000, style: {background: c, borderRadius: "15px"}}).showToast();

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        const navMap = { 'orders': 'n-orders', 'profile': 'n-profile', 'owner': 'n-main', 'store': 'n-main' };
        document.getElementById(navMap[id]).classList.add('active');
        if(id === 'orders') loadUserOrders();
    };

    window.openMain = () => isOwner ? nav('owner') : nav('store');

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        const header = document.getElementById('app-header');
        const navBar = document.getElementById('app-nav');

        if(u) {
            user = u;
            isOwner = u.email === OWNER_EMAIL;
            header.style.setProperty('display', 'flex', 'important');
            navBar.style.setProperty('display', 'flex', 'important');
            
            await setDoc(doc(db, "subscribers", u.uid), { name: u.displayName, email: u.email, lastSeen: serverTimestamp() }, { merge: true });

            document.getElementById('u-name').innerText = u.displayName;
            document.getElementById('u-email').innerText = u.email;
            document.getElementById('u-photo').src = u.photoURL;
            
            document.getElementById('role-badge').innerText = isOwner ? "OWNER" : "USER";
            document.getElementById('role-badge').style.background = isOwner ? "#ff4757" : "var(--primary)";
            
            if(isOwner) {
                document.getElementById('n-txt').innerText = "Dashboard";
                openMain(); 
                loadUserOrders(); 
            } else {
                document.getElementById('n-txt').innerText = "Store";
                document.getElementById('user-greet').innerText = "नमस्ते, " + u.displayName.split(" ")[0] + "!";
                openMain();
            }
        } else {
            user = null;
            isOwner = false;
            header.style.setProperty('display', 'none', 'important');
            navBar.style.setProperty('display', 'none', 'important');
            nav('auth');
        }
    });

    // 🛒 असली ऑर्डर बुक करने का फंक्शन
    window.placeOrder = async (serviceName, price) => {
        if(!user) {
            showToast("कृपया पहले लॉगिन करें!", "#ff4757");
            return;
        }
        showToast("ऑर्डर प्रोसेस हो रहा है...");
        try {
            await addDoc(collection(db, "orders"), {
                userId: user.uid,
                customerName: user.displayName,
                customerEmail: user.email,
                serviceName: serviceName,
                price: Number(price),
                status: "Pending",
                timestamp: serverTimestamp()
            });
            showToast("✅ ऑर्डर सफलतापूर्वक बुक हो गया!");
            nav('orders');
        } catch (error) {
            console.error(error);
            showToast("❌ ऑर्डर फेल हो गया।", "#ff4757");
        }
    };

    // 📦 ऑर्डर्स को अपडेट करने का फंक्शन (मालिक के लिए)
    window.updateOrderStatus = async (orderId, newStatus) => {
        try {
            const orderRef = doc(db, "orders", orderId);
            await updateDoc(orderRef, { status: newStatus });
            showToast("स्टेटस अपडेट हो गया!");
            loadUserOrders();
        } catch (e) {
            console.error(e);
            showToast("समस्या आ रही है!", "#ff4757");
        }
    };

    // 📦 ऑर्डर्स लोड और डैशबोर्ड अपडेट फंक्शन
    window.loadUserOrders = () => {
        if(!user) return;
        let q = isOwner ? query(collection(db, "orders"), orderBy("timestamp", "desc")) : query(collection(db, "orders"), where("userId", "==", user.uid), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            let ordersHTML = "";
            let orderCount = 0;
            let totalRevenue = 0;

            snapshot.forEach((docItem) => {
                orderCount++;
                const data = docItem.data();
                const docId = docItem.id; 
                
                if(data.status === "Completed") totalRevenue += data.price;
                let statusColor = data.status === "Pending" ? "var(--gold)" : (data.status === "Completed" ? "var(--primary)" : "var(--red)");
                
                let adminAction = "";
                if(isOwner) {
                    adminAction = `
                        <div style="margin-top:10px; display:flex; gap:5px;">
                            <button onclick="updateOrderStatus('${docId}', 'Completed')" class="btn" style="background:var(--primary); padding:6px; font-size:11px; width:50%; color:white;">Complete</button>
                            <button onclick="updateOrderStatus('${docId}', 'Cancelled')" class="btn" style="background:var(--red); padding:6px; font-size:11px; width:50%; color:white;">Cancel</button>
                        </div>
                    `;
                }
                
                ordersHTML += `
                    <div class="card" style="margin-bottom: 15px; padding: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <b style="font-size: 14px;">${data.serviceName}</b>
                            <span style="background: #f8fafc; padding: 4px 10px; border-radius: 10px; color: ${statusColor}; font-weight: 800; font-size: 11px;">${data.status}</span>
                        </div>
                        <p style="font-size: 11px; color: gray;">ग्राहक: ${data.customerName}</p>
                        <p style="font-size: 16px; font-weight: 800; margin-top: 5px; color: var(--dark);">₹${data.price}</p>
                        ${adminAction}
                    </div>
                `;
            });

            document.getElementById('user-orders-display').innerHTML = ordersHTML || "<div style='text-align:center; padding:40px 20px;'><p style='color:gray;'>कोई ऑर्डर नहीं है।</p></div>";
            if(isOwner) {
                document.getElementById('total-ord').innerText = orderCount;
                document.getElementById('total-rev').innerText = "₹" + totalRevenue;
            }
        });
    };

    // पब्लिश सर्विस फंक्शन
    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const mrp = document.getElementById('s-mrp').value;
        const price = document.getElementById('s-price').value;
        const img = document.getElementById('s-img').value;
        const timer = document.getElementById('s-timer').value;
        const desc = document.getElementById('s-desc').value;
        
        if(!name || !price) {
            showToast("कृपया नाम और कीमत दर्ज करें!", "#ff4757");
            return;
        }
        
        showToast("पब्लिश हो रही है...");
        try {
            await addDoc(collection(db, "services"), {
                name: name, mrp: Number(mrp), price: Number(price), image: img, endTime: timer || null, desc: desc, timestamp: serverTimestamp()
            });
            showToast("✅ सर्विस पब्लिश हो गई!");
            document.querySelectorAll('input, textarea').forEach(el => el.id.startsWith('s-') ? el.value = '' : null);
        } catch (e) { showToast("Error!", "#ff4757"); }
    };

    const loadServices = () => {
        const q = query(collection(db, "services"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            let servicesHTML = "";
            let totalCount = 0;
            snapshot.forEach((doc) => {
                totalCount++;
                const data = doc.data();
                let timerBadge = data.endTime ? `<div class="offer-timer" data-end="${data.endTime}" style="background: #fee2e2; color: #ef4444; font-size: 11px; padding: 6px 12px; border-radius: 12px; font-weight: 800; margin-bottom: 12px; display: inline-block;">⏳ लोड हो रहा है...</div>` : "";
                servicesHTML += `
                    <div class="service-item">
                        <img src="${data.image}" class="service-img" style="width: 100%; height: 190px; object-fit: cover;">
                        <div style="padding: 15px;">
                            ${timerBadge}
                            <h4 style="margin-bottom: 5px;">${data.name}</h4>
                            <p class="service-desc" style="white-space: pre-wrap;">${data.desc}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div><span style="text-decoration: line-through; color: gray; font-size: 12px;">₹${data.mrp}</span><span style="color: var(--primary); font-weight: 800; font-size: 18px;"> ₹${data.price}</span></div>
                                <button class="btn btn-primary" style="width: auto; padding: 8px 20px; font-size: 14px;" onclick="placeOrder('${data.name}', ${data.price
