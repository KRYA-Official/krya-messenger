<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Digital | Super App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--light); color: var(--dark); overflow: hidden; }
        
        .app-shell { height: 100vh; display: flex; flex-direction: column; }
        header { background: #fff; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; padding: 10px 0; }
        .nav-item { flex: 1; text-align: center; color: #64748b; font-size: 12px; border: none; background: none; }
        .nav-item.active { color: var(--accent); }

        .card { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        
        /* Chat UI */
        #chat-container { height: 400px; display: flex; flex-direction: column; background: #f1f5f9; border-radius: 10px; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .msg.user { align-self: flex-end; background: var(--primary); color: white; }
        .msg.ai { align-self: flex-start; background: #fff; border: 1px solid #ddd; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <h2 style="color: var(--dark);">KRYA<span>Digital</span></h2>
        <div id="user-info" style="font-size: 12px;"></div>
    </header>

    <main id="app-view">
        <section id="view-auth" class="view active">
            <div class="card">
                <h3>पंजीकरण / लॉगिन</h3>
                <p style="font-size: 12px; color: gray; margin-bottom: 15px;">सुरक्षित OTP आधारित लॉगिन</p>
                <div id="recaptcha-container"></div>
                <input type="tel" id="phone-number" placeholder="+91 0000000000" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <button class="btn btn-primary" onclick="sendOTP()">OTP भेजें</button>
                <div id="otp-section" style="display:none; margin-top: 10px;">
                    <input type="number" id="otp-code" placeholder="6 अंकों का OTP" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <button class="btn btn-primary" onclick="verifyOTP()">सत्यापित करें</button>
                </div>
            </div>
        </section>

        <section id="view-home" class="view">
            <h3>स्वागत है, <span id="display-name">यूजर</span></h3>
            <div id="order-history" style="margin-top: 20px;"></div>
        </section>

        <section id="view-store" class="view">
            <h3>डिजिटल स्टोर</h3>
            <div id="product-list" style="margin-top: 15px;">
                </div>
        </section>

        <section id="view-chat" class="view">
            <h3>KRYA Voice AI</h3>
            <div id="chat-container">
                <div id="messages"></div>
                <div style="padding: 10px; display: flex; gap: 5px;">
                    <input type="text" id="ai-input" placeholder="कुछ पूछें..." style="flex: 1; border-radius: 20px; padding: 10px; border: 1px solid #ddd;">
                    <button onclick="askAI()" style="background: var(--accent); color: white; border: none; padding: 10px; border-radius: 50%;"><i class="fas fa-paper-plane"></i></button>
                    <button onclick="startVoice()" style="background: var(--primary); color: white; border: none; padding: 10px; border-radius: 50%;"><i class="fas fa-microphone"></i></button>
                </div>
            </div>
        </section>
    </main>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="showView('home')"><i class="fas fa-home"></i><br>Home</button>
        <button class="nav-item" onclick="showView('store')"><i class="fas fa-shopping-cart"></i><br>Store</button>
        <button class="nav-item" onclick="showView('chat')"><i class="fas fa-robot"></i><br>AI Chat</button>
        <button class="nav-item" onclick="showView('auth')"><i class="fas fa-user"></i><br>Profile</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 यहाँ अपनी Firebase Config डालें
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let confirmationResult;
    let currentUser = null;

    // --- Authentication Logic ---
    window.sendOTP = function() {
        const phone = document.getElementById('phone-number').value;
        const appVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {});
        signInWithPhoneNumber(auth, phone, appVerifier)
            .then(result => {
                confirmationResult = result;
                document.getElementById('otp-section').style.display = 'block';
                alert("OTP भेज दिया गया है!");
            }).catch(error => alert(error.message));
    }

    window.verifyOTP = function() {
        const code = document.getElementById('otp-code').value;
        confirmationResult.confirm(code).then(result => {
            const user = result.user;
            saveUserToDb(user);
        }).catch(() => alert("गलत OTP!"));
    }

    async function saveUserToDb(user) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if(!snap.exists()) {
            await setDoc(userRef, {
                uid: user.uid,
                phone: user.phoneNumber,
                role: 'user',
                createdAt: serverTimestamp()
            });
        }
        location.reload();
    }

    onAuthStateChanged(auth, user => {
        if(user) {
            currentUser = user;
            document.getElementById('user-info').innerText = user.phoneNumber;
            showView('home');
            loadProducts();
            loadOrders();
        }
    });

    // --- Navigation ---
    window.showView = function(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    }

    // --- Store & Payments ---
    async function loadProducts() {
        const q = collection(db, "products");
        onSnapshot(q, snap => {
            const container = document.getElementById('product-list');
            container.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                container.innerHTML += `
                    <div class="card">
                        <h4>${p.name}</h4>
                        <p style="font-size: 12px; color: gray;">${p.desc}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <b style="color: var(--primary);">₹${p.price}</b>
                            <button class="btn btn-primary" style="width: auto; padding: 5px 15px;" onclick="initPay('${doc.id}', ${p.price})">Buy Now</button>
                        </div>
                    </div>
                `;
            });
        });
    }

    window.initPay = function(prodId, amount) {
        const options = {
            "key": "YOUR_RAZORPAY_KEY", 
            "amount": amount * 100,
            "currency": "INR",
            "name": "KRYA Digital",
            "description": "Purchase Service",
            "handler": async function (response){
                await createOrder(prodId, amount, response.razorpay_payment_id);
            },
            "prefill": { "contact": currentUser.phoneNumber }
        };
        const rzp = new Razorpay(options);
        rzp.open();
    }

    async function createOrder(prodId, amt, payId) {
        await addDoc(collection(db, "orders"), {
            uid: currentUser.uid,
            productId: prodId,
            amount: amt,
            paymentId: payId,
            status: 'Paid',
            timestamp: serverTimestamp()
        });
        alert("ऑर्डर सफल!");
        showView('home');
    }

    // --- AI & Voice ---
    window.askAI = async function() {
        const input = document.getElementById('ai-input').value;
        addMessage('user', input);
        
        // 🔴 यहाँ अपना Backend API URL डालें जो Gemini/OpenAI से जुड़ा हो
        const response = await fetch('https://your-api.com/chat', {
            method: 'POST',
            body: JSON.stringify({ prompt: input, uid: currentUser.uid })
        });
        const data = await response.json();
        addMessage('ai', data.reply);
        speak(data.reply);
    }

    function addMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function speak(text) {
        const s = new SpeechSynthesisUtterance(text);
        s.lang = 'hi-IN';
        window.speechSynthesis.speak(s);
    }

</script>

</body>
    </html>
