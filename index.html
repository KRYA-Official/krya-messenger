<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KRYA PRO - Official</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; 
            --text: #f8fafc; --coin: #ffd700; --dark-blue: #1e3a8a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Auth Screen */
        .auth-container { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--primary); width: 100%; max-width: 350px; text-align: center; }

        /* App Layout */
        .header { background: var(--card); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .news-ticker { background: var(--dark-blue); color: var(--primary); padding: 5px 0; font-size: 13px; font-weight: bold; }

        .main-content { flex: 1; overflow-y: auto; padding-bottom: 10px; }
        
        /* Fixed Chat Positioning (Solving your problem) */
        #tab-chat { 
            display: none; 
            flex-direction: column; 
            height: calc(100vh - 140px); /* Header + Ticker + Nav की जगह छोड़कर */
            position: relative;
        }
        .chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 70px; }
        
        /* Message Box Fix */
        .chat-input-area { 
            position: fixed; 
            bottom: 70px; /* नेविगेशन बार के ठीक ऊपर */
            left: 0; width: 100%; 
            background: var(--card); 
            padding: 10px; 
            display: flex; 
            gap: 8px; 
            border-top: 1px solid #334155;
            z-index: 100;
        }

        /* Classic ID Card */
        .id-card { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            border: 2px solid var(--primary); margin: 15px; padding: 20px; border-radius: 15px; position: relative;
        }
        .id-photo { width: 90px; height: 110px; border: 2px solid var(--primary); border-radius: 10px; object-fit: cover; }

        /* Buttons & Inputs */
        input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 10px; color: white; }
        .btn-p { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--card); display: flex; border-top: 1px solid #334155; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; }
        .nav-item.active { color: var(--primary); }

        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg-me { align-self: flex-end; background: var(--primary); color: #000; }
        .msg-them { align-self: flex-start; background: #334155; color: #fff; }

        .hidden { display: none !important; }
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <div class="auth-card">
        <h2 style="color:var(--primary); margin-bottom:15px;">KRYA SECURE</h2>
        <div id="email-box">
            <input type="email" id="auth-email" placeholder="email@gmail.com">
            <button class="btn-p" onclick="sendOTP()" style="width:100%; margin-top:10px;">OTP भेजें</button>
        </div>
        <div id="otp-box" class="hidden">
            <input type="number" id="auth-otp" placeholder="6-अंकों का OTP">
            <button class="btn-p" onclick="verifyOTP()" style="width:100%; margin-top:10px;">प्रवेश करें</button>
        </div>
    </div>
</div>

<div id="app-root" style="display:none; flex-direction:column; height:100%;">
    <div class="header">
        <b style="color:var(--primary); font-size:20px;">KRYA PRO</b>
        <div style="color:var(--coin); font-weight:bold;"><i class="fas fa-coins"></i> <span id="balance">700</span></div>
    </div>

    <div class="news-ticker">
        <marquee scrollamount="5">🚀 स्वागत है मुकेश राय! | KRYA मॉल में नए 3D लोगो लाइव हैं | AI से अपनी समस्या पूछें... </marquee>
    </div>

    <div class="main-content">
        <div id="tab-home">
            <div class="id-card">
                <div style="display:flex; gap:15px;">
                    <img id="u-img" src="https://via.placeholder.com/90" class="id-photo">
                    <div>
                        <h3 id="u-name" style="color:var(--primary);">मुकेश राय</h3>
                        <p id="u-skill" style="font-size:13px; opacity:0.8;">लोड हो रहा है...</p>
                        <p id="u-addr" style="font-size:12px; margin-top:5px;"><i class="fas fa-map-marker-alt"></i> बांका, बिहार</p>
                    </div>
                </div>
            </div>
            <center>
                <button onclick="startAI()" style="width:70px; height:70px; border-radius:50%; background:#3b82f6; border:none; color:white; font-size:30px;"><i class="fas fa-microphone"></i></button>
                <p id="ai-status" style="margin-top:10px; font-size:14px; color:var(--primary);">AI तैयार है</p>
            </center>
        </div>

        <div id="tab-chat">
            <div class="chat-flow" id="msg-list"></div>
            <div class="chat-input-area">
                <input type="text" id="m-input" placeholder="यहाँ लिखें...">
                <button class="btn-p" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="n-home" onclick="nav('home')"><i class="fas fa-home"></i><br>होम</div>
        <div class="nav-item" id="n-chat" onclick="nav('chat')"><i class="fas fa-comments"></i><br>चैट</div>
        <div class="nav-item" onclick="showSet()"><i class="fas fa-user-cog"></i><br>सेटिंग्स</div>
    </div>
</div>

<div id="set-ui" class="overlay">
    <h2>प्रोफाइल सेटिंग्स</h2>
    <input type="text" id="s-name" placeholder="नाम">
    <input type="text" id="s-skill" placeholder="पेशा">
    <button class="btn-p" onclick="saveSet()">अपडेट करें</button>
    <button onclick="document.getElementById('set-ui').style.display='none'" style="margin-top:10px; background:none; color:white; border:none;">वापस</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const fb = initializeApp({
        apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
        projectId: "sample-firebase-ai-app-37d2b",
        appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    });
    const db = getFirestore(fb);
    emailjs.init("msEHMlMxmjBbBoqnn");

    let userOTP, userMail;
    let data = JSON.parse(localStorage.getItem('krya_v1')) || { name: "मुकेश राय", skill: "डिजिटल उद्यमी", addr: "बांका, बिहार" };

    window.sendOTP = () => {
        userMail = document.getElementById('auth-email').value;
        userOTP = Math.floor(100000 + Math.random()*900000);
        emailjs.send("service_gls676h", "template_6teuhl4", { email: userMail, otp: userOTP })
        .then(() => {
            document.getElementById('email-box').classList.add('hidden');
            document.getElementById('otp-box').classList.remove('hidden');
        });
    };

    window.verifyOTP = () => {
        if(document.getElementById('auth-otp').value == userOTP) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-root').style.display = 'flex';
            loadUI();
        }
    };

    function loadUI() {
        document.getElementById('u-name').innerText = data.name;
        document.getElementById('u-skill').innerText = data.skill;
        onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), s => {
            const list = document.getElementById('msg-list');
            list.innerHTML = "";
            s.forEach(doc => {
                const m = doc.data();
                const div = document.createElement('div');
                div.className = m.user === data.name ? 'msg msg-me' : 'msg msg-them';
                div.innerHTML = `<small style="display:block; font-size:10px; opacity:0.7;">${m.user}</small>${m.text}`;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        });
    }

    window.sendMsg = async () => {
        const val = document.getElementById('m-input').value;
        if(!val) return;
        document.getElementById('m-input').value = "";
        await addDoc(collection(db, "messages"), { text: val, user: data.name, time: serverTimestamp() });
    };

    window.nav = (t) => {
        document.getElementById('tab-home').style.display = t === 'home' ? 'block' : 'none';
        document.getElementById('tab-chat').style.display = t === 'chat' ? 'flex' : 'none';
        document.getElementById('n-home').classList.toggle('active', t === 'home');
        document.getElementById('n-chat').classList.toggle('active', t === 'chat');
    };

    window.showSet = () => document.getElementById('set-ui').style.display = 'flex';
    window.saveSet = () => {
        data.name = document.getElementById('s-name').value || data.name;
        data.skill = document.getElementById('s-skill').value || data.skill;
        localStorage.setItem('krya_v1', JSON.stringify(data));
        loadUI();
        document.getElementById('set-ui').style.display = 'none';
    };
</script>
</body>
</html>
