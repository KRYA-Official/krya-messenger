<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 2px solid var(--primary); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main { background: var(--primary); color: #0f172a; }
        .hidden { display: none !important; }
        #app-main { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #0f172a; }
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .footer { padding: 15px; background: var(--card); display: flex; gap: 10px; }
        #msg-input { flex: 1; background: #0b1120; border: 1px solid #334155; color: white; padding: 10px; border-radius: 10px; }
        #scratch-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; z-index: 100; text-align: center; border: 4px solid var(--primary); }
    </style>
</head>
<body>

<div id="screen-otp" class="auth-card">
    <h2 style="color:var(--primary)">KRYA MESSENGER</h2>
    <div id="email-step">
        <p style="margin:10px 0; font-size: 14px;">सुरक्षित लॉगिन के लिए ईमेल डालें</p>
        <input type="email" id="user-email" placeholder="example@gmail.com">
        <button class="btn btn-main" onclick="sendOTP()">OTP भेजें</button>
    </div>
    <div id="otp-step" class="hidden">
        <p style="margin:10px 0; font-size: 14px; color:var(--primary)">OTP ईमेल पर भेज दिया गया है</p>
        <input type="number" id="otp-input" placeholder="000000">
        <button class="btn btn-main" onclick="verifyOTP()">वेरिफाई करें</button>
    </div>
    <p id="status-msg" style="margin-top:15px; font-size:12px;"></p>
</div>

<div id="screen-handle" class="auth-card hidden">
    <h2>अपना हैंडल चुनें</h2>
    <input type="text" id="input-handle" placeholder="username जैसे: @mukesh">
    <button class="btn btn-main" id="btn-save-handle">प्रोफ़ाइल सेट करें</button>
</div>

<div id="app-main" class="hidden">
    <div class="header">
        <div style="color:var(--primary); font-size:1.5rem; font-weight:bold;">KRYA</div>
        <div>
            <i class="fas fa-gift" id="show-scratch" style="color:var(--primary); margin-right:20px; cursor:pointer;"></i>
            <i class="fas fa-sign-out-alt" id="btn-logout" style="color:#ef4444; cursor:pointer;"></i>
        </div>
    </div>
    <div id="chat-flow"></div>
    <div class="footer">
        <input type="text" id="msg-input" placeholder="संदेश लिखें...">
        <button id="btn-send" style="background:var(--primary); border:none; padding:10px 15px; border-radius:10px;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div id="scratch-box" class="hidden">
    <h3 style="color:#0b1120; margin-bottom:10px;">आपका लकी कार्ड!</h3>
    <canvas id="scratch-canvas" width="200" height="100" style="background:#888; border-radius:10px;"></canvas>
    <p id="scratch-msg" style="color:green; font-weight:bold; margin-top:10px;" class="hidden">बधाई हो! आपने कूपन जीता।</p>
    <button onclick="document.getElementById('scratch-box').classList.add('hidden')" style="margin-top:10px; background:#0b1120; color:white; border:none; padding:5px 10px; border-radius:5px;">बंद करें</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
        apiKey: "AIzaSyCtSIGAybHuIga19QpPRS1egRrsbhvJV2c",
        authDomain: "krya-94e55.firebaseapp.com",
        projectId: "krya-94e55",
        storageBucket: "krya-94e55.firebasestorage.app",
        messagingSenderId: "1025043894227",
        appId: "1:1025043894227:web:fa57c21ed2f6381a792926"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("msEHMlMxmjBbBoqnn"); // आपकी Public Key

    let generatedOTP;
    let userEmail;
    let userLoggedIn = false;

    // --- OTP सिस्टम शुरू ---
    window.sendOTP = function() {
        userEmail = document.getElementById('user-email').value;
        const status = document.getElementById('status-msg');
        if(!userEmail.includes('@')) return alert("सही ईमेल डालें");

        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        status.innerText = "भेजा जा रहा है...";

        emailjs.send('service_gls676h', 'template_6teuhl4', { email: userEmail, otp: generatedOTP })
            .then(() => {
                document.getElementById('email-step').classList.add('hidden');
                document.getElementById('otp-step').classList.remove('hidden');
                status.innerText = "";
            });
    }

    window.verifyOTP = async function() {
        const input = document.getElementById('otp-input').value;
        if(input == generatedOTP) {
            userLoggedIn = true;
            checkUserProfile();
        } else {
            alert("गलत OTP!");
        }
    }

    async function checkUserProfile() {
        // चूंकि हमने पासवर्ड हटाया है, हम ईमेल को ही ID मानेंगे
        const userId = btoa(userEmail); // ईमेल को एक सुरक्षित ID में बदलना
        const u = await getDoc(doc(db, "users", userId));
        
        document.getElementById('screen-otp').classList.add('hidden');
        if(u.exists() && u.data().handle) {
            showApp(u.data().handle, userId);
        } else {
            document.getElementById('screen-handle').classList.remove('hidden');
            document.getElementById('btn-save-handle').onclick = async () => {
                const h = document.getElementById('input-handle').value.trim();
                await setDoc(doc(db, "users", userId), { handle: h, email: userEmail, uid: userId });
                showApp(h, userId);
            };
        }
    }

    function showApp(handle, userId) {
        document.getElementById('screen-handle').classList.add('hidden');
        document.getElementById('app-main').classList.remove('hidden');
        initChat(handle, userId);
    }

    function initChat(handle, userId) {
        const flow = document.getElementById('chat-flow');
        onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), snap => {
            flow.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const isMe = m.uid === userId;
                const div = document.createElement('div');
                div.style = `max-width:80%; padding:10px; border-radius:15px; margin-bottom:10px; align-self:${isMe ? 'flex-end' : 'flex-start'}; background:${isMe ? 'var(--primary)' : 'var(--card)'}; color:${isMe ? '#000' : '#fff'}`;
                div.innerHTML = `<small style="display:block; font-size:10px;">${m.user}</small>${m.text}`;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        });

        document.getElementById('btn-send').onclick = async () => {
            const txt = document.getElementById('msg-input').value.trim();
            if(!txt) return;
            await addDoc(collection(db, "messages"), { text: txt, user: handle, uid: userId, time: serverTimestamp() });
            document.getElementById('msg-input').value = "";
        };
    }

    // Scratch Logic
    document.getElementById('show-scratch').onclick = () => {
        document.getElementById('scratch-box').classList.remove('hidden');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#888';
        ctx.fillRect(0,0,200,100);
        canvas.ontouchmove = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
            document.getElementById('scratch-msg').classList.remove('hidden');
        };
    };

    document.getElementById('btn-logout').onclick = () => location.reload();
</script>
</body>
</html>
