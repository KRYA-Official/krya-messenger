<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYA Spin Game</title>

<style>
body{font-family:sans-serif;background:#0b1120;color:#fff;text-align:center}
.box{background:#1e293b;padding:20px;margin:20px auto;border-radius:10px;max-width:400px}
button{padding:12px;margin:10px;border:none;border-radius:8px;background:#fbbf24;color:#000;font-weight:bold;width:90%}
</style>
</head>

<body>

<div class="box">
<h2>🎡 Spin & Earn</h2>
<p>Coins: <span id="coins">0</span></p>
<p>Winning: ₹<span id="winning">0</span></p>

<button onclick="spin()">Spin (10 Coins)</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔹 AUTO USER
let userId = localStorage.getItem("spinUser");

if(!userId){
userId = "user_" + Math.random().toString(36).substr(2,6);
localStorage.setItem("spinUser", userId);
}

// INIT USER
async function init(){
const ref = doc(db,"users",userId);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
coins:50,
winning:0,
lastSpin:0
});
}

loadWallet();
}

init();

// LOAD
async function loadWallet(){
const snap = await getDoc(doc(db,"users",userId));
const d = snap.data();

document.getElementById("coins").innerText=d.coins;
document.getElementById("winning").innerText=d.winning;
}

// SPIN GAME
window.spin = async function(){

const ref = doc(db,"users",userId);
const snap = await getDoc(ref);
let data = snap.data();

// daily limit
let today = new Date().toDateString();
let last = data.lastSpinDate;

if(last === today){
alert("आज का spin हो चुका है");
return;
}

if(data.coins < 10){
alert("Coins कम हैं");
return;
}

// reward logic
let rewards = [0,5,10,20,50];
let reward = rewards[Math.floor(Math.random()*rewards.length)];

// update
await updateDoc(ref,{
coins: data.coins - 10,
winning: data.winning + reward,
lastSpinDate: today
});

alert("🎉 आपको ₹"+reward+" मिला");

loadWallet();
}

</script>

</body>
</html>
