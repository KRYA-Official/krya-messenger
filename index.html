<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - Jio Mukesh</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("msEHMlMxmjBbBoqnn");
        })();
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #otpSection { display: none; }
        .message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>KRYA Messenger</h2>
    <div id="emailSection">
        <p>लॉगिन करने के लिए ईमेल डालें</p>
        <input type="email" id="userEmail" placeholder="example@gmail.com">
        <button onclick="sendOTP()">OTP भेजें</button>
    </div>
    <div id="otpSection">
        <p>6 अंकों का कोड यहाँ डालें</p>
        <input type="number" id="otpInput" placeholder="000000">
        <button onclick="verifyOTP()">वेरिफाई करें</button>
    </div>
    <div id="statusMsg" class="message"></div>
</div>

<script>
    let generatedOTP;
    function sendOTP() {
        const email = document.getElementById('userEmail').value;
        const status = document.getElementById('statusMsg');
        if(!email) { status.innerText = "कृपया ईमेल डालें"; return; }
        status.style.color = "blue";
        status.innerText = "OTP भेजा जा रहा है...";
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        emailjs.send('service_gls676h', 'template_6touhl4', { email: email, otp: generatedOTP })
            .then(function() {
               status.style.color = "green";
               status.innerText = "OTP भेज दिया गया है!";
               document.getElementById('emailSection').style.display = 'none';
               document.getElementById('otpSection').style.display = 'block';
            }, function(err) {
               status.style.color = "red";
               status.innerText = "Error: " + err.text;
            });
    }
    function verifyOTP() {
        const userInput = document.getElementById('otpInput').value;
        const status = document.getElementById('statusMsg');
        if(userInput == generatedOTP) {
            status.style.color = "green";
            status.innerText = "लॉगिन सफल! KRYA में स्वागत है।";
        } else {
            status.style.color = "red";
            status.innerText = "गलत OTP, फिर से प्रयास करें।";
        }
    }
</script>
</body>
</html>
