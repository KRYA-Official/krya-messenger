<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA LIVE | Digital Walkie-Talkie India</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --live: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        /* Auth Screen */
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; margin: auto; border: 1px solid rgba(251, 191, 36, 0.3); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-main { background: var(--primary); color: #0f172a; }

        /* App UI */
        #app-main { flex: 1; display: flex; flex-direction: column; }
        .header { height: 70px; background: var(--card); padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }
        
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* Message Bubbles */
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-me { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 4px; }
        .msg-them { align-self: flex-start; background: var(--card); color: #fff; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .handle-name { font-size: 10px; font-weight: bold; margin-bottom: 4px; opacity: 0.8; display: block; }

        /* Real Walkie-Talkie Button */
        .controls { padding: 20px; background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 15px; border-top: 1px solid #334155; }
        #wt-button { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #0f172a; background: var(--primary); color: #000; font-size: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); touch-action: none; transition: 0.1s; }
        #wt-button.active { background: var(--live); transform: scale(0.9); box-shadow: 0 0 40px var(--live); color: white; }
        .hint-text { font-size: 12px; color: #94a3b8; font-weight: bold; }

        /* Text Input Row */
        .text-row { width: 100%; display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        #btn-send { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); border: none; color: #000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="screen-otp" class="auth-card">
    <h2 style="color:var(--primary); margin-bottom: 10px;">KRYA LIVE</h2>
    <p style="font-size: 13px; margin-bottom: 20px;">हिंदुस्तान का अपना वॉकी-टॉकी</p>
    <div id="email-step">
        <input type="email" id="user-email" placeholder="अपनी ईमेल आईडी डालें">
        <button class="btn btn-main" onclick="sendOTP()">OTP भेजें</button>
    </div>
    <div id="otp-step" class="hidden">
        <input type="number" id="otp-input" placeholder="000000">
        <button class="btn btn-main" onclick="verifyOTP()">लॉगिन करें</button>
    </div>
</div>

<div id="screen-handle" class="auth-card hidden">
    <h2>अपनी पहचान (Handle)</h2>
    <input type="text" id="input-handle" placeholder="उदाहरण: @MukeshBanka">
    <button class="btn btn-main" id="btn-save-handle">शुरू करें</button>
</div>

<div id="app-main" class="hidden">
    <div class="header">
        <div class="logo">KRYA</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <i class="fas fa-sync-alt" onclick="location.reload()" style="color:var(--primary); cursor:pointer;"></i>
            <i class="fas fa-power-off" id="btn-logout" style="color:var(--live); cursor:pointer;"></i>
        </div>
    </div>
    
    <div id="chat-flow"></div>

    <div class="controls">
        <p class="hint-text">दबाकर बोलें (PUSH TO TALK)</p>
        <button id="wt-button"><i class="fas fa-microphone"></i></button>
        
        <div class="text-row">
            <input type="text" id="msg-input" placeholder="संदेश लिखें...">
            <button id="btn-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
      authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
      projectId: "sample-firebase-ai-app-37d2b",
      storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
      messagingSenderId: "652996597348",
      appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("msEHMlMxmjBbBoqnn");

    let generatedOTP, userEmail, myHandle, myUid, mediaRecorder, audioChunks = [];

    // --- ऑटो-लॉगिन चेक (Persistent Login) ---
    window.onload = async () => {
        const savedUid = localStorage.getItem('krya_uid');
        if (savedUid) {
            myUid = savedUid;
            const u = await getDoc(doc(db, "users", myUid));
            if (u.exists()) { showApp(u.data().handle); }
        }
    };

    // --- OTP & LOGIN ---
    window.sendOTP = function() {
        userEmail = document.getElementById('user-email').value;
        if(!userEmail.includes('@')) return alert("सही ईमेल डालें");
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        emailjs.send('service_gls676h', 'template_6teuhl4', { email: userEmail, otp: generatedOTP })
            .then(() => {
                document.getElementById('email-step').classList.add('hidden');
                document.getElementById('otp-step').classList.remove('hidden');
            });
    };

    window.verifyOTP = async function() {
        const input = document.getElementById('otp-input').value;
        if(input == generatedOTP) {
            myUid = btoa(userEmail);
            localStorage.setItem('krya_uid', myUid); // सेव करें ताकि दोबारा OTP न मांगें
            const u = await getDoc(doc(db, "users", myUid));
            document.getElementById('screen-otp').classList.add('hidden');
            if(u.exists()) { showApp(u.data().handle); } 
            else { document.getElementById('screen-handle').classList.remove('hidden'); }
        } else { alert("गलत OTP"); }
    };

    document.getElementById('btn-save-handle').onclick = async () => {
        myHandle = document.getElementById('input-handle').value.trim();
        if(!myHandle) return alert("नाम लिखें");
        await setDoc(doc(db, "users", myUid), { handle: myHandle, email: userEmail });
        showApp(myHandle);
    };

    function showApp(handle) {
        myHandle = handle;
        document.getElementById('screen-otp').classList.add('hidden');
        document.getElementById('screen-handle').classList.add('hidden');
        document.getElementById('app-main').classList.remove('hidden');
        initChat();
    }

    // --- असली वॉकी-टॉकी इंजन ---
    function initChat() {
        const flow = document.getElementById('chat-flow');
        // सिर्फ आखिरी 50 मैसेज लोड करेंगे ताकि रिफ्रेश तेज हो
        const q = query(collection(db, "messages"), orderBy("time", "asc"), limitToLast(50));
        
        onSnapshot(q, snap => {
            snap.docChanges().forEach(change => {
                if (change.type === "added") {
                    const m = change.doc.data();
                    renderMsg(m);
                    // अगर नया ऑडियो आया और वह आपका नहीं है, तो अपने आप बजाएं
                    if(m.type === 'audio' && m.uid !== myUid) { playAudio(m.audio); }
                }
            });
            flow.scrollTop = flow.scrollHeight;
        });
    }

    function renderMsg(m) {
        const isMe = m.uid === myUid;
        const div = document.createElement('div');
        div.className = isMe ? 'msg msg-me' : 'msg msg-them';
        div.innerHTML = `
            <small class="handle-name">${isMe ? 'You' : m.user}</small>
            ${m.type === 'audio' ? '🎤 <b>आवाज़ संदेश...</b>' : m.text}
        `;
        document.getElementById('chat-flow').appendChild(div);
    }

    async function sendMsg(type, content) {
        await addDoc(collection(db, "messages"), {
            type: type,
            text: type === 'text' ? content : '',
            audio: type === 'audio' ? content : '',
            user: myHandle,
            uid: myUid,
            time: serverTimestamp()
        });
    }

    // --- माइक रिकॉर्डिंग सिस्टम (Push to Talk) ---
    const wtBtn = document.getElementById('wt-button');
    
    const startRecording = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => sendMsg('audio', reader.result);
            };
            mediaRecorder.start();
            wtBtn.classList.add('active');
        } catch (e) { alert("माइक चालू करें!"); }
    };

    const stopRecording = () => {
        if(mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            wtBtn.classList.remove('active');
        }
    };

    // मोबाइल और डेस्कटॉप दोनों के लिए इवेंट्स
    wtBtn.addEventListener('mousedown', startRecording);
    wtBtn.addEventListener('mouseup', stopRecording);
    wtBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    wtBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    document.getElementById('btn-send').onclick = () => {
        const val = document.getElementById('msg-input').value.trim();
        if(val) { sendMsg('text', val); document.getElementById('msg-input').value = ""; }
    };

    function playAudio(base64) {
        const audio = new Audio(base64);
        audio.play().catch(e => console.log("ऑटोप्ले ब्लॉक हुआ, यूजर ने अभी स्क्रीन नहीं छुई"));
    }

    document.getElementById('btn-logout').onclick = () => {
        localStorage.removeItem('krya_uid');
        location.reload();
    };
</script>
</body>
</html>
