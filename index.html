<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .overlay-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 2px solid var(--primary); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .auth-card h2 { color: var(--primary); margin-bottom: 20px; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-main { background: var(--primary); color: #0f172a; }
        .btn-sub { background: #334155; color: white; }
        .app-container { max-width: 600px; margin: 0 auto; background: #0f172a; height: 100vh; display: flex; flex-direction: column; border-left: 1px solid #334155; border-right: 1px solid #334155; }
        .header { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .brand { font-size: 1.5rem; font-weight: 900; color: var(--primary); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; position: relative; font-size: 0.95rem; line-height: 1.4; }
        .bubble .u-name { display: block; font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; opacity: 0.8; }
        .my-msg { align-self: flex-end; background: var(--primary); color: #0f172a; border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: var(--card); color: white; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .footer-input { background: var(--card); padding: 15px; display: flex; gap: 10px; align-items: center; }
        #msg-input { flex: 1; background: #0b1120; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; resize: none; height: 45px; outline: none; }
        .send-icon { background: var(--primary); color: #0f172a; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="screen-auth" class="overlay-screen">
    <div class="auth-card">
        <h2 id="auth-title">KRYA MESSENGER</h2>
        <div id="signup-fields">
            <input type="text" id="reg-name" placeholder="आपका पूरा नाम">
        </div>
        <input type="email" id="reg-email" placeholder="ईमेल आईडी">
        <input type="password" id="reg-pass" placeholder="पासवर्ड">
        <button class="btn btn-main" id="btn-action">साइन-अप करें</button>
        <button class="btn btn-sub" id="btn-toggle">पहले से अकाउंट है? लॉगिन</button>
    </div>
</div>

<div id="screen-handle" class="overlay-screen hidden">
    <div class="auth-card">
        <h2>अपना हैंडल चुनें</h2>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">यह आपकी पहचान होगी (उदा: @raaj)</p>
        <input type="text" id="input-handle" placeholder="username">
        <button class="btn btn-main" id="btn-save-handle">प्रोफ़ाइल सेट करें</button>
    </div>
</div>

<div id="app-main" class="app-container hidden">
    <div class="header">
        <div class="brand">KRYA</div>
        <i class="fas fa-sign-out-alt" id="btn-logout" style="cursor:pointer; color:#ef4444;"></i>
    </div>
    <div id="chat-flow"></div>
    <div class="footer-input">
        <textarea id="msg-input" placeholder="कुछ लिखें..."></textarea>
        <button id="btn-send" class="send-icon"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCtSIGAybHuIga19QpPRS1egRrsbhvJV2c",
        authDomain: "krya-94e55.firebaseapp.com",
        projectId: "krya-94e55",
        storageBucket: "krya-94e55.firebasestorage.app",
        messagingSenderId: "1025043894227",
        appId: "1:1025043894227:web:fa57c21ed2f6381a792926"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isLoginMode = false;

    // UI Toggle
    document.getElementById('btn-toggle').addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        document.getElementById('signup-fields').classList.toggle('hidden', isLoginMode);
        document.getElementById('btn-action').innerText = isLoginMode ? 'लॉगिन करें' : 'साइन-अप करें';
        document.getElementById('btn-toggle').innerText = isLoginMode ? 'नया अकाउंट बनाएँ' : 'पहले से अकाउंट है? लॉगिन';
    });

    // Auth Action
    document.getElementById('btn-action').addEventListener('click', async () => {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value;
        const name = document.getElementById('reg-name').value.trim();
        const btn = document.getElementById('btn-action');

        if(!email || !pass) return alert("ईमेल और पासवर्ड भरें!");
        
        btn.disabled = true;
        btn.innerText = "प्रोसेसिंग...";

        try {
            if (isLoginMode) {
                await signInWithEmailAndPassword(auth, email, pass);
            } else {
                if(!name) { 
                    btn.disabled = false;
                    btn.innerText = "साइन-अप करें";
                    return alert("नाम लिखें"); 
                }
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), { fullName: name, email, uid: res.user.uid });
            }
        } catch (err) { 
            alert("एरर: " + err.message);
            btn.disabled = false;
            btn.innerText = isLoginMode ? "लॉगिन करें" : "साइन-अप करें";
        }
    });

    // Save Handle
    document.getElementById('btn-save-handle').addEventListener('click', async () => {
        const h = document.getElementById('input-handle').value.trim().toLowerCase().replace('@','');
        if(!h) return alert("हैंडल लिखें!");
        
        const hRef = doc(db, "handles", h);
        const snap = await getDoc(hRef);
        if(snap.exists()) return alert("यह नाम पहले से बुक है!");

        await setDoc(hRef, { uid: auth.currentUser.uid });
        await setDoc(doc(db, "users", auth.currentUser.uid), { handle: "@"+h }, { merge: true });
        location.reload(); // Refresh to sync state
    });

    // Chat Functions
    async function doSend() {
        const txt = document.getElementById('msg-input').value.trim();
        if(!txt || !auth.currentUser) return;
        const uSnap = await getDoc(doc(db, "users", auth.currentUser.uid));
        await addDoc(collection(db, "messages"), {
            text: txt,
            user: uSnap.data().handle,
            uid: auth.currentUser.uid,
            time: serverTimestamp()
        });
        document.getElementById('msg-input').value = "";
    }

    document.getElementById('btn-send').addEventListener('click', doSend);
    document.getElementById('msg-input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }});

    // Auth Sync
    onAuthStateChanged(auth, async user => {
        const sAuth = document.getElementById('screen-auth');
        const sHand = document.getElementById('screen-handle');
        const sMain = document.getElementById('app-main');

        if(user) {
            const uSnap = await getDoc(doc(db, "users", user.uid));
            if(uSnap.exists() && uSnap.data().handle) {
                sAuth.classList.add('hidden'); sHand.classList.add('hidden'); sMain.classList.remove('hidden');
                initChat();
            } else {
                sAuth.classList.add('hidden'); sHand.classList.remove('hidden'); sMain.classList.add('hidden');
            }
        } else {
            sAuth.classList.remove('hidden'); sHand.classList.add('hidden'); sMain.classList.add('hidden');
        }
    });

    function initChat() {
        const q = query(collection(db, "messages"), orderBy("time", "asc"));
        onSnapshot(q, snap => {
            const flow = document.getElementById('chat-flow');
            flow.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const isMe = m.uid === auth.currentUser.uid;
                const div = document.createElement('div');
                div.className = `bubble ${isMe ? 'my-msg' : 'other-msg'}`;
                div.innerHTML = `<span class="u-name">${m.user}</span>${m.text}`;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        });
    }

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
