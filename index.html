<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA Portal | राष्ट्रीय एकता संघ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { 
            --primary: #10b981; 
            --secondary: #fbbf24; 
            --org-blue: #2563eb; 
            --org-red: #ef4444;
            --dark: #0f172a; 
            --glass: rgba(255, 255, 255, 0.95);
        }

        /* 1. Global Fixes */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: #f8fafc;
            color: #1e293b; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* बॉडी स्क्रॉल नहीं होगी, केवल सेक्शन होंगे */
        }
        .container { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
        .hidden { display: none !important; }

        /* 2. Header Improvements */
        header { 
            background: var(--dark); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .logo { font-size: 22px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .logo span { color: var(--secondary); }
        .verified-badge { font-size: 9px; background: var(--primary); color: white; padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }

        /* 3. Section Container Fixes (Full Height) */
        #tab-sangh, #tab-services, #tab-messenger {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 4. Messenger FULL SCREEN FIX */
        .chat-container {
            flex: 1; /* पूरी बची हुई जगह घेरेगा */
            display: flex;
            flex-direction: column;
            background: #111827;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #1e293b;
            margin-bottom: 5px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .msg-them { background: #1f2937; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 12px; background: #1f2937; display: flex; gap: 8px; }
        .chat-input { flex: 1; background: #111827; border: none; border-radius: 25px; padding: 10px 15px; color: white; outline: none; font-size: 14px; }
        .btn-send { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }

        /* 5. Mobile Navigation */
        .mobile-nav { 
            background: white;
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid #e2e8f0; z-index: 1001;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }
        .nav-item { text-align: center; color: #64748b; cursor: pointer; flex: 1; border: none; background: none; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        /* 6. Sangh & Services Cards */
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .org-header { text-align: center; margin-bottom: 20px; }
        .org-header img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--org-blue); margin-bottom: 10px; }
        
        .form-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; background: var(--org-blue); color: white; padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* Floating WhatsApp */
        .wa-float { 
            position: fixed; bottom: 85px; right: 20px; 
            background: #25d366; color: white; width: 50px; height: 50px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999;
            text-decoration: none; 
        }

        /* Spinner */
        .spinner { width: 18px; height: 18px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">KRYA<span>live</span><span class="verified-badge">VERIFIED</span></div>
    </header>

    <a href="https://wa.me/916379403821" class="wa-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div class="container">

        <div id="tab-sangh" class="animate__animated animate__fadeIn">
            <div class="card">
                <div class="org-header">
                    <img src="https://via.placeholder.com/100" alt="MD Siraj">
                    <h1 style="font-size: 22px; color: var(--org-blue);">राष्ट्रीय एकता संघ</h1>
                    <p style="font-size: 12px; color: #64748b;">अखिल भारतीय मजदूर कल्याण सेवा संघ</p>
                    <p style="font-size: 11px; margin-top: 5px; color: var(--org-red);"><b>रजिस्ट्रेशन नं: 12014</b></p>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <a href="tel:+916379403821" style="flex: 1; background: #007bff; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px;"><i class="fas fa-phone"></i> कॉल करें</a>
                    <a href="https://wa.me/916379403821" style="flex: 1; background: #25d366; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px;"><i class="fab fa-whatsapp"></i> वॉट्सऐप</a>
                </div>

                <form id="labourForm">
                    <input type="text" id="m_name" class="form-input" placeholder="मजदूर का नाम *" required>
                    <input type="tel" id="m_phone" class="form-input" placeholder="मोबाइल नंबर *" required>
                    <select id="m_district" class="form-input" required>
                        <option value="">जिला चुनें...</option>
                        <option value="Banka">बांका</option>
                        <option value="Munger">मुंगेर</option>
                        <option value="Delhi">दिल्ली</option>
                    </select>
                    <textarea id="m_issue" class="form-input" placeholder="अपनी समस्या लिखें..." style="height: 80px;"></textarea>
                    <button type="submit" id="submitBtn" class="btn-submit" style="display: flex; align-items: center; justify-content: center;">
                        <div class="spinner" id="btnSpinner"></div>
                        <span>डेटा सुरक्षित जमा करें</span>
                    </button>
                </form>
                <div id="formStatus" style="margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; display: none;"></div>
            </div>
            <p style="text-align: center; font-size: 10px; color: #94a3b8; padding-bottom: 20px;">© 2026 KRYA Digital | Designed by मुकेश राय</p>
        </div>

        <div id="tab-services" class="hidden animate__animated animate__fadeIn">
            <div class="card">
                <h3 style="margin-bottom: 15px;">Digital Services</h3>
                <div style="border: 1px solid #f1f5f9; border-radius: 12px; overflow: hidden; margin-bottom: 15px;">
                    <img src="https://images.unsplash.com/photo-1626785774573-4b799315345d?w=500" style="width: 100%; height: 150px; object-fit: cover;">
                    <div style="padding: 15px;">
                        <h4 style="font-size: 16px;">3D Logo Design</h4>
                        <p style="font-size: 18px; font-weight: 800; color: var(--primary); margin: 5px 0;">₹199</p>
                        <button style="width: 100%; background: var(--dark); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold;">Buy Now</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-messenger" class="hidden animate__animated animate__fadeIn">
            <div class="chat-container">
                <div style="padding: 12px 15px; background: #1f2937; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151;">
                    <span style="font-weight: 700; color: var(--primary); font-size: 14px;">KRYA Messenger ●</span>
                </div>
                <div class="chat-messages" id="chatFlow">
                    <div class="message msg-them">नमस्ते! मैं मुकेश राय हूँ। मैं आपकी क्या मदद कर सकता हूँ?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" placeholder="Type a message...">
                    <button class="btn-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

    </div>

    <nav class="mobile-nav">
        <button class="nav-item active" id="nav-sangh" onclick="switchTab('sangh')">
            <i class="fas fa-users"></i>
            <span>संघ</span>
        </button>
        <button class="nav-item" id="nav-services" onclick="switchTab('services')">
            <i class="fas fa-briefcase"></i>
            <span>Services</span>
        </button>
        <button class="nav-item" id="nav-messenger" onclick="switchTab('messenger')">
            <i class="fas fa-comment-dots"></i>
            <span>Chat</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 अपना Firebase Config यहाँ भरें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Tab Switcher Logic
        window.switchTab = function(tabName) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).classList.add('active');
        };

        // 2. Firebase Form Submission
        const labourForm = document.getElementById('labourForm');
        labourForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const status = document.getElementById('formStatus');

            btn.disabled = true;
            spinner.style.display = "block";
            status.style.display = "none";

            try {
                await addDoc(collection(db, "labour_registrations"), {
                    name: document.getElementById('m_name').value,
                    phone: document.getElementById('m_phone').value,
                    district: document.getElementById('m_district').value,
                    issue: document.getElementById('m_issue').value,
                    timestamp: serverTimestamp()
                });

                status.style.display = "block";
                status.style.background = "#d1fae5";
                status.style.color = "#065f46";
                status.innerText = "✅ पंजीकरण जमा हो गया!";
                labourForm.reset();
            } catch (err) {
                status.style.display = "block";
                status.style.background = "#fee2e2";
                status.style.color = "#991b1b";
                status.innerText = "❌ त्रुटि! पुनः प्रयास करें।";
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
