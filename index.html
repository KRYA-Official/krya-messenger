<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRYA Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="top-bar">
      <input type="text" placeholder="प्रोडक्ट ढूंढें जैसे साड़ी, कुर्ती...">
      <div class="icons">
        <span>❤️</span>
        <span>🛒</span>
      </div>
    </div>
    <div class="location-bar">
      📍 डिलीवर किया जा रहा है - 813104
    </div>
  </header>

  <section class="categories">
    <div class="cat-item">👕<p>Summer</p></div>
    <div class="cat-item">🔥<p>Trending</p></div>
    <div class="cat-item">👍<p>Best Finds</p></div>
    <div class="cat-item">🛍️<p>Deals</p></div>
  </section>

  <div class="filter-bar">
    <button>क्रमबद्ध...</button>
    <button>Category</button>
    <button>Gender</button>
  </div>

  <main class="product-grid">
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Airpods">
      <div class="details">
        <p class="brand">YUVRAJ TREDING</p>
        <p class="price">₹217 <span class="discount">17% off</span></p>
        <p class="cod">₹263 with COD</p>
        <span class="rating">4⭐ (58,251)</span>
      </div>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Watch">
      <div class="details">
        <p class="brand">TORTOBBIT</p>
        <p class="price">₹283 <span class="discount">13% off</span></p>
        <p class="cod">₹324 with COD</p>
        <span class="rating">4⭐ (188)</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item">🏠<br>होम</div>
    <div class="nav-item">👗<br>कैटेगरी</div>
    <div class="nav-item">🏢<br>मॉल</div>
    <div class="nav-item">📦<br>मेरे ऑर्डर</div>
  </nav>

</body>
</html>
