<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA Messenger | Secure & Fast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        /* Auth UI */
        .auth-card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(251, 191, 36, 0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; background: var(--primary); color: #0f172a; }
        .hidden { display: none !important; }
        
        /* Chat UI */
        #app-main { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid #334155; border-right: 1px solid #334155; margin: 0 auto; }
        .header { height: 65px; background: var(--card); padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 4px; }
        .msg-them { align-self: flex-start; background: var(--card); color: #fff; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .msg-info { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; margin-bottom: 4px; opacity: 0.7; }
        .msg-time { font-size: 9px; opacity: 0.6; text-align: right; display: block; margin-top: 5px; }
        
        .footer { padding: 15px; background: var(--card); display: flex; gap: 10px; align-items: center; border-top: 1px solid #334155; }
        #msg-input { flex: 1; border-radius: 25px; padding: 12px 20px; margin: 0; }
        #btn-send { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Modals */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .scratch-box { background: white; padding: 20px; border-radius: 15px; text-align: center; color: #0f172a; width: 250px; }
    </style>
</head>
<body>

<div id="screen-auth" class="auth-card">
    <h2 style="color:var(--primary);">KRYA MESSENGER</h2>
    <p style="font-size: 13px; color: #94a3b8; margin: 10px 0;">100% Secure Passwordless Login</p>
    
    <div id="auth-send">
        <input type="email" id="user-email" placeholder="Enter your email address">
        <button class="btn" id="btn-login" onclick="sendMagicLink()">Send Login Link</button>
        <p id="auth-msg" style="font-size: 12px; margin-top: 10px; color: #fbbf24;"></p>
    </div>
</div>

<div id="screen-profile" class="auth-card hidden">
    <h2 style="color:var(--primary);">Create Profile</h2>
    <input type="text" id="user-handle" placeholder="Enter username (e.g. Mukesh)">
    <button class="btn" onclick="saveProfile()">Save & Continue</button>
</div>

<div id="app-main" class="hidden">
    <div class="header">
        <div style="color:var(--primary); font-size:1.4rem; font-weight:800;">KRYA Chat</div>
        <div>
            <i class="fas fa-gift" onclick="openReward()" style="color:var(--primary); margin-right:20px; cursor:pointer;"></i>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#ef4444; cursor:pointer;"></i>
        </div>
    </div>
    <div id="chat-flow"></div>
    <div class="footer">
        <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500">
        <button id="btn-send"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div id="reward-modal" class="overlay hidden">
    <div class="scratch-box">
        <h3>Daily Reward</h3>
        <p id="reward-amount" style="font-size: 24px; font-weight: bold; color: #16a34a; margin: 15px 0;">???</p>
        <button class="btn" onclick="claimReward()">Claim Now</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 👉 INSERT YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_DOMAIN.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userHandle = "Anonymous";
    let lastMsgTime = 0; // Anti-Spam Cooldown

    const badWords = ["badword1", "spam", "fake"]; // Profanity Filter Array

    // --- 1. SECURE AUTHENTICATION ---
    window.sendMagicLink = async () => {
        const email = document.getElementById('user-email').value.trim();
        const msg = document.getElementById('auth-msg');
        if(!email) return msg.innerText = "Please enter email.";

        const actionCodeSettings = {
            url: window.location.href, // Redirects back to this page
            handleCodeInApp: true
        };

        try {
            document.getElementById('btn-login').innerText = "Sending...";
            await sendSignInLinkToEmail(auth, email, actionCodeSettings);
            window.localStorage.setItem('emailForSignIn', email);
            msg.innerText = "Link sent! Check your email to login.";
            document.getElementById('btn-login').style.display = 'none';
        } catch (error) {
            msg.innerText = "Error: " + error.message;
        }
    };

    // Check if user clicked the magic link
    if (isSignInWithEmailLink(auth, window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn');
        if (!email) email = window.prompt('Please provide your email for confirmation');
        
        signInWithEmailLink(auth, email, window.location.href)
            .then((result) => {
                window.localStorage.removeItem('emailForSignIn');
                window.history.replaceState(null, null, window.location.pathname); // Clean URL
            })
            .catch((error) => alert("Login failed: " + error.message));
    }

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('screen-auth').classList.add('hidden');
            await checkProfile();
        } else {
            document.getElementById('screen-auth').classList.remove('hidden');
            document.getElementById('app-main').classList.add('hidden');
        }
    });

    window.logout = () => signOut(auth);

    // --- 2. USER PROFILE SYSTEM ---
    async function checkProfile() {
        const docRef = doc(db, "users", currentUser.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            userHandle = docSnap.data().handle;
            startChat();
        } else {
            document.getElementById('screen-profile').classList.remove('hidden');
        }
    }

    window.saveProfile = async () => {
        const handle = document.getElementById('user-handle').value.trim();
        if(!handle || handle.length < 3) return alert("Handle must be at least 3 characters.");
        
        await setDoc(doc(db, "users", currentUser.uid), {
            uid: currentUser.uid,
            email: currentUser.email,
            handle: handle,
            createdAt: serverTimestamp()
        });
        userHandle = handle;
        document.getElementById('screen-profile').classList.add('hidden');
        startChat();
    };

    // --- 3. SCALABLE CHAT SYSTEM ---
    function startChat() {
        document.getElementById('app-main').classList.remove('hidden');
        const flow = document.getElementById('chat-flow');
        
        // Load only last 50 messages from "general" room
        const q = query(collection(db, "rooms/general/messages"), orderBy("time", "desc"), limit(50));
        
        onSnapshot(q, (snapshot) => {
            let messages = [];
            snapshot.forEach(doc => messages.push({ id: doc.id, ...doc.data() }));
            messages.reverse(); // Show oldest at top, newest at bottom

            flow.innerHTML = "";
            messages.forEach(m => {
                const isMe = m.uid === currentUser.uid;
                const time = m.time ? new Date(m.time.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Sending...';
                
                const div = document.createElement('div');
                div.className = isMe ? 'msg msg-me' : 'msg msg-them';
                div.innerHTML = `
                    <div class="msg-info"><span>${isMe ? 'You' : m.user}</span></div>
                    <div>${m.text}</div>
                    <span class="msg-time">${time}</span>
                `;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        });
    }

    // --- 4. ANTI-SPAM SENDER ---
    const sendMsg = async () => {
        let txt = document.getElementById('msg-input').value.trim();
        
        // Anti-Spam: Empty or Toolong
        if(!txt || txt.length > 500) return;
        
        // Anti-Spam: Rate Limiting (1 message per 2 seconds)
        if (Date.now() - lastMsgTime < 2000) {
            return alert("You are typing too fast. Please wait.");
        }

        // Anti-Spam: Profanity Check
        const hasBadWords = badWords.some(word => txt.toLowerCase().includes(word));
        if (hasBadWords) return alert("Message blocked: Inappropriate language.");

        document.getElementById('msg-input').value = "";
        lastMsgTime = Date.now();

        try {
            await addDoc(collection(db, "rooms/general/messages"), { 
                text: txt, 
                user: userHandle, 
                uid: currentUser.uid, 
                time: serverTimestamp() 
            });
        } catch (e) { alert("Failed to send: " + e.message); }
    };

    document.getElementById('btn-send').onclick = sendMsg;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMsg(); };

    // --- 5. REAL REWARD LOGIC ---
    let rewardValue = 0;
    window.openReward = () => {
        // Generate random reward between 10 and 100
        rewardValue = Math.floor(Math.random() * 90) + 10;
        document.getElementById('reward-amount').innerText = `₹${rewardValue} Cashback`;
        document.getElementById('reward-modal').classList.remove('hidden');
    };

    window.claimReward = async () => {
        try {
            await addDoc(collection(db, "rewards"), {
                uid: currentUser.uid,
                amount: rewardValue,
                time: serverTimestamp()
            });
            alert("Reward saved to your database securely!");
            document.getElementById('reward-modal').classList.add('hidden');
        } catch(e) { alert("Error saving reward."); }
    };
</script>
</body>
</html>
