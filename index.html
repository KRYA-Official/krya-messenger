<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA - परफेक्ट फिट कार्ड</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 100px; }
        
        /* मुख्य कंटेनर जो कार्ड को स्क्रीन के बीच में रखेगा */
        .wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* कार्ड का बाहरी हिस्सा - यही कार्ड को स्क्रीन पर फिट करता है */
        .card-scaler {
            width: 95vw; /* मोबाइल स्क्रीन की 95% चौड़ाई */
            max-width: 500px; /* बड़े फोन पर 500px से बड़ा नहीं होगा */
            aspect-ratio: 1280 / 720; /* 16:9 अनुपात बनाए रखेगा */
            position: relative;
            overflow: visible;
        }

        /* असली कार्ड जो हमेशा 1280x720 रहेगा */
        .id-card { 
            width: 1280px; 
            height: 720px; 
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            /* यह जादुई लाइन कार्ड को मोबाइल स्क्रीन के हिसाब से सिकोड़ती है */
            transform: scale(calc(min(95vw, 500px) / 1280));
            border-radius: 40px; 
            padding: 60px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* डिज़ाइन थीम्स */
        .gold { border: 12px solid var(--primary); background: linear-gradient(135deg, #1a1a1a, #000); }
        .silver { border: 12px solid #cbd5e1; background: linear-gradient(135deg, #334155, #0f172a); }
        
        .verified-tag { position: absolute; top: 50px; right: 60px; font-size: 32px; font-weight: bold; }
        
        .btn-box { width: 90%; max-width: 400px; margin: 20px auto; }
        .btn { width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 15px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-save { background: var(--primary); color: #000; }
        .btn-share { background: #22c55e; color: #fff; }
        
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; padding: 25px; overflow-y: auto; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: white; font-size: 16px; }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #334155; z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 13px; cursor: pointer; }
        .active { color: var(--primary); }
    </style>
</head>
<body>

    <div style="padding: 20px; text-align: center;">
        <h1 style="color:var(--primary); letter-spacing: 2px;">KRYA</h1>
    </div>

    <div class="wrapper">
        <div class="card-scaler">
            <div id="final-card" class="id-card gold">
                <span id="badge-text" class="verified-tag" style="color:var(--primary);">VIP Member ⭐️</span>
                <h2 style="font-size:45px; margin-bottom:40px; border-bottom:3px solid var(--primary); display:inline-block; padding-bottom:10px;">KRYA सच्चाई कार्ड</h2>
                
                <div style="display:flex; gap:60px; align-items: center; margin-top:30px;">
                    <img id="disp-img" src="https://via.placeholder.com/300x380" style="width:300px; height:380px; border-radius:35px; border:8px solid var(--primary); object-fit:cover;">
                    <div style="font-size:35px; line-height:1.8;">
                        <div style="font-size:65px; font-weight:bold; color:var(--primary); margin-bottom:15px;" id="disp-name">KRYA</div>
                        <div><b>पेशा:</b> <span id="disp-skill">KRYA फाउंडर</span></div>
                        <div><b>पता:</b> <span id="disp-address">बांका, बिहार</span></div>
                    </div>
                </div>
                
                <div id="disp-id" style="margin-top:60px; padding-top:30px; border-top:4px dashed #334155; font-family:monospace; font-size:38px; color:#64748b; letter-spacing:2px;">
                    ID: KRYA-786-0001-2026
                </div>
            </div>
        </div>
    </div>

    <div class="btn-box">
        <button class="btn btn-save" onclick="openSettings()"><i class="fas fa-edit"></i> प्रोफाइल बदलें</button>
        <button class="btn btn-share" onclick="shareMe()"><i class="fab fa-whatsapp"></i> कार्ड शेयर करें</button>
    </div>

    <div id="settings-ui" class="overlay">
        <h2 style="color:var(--primary); margin-bottom:20px;">प्रोफाइल सेटअप</h2>
        <label>अपनी फोटो चुनें:</label>
        <input type="file" id="in-photo" accept="image/*" onchange="handleFile(event)">
        <input type="text" id="in-name" placeholder="आपका नाम">
        <input type="text" id="in-skill" placeholder="आपका पेशा">
        <input type="text" id="in-address" placeholder="आपका पता">
        <input type="tel" id="in-phone" placeholder="WhatsApp नंबर">
        
        <button class="btn btn-save" onclick="finalSave()">सेव करें</button>
        <button class="btn" style="background:#334155; color:white;" onclick="closeSettings()">वापस जाएं</button>
    </div>

    <div id="dev-ui" class="overlay">
        <h2 style="color:#22c55e; margin-bottom:20px;">डेवलपर मोड (VIP)</h2>
        <input type="text" id="dev-id" placeholder="नई ID नंबर">
        <p>बैज स्टाइल चुनें:</p>
        <div style="display:flex; gap:10px; margin:15px 0;">
            <button class="btn" onclick="setVIP('vip')" style="background:goldenrod;">VIP Gold</button>
            <button class="btn" onclick="setVIP('std')" style="background:green;">Verified</button>
        </div>
        <button class="btn btn-save" onclick="applyDev()">लागू करें</button>
        <button class="btn" style="background:#334155; color:white;" onclick="closeDev()">बंद करें</button>
    </div>

    <nav class="nav">
        <div class="nav-item active"><i class="fas fa-id-card"></i><br>कार्ड</div>
        <div class="nav-item" onclick="openSettings()"><i class="fas fa-user-cog"></i><br>एडिट</div>
        <div class="nav-item" onclick="checkDev()"><i class="fas fa-crown"></i><br>VIP</div>
    </nav>

<script>
    const S_ID = "service_gls676h";
    const T_ID = "template_6teuhi4";
    const P_K = "msEHMIMxmjBbBoqnn";

    let userData = JSON.parse(localStorage.getItem('krya_data')) || {
        name: "KRYA", skill: "KRYA फाउंडर", address: "बांका, बिहार", photo: "", id: "KRYA-786-0001-2026", badge: "vip"
    };

    function updateUI() {
        document.getElementById('disp-name').innerText = userData.name;
        document.getElementById('disp-skill').innerText = userData.skill;
        document.getElementById('disp-address').innerText = userData.address;
        document.getElementById('disp-id').innerText = "ID: " + userData.id;
        if(userData.photo) document.getElementById('disp-img').src = userData.photo;
        
        const b = document.getElementById('badge-text');
        if(userData.badge === 'vip') {
            b.innerText = "VIP Member ⭐️"; b.style.color = "#fbbf24";
        } else {
            b.innerText = "Verified ✅"; b.style.color = "#22c55e";
        }
    }

    function openSettings() { document.getElementById('settings-ui').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-ui').style.display = 'none'; }
    
    function handleFile(e) {
        const reader = new FileReader();
        reader.onload = () => { userData.photo = reader.result; updateUI(); };
        reader.readAsDataURL(e.target.files[0]);
    }

    function finalSave() {
        userData.name = document.getElementById('in-name').value || userData.name;
        userData.skill = document.getElementById('in-skill').value || userData.skill;
        userData.address = document.getElementById('in-address').value || userData.address;
        localStorage.setItem('krya_data', JSON.stringify(userData));
        emailjs.send(S_ID, T_ID, { from_name: userData.name, user_mobile: document.getElementById('in-phone').value }, P_K);
        closeSettings();
    }

    function checkDev() {
        if(prompt("VIP पासवर्ड:") === "KRYA2026") document.getElementById('dev-ui').style.display = 'flex';
    }
    function closeDev() { document.getElementById('dev-ui').style.display = 'none'; }
    function setVIP(t) { userData.badge = t; }
    function applyDev() {
        userData.id = document.getElementById('dev-id').value || userData.id;
        localStorage.setItem('krya_data', JSON.stringify(userData));
        updateUI(); closeDev();
    }

    async function shareMe() {
        const card = document.getElementById('final-card');
        const oldTransform = card.style.transform;
        
        // कैप्चर के समय स्केल को हटाना ताकि फोटो 1280px की ही आए
        card.style.transform = "none";
        
        const canvas = await html2canvas(card, { width: 1280, height: 720, scale: 1, useCORS: true });
        
        card.style.transform = oldTransform; // वापस छोटा कर दें

        canvas.toBlob(blob => {
            const file = new File([blob], 'KRYA_Card.png', {type: 'image/png'});
            if(navigator.share) navigator.share({files: [file], title: 'KRYA सच्चाई कार्ड'});
        });
    }

    updateUI();
</script>
</body>
</html>
