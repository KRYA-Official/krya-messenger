<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYA Store V2</title>

<style>
body{
margin:0;
font-family:Poppins, sans-serif;
background:#f5f5f5;
}

/* HEADER */
.header{
background:#fff;
padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
position:sticky;
top:0;
z-index:10;
}
.top-bar{
display:flex;
gap:10px;
}
.top-bar input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}
.icons span{
font-size:22px;
margin-left:10px;
cursor:pointer;
}

/* CATEGORY */
.categories{
display:flex;
overflow:auto;
padding:10px;
gap:10px;
background:#fff;
}
.cat-item{
min-width:80px;
text-align:center;
padding:5px;
border-radius:8px;
cursor:pointer;
}
.cat-item.active{
background:#ff9800;
color:#fff;
}

/* GRID */
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
padding:10px;
}
.product-card{
background:#fff;
border-radius:10px;
padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.product-card img{
width:100%;
border-radius:8px;
}
.price{color:green;font-weight:bold}

/* BUTTON */
.btn{
margin-top:5px;
padding:8px;
border:none;
border-radius:5px;
background:#ff9800;
color:#fff;
width:100%;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
top:0;
right:-100%;
width:300px;
height:100%;
background:#fff;
transition:0.3s;
overflow:auto;
padding:10px;
z-index:20;
}
.cart.active{right:0}

.cart-item{
border-bottom:1px solid #ddd;
padding:5px 0;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-around;
padding:8px;
box-shadow:0 -2px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header class="header">
<div class="top-bar">
<input type="text" id="search" placeholder="Search products...">
<div class="icons">
<span onclick="toggleCart()">🛒 (<span id="cartCount">0</span>)</span>
</div>
</div>
</header>

<section class="categories">
<div class="cat-item active" onclick="filterCat('all',this)">All</div>
<div class="cat-item" onclick="filterCat('clothes',this)">👕 Clothes</div>
<div class="cat-item" onclick="filterCat('watch',this)">⌚ Watch</div>
</section>

<main class="product-grid" id="products"></main>

<!-- CART -->
<div class="cart" id="cart">
<h3>🛒 Cart</h3>
<div id="cartItems"></div>
<h4 id="total">Total: ₹0</h4>
<button class="btn" onclick="checkout()">Checkout</button>
</div>

<nav class="bottom-nav">
<div>🏠 Home</div>
<div>📦 Orders</div>
</nav>

<script>

let products=[
{name:"Airpods",price:217,cat:"watch",img:"https://via.placeholder.com/150"},
{name:"Watch",price:283,cat:"watch",img:"https://via.placeholder.com/150"},
{name:"T-shirt",price:199,cat:"clothes",img:"https://via.placeholder.com/150"},
{name:"Shoes",price:499,cat:"clothes",img:"https://via.placeholder.com/150"}
];

let cart=JSON.parse(localStorage.getItem("cart")) || [];

// Render products
function render(list){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="product-card">
<img src="${p.img}">
<p>${p.name}</p>
<p class="price">₹${p.price}</p>
<button class="btn" onclick="addToCart(${i})">Add</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}
render(products);

// Search
document.getElementById("search").oninput=function(){
let val=this.value.toLowerCase();
let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
render(filtered);
}

// Category filter
function filterCat(cat,el){
document.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("active"));
el.classList.add("active");

if(cat==="all"){
render(products);
}else{
render(products.filter(p=>p.cat===cat));
}
}

// Add to cart
function addToCart(i){
cart.push(products[i]);
updateCart();
}

// Update cart
function updateCart(){
let html="";
let total=0;

cart.forEach((p,index)=>{
html+=`
<div class="cart-item">
${p.name} - ₹${p.price}
<button onclick="removeItem(${index})">❌</button>
</div>`;
total+=p.price;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="Total: ₹"+total;
document.getElementById("cartCount").innerText=cart.length;

localStorage.setItem("cart",JSON.stringify(cart));
}
updateCart();

// Remove item
function removeItem(i){
cart.splice(i,1);
updateCart();
}

// Toggle cart
function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

// Checkout
function checkout(){
alert("Payment system next version में आएगा 😎");
}

</script>

</body>
</html>
