<section id="view-owner" class="view">
    <div class="stat-grid">
        <div class="stat-card"><i class="fas fa-shopping-cart"></i><h2 id="total-ord">0</h2><p>ऑर्डर्स</p></div>
        <div class="stat-card"><i class="fas fa-boxes"></i><h2 id="total-services">0</h2><p>कुल सर्विस</p></div>
        <div class="stat-card"><i class="fas fa-users"></i><h2 id="total-subs">0</h2><p>सब्सक्राइबर्स</p></div>
        <div class="stat-card" style="grid-column: span 3;"><i class="fas fa-wallet"></i><h2 id="total-rev">₹0</h2><p>कुल राजस्व</p></div>
    </div>
    
    <div class="card">
        <h3>नया सर्विस पब्लिश करें</h3>
        <p style="font-size: 10px; color: gray;">सिस्टम ऑटोमैटिक कोड जेनरेट करेगा।</p>
        <input type="text" id="s-name" placeholder="सर्विस का नाम">
        <input type="number" id="s-mrp" placeholder="MRP">
        <input type="number" id="s-price" placeholder="अमाउंट">
        <input type="text" id="s-img" placeholder="फोटो लिंक">
        <button class="btn btn-primary" id="btn-publish"><i class="fas fa-plus"></i> पब्लिश करें</button>
    </div>

    <h3>मैनेज प्रोडक्ट्स & कोड्स</h3>
    <div id="admin-product-list"></div>
</section>

<script type="module">
    // ... (पुराना Firebase Initialize कोड)

    // --- सर्विस पब्लिश करने का नया तरीका (विद ऑटो कोड) ---
    document.getElementById('btn-publish').onclick = async () => {
        const name = document.getElementById('s-name').value;
        const price = document.getElementById('s-price').value;
        const mrp = document.getElementById('s-mrp').value;
        const img = document.getElementById('s-img').value;

        if(!name || !price) return showToast("विवरण भरें", "var(--red)");

        try {
            // ऑटोमैटिक यूनिक सर्विस कोड जेनरेट करना (जैसे KRYA-S-1234)
            const serviceCode = "KRYA-S-" + Math.floor(1000 + Math.random() * 9000);

            await addDoc(collection(db, "services"), {
                name, mrp, price, img, 
                serviceCode: serviceCode, // यहाँ कोड जुड़ गया
                createdAt: serverTimestamp()
            });

            showToast("सफलता! कोड: " + serviceCode, "var(--primary)");
            document.querySelectorAll('input').forEach(i => i.value="");
        } catch (e) { showToast(e.message, "var(--red)"); }
    };

    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-list');
            const adminList = document.getElementById('admin-product-list');
            
            // काउंटर अपडेट: कुल कितनी सर्विस हैं
            document.getElementById('total-services').innerText = snap.size;

            list.innerHTML = ""; if(isOwner) adminList.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                // यूजर को कोड भी दिखेगा
                list.innerHTML += `
                    <div class="service-item">
                        <img src="${s.img}" class="service-img">
                        <div style="padding: 20px;">
                            <small style="color:gray; font-weight:800;">${s.serviceCode}</small>
                            <h4 style="font-weight: 800;">${s.name}</h4>
                            <div style="margin: 10px 0; display:flex; align-items:baseline; gap:8px;">
                                <span style="font-size: 24px; font-weight: 800; color: var(--primary);">₹${s.price}</span>
                            </div>
                            <button class="btn btn-primary" onclick="buyNow('${s.name}', '${s.price}', '${s.serviceCode}')">अभी खरीदें</button>
                        </div>
                    </div>`;
                
                if(isOwner) {
                    adminList.innerHTML += `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:10px;">
                            <div>
                                <small style="display:block; color:var(--accent); font-weight:800;">${s.serviceCode}</small>
                                <span>${s.name}</span>
                            </div>
                            <button class="btn btn-del" onclick="deleteProduct('${d.id}')">हटाएं</button>
                        </div>`;
                }
            });
        });
    }

    // --- ऑर्डर करते समय भी कोड साथ जाएगा ---
    window.buyNow = async (sName, sPrice, sCode) => {
        const orderID = "ORD-" + Math.floor(1000 + Math.random() * 9000);
        await addDoc(collection(db, "orders"), {
            orderID, serviceCode: sCode, userName: user.displayName, 
            userEmail: user.email, serviceName: sName,
            amount: sPrice, status: "Pending", createdAt: serverTimestamp()
        });
        // व्हाट्सएप पर भी कोड जाएगा
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=नमस्ते!%0Aऑर्डर आईडी: ${orderID}%0Aसर्विस कोड: ${sCode}%0Aनाम: ${sName}`, '_blank');
        showToast("ऑर्डर सफल! कोड नोट करें: " + sCode);
    };

    function loadAdminStats() {
        onSnapshot(collection(db, "orders"), snap => {
            document.getElementById('total-ord').innerText = snap.size;
            let rev = 0; snap.forEach(d => { if(d.data().status === 'Approved') rev += Number(d.data().amount); });
            document.getElementById('total-rev').innerText = "₹" + rev;
        });
        onSnapshot(collection(db, "subscribers"), snap => document.getElementById('total-subs').innerText = snap.size);
    }
        </script>
