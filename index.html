<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA LIVE | Walkie-Talkie</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #fbbf24; --live: #ef4444; --bg: #0b1120; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; align-items: center; }
        .header { background: var(--card); width: 100%; padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
        .status-ring { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #334155; display: flex; justify-content: center; align-items: center; margin: 30px 0; }
        .is-active { border-color: var(--live); box-shadow: 0 0 20px var(--live); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .controls { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 15px; border-radius: 10px; border: none; background: #334155; color: white; font-size: 16px; text-align: center; }
        button { padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-live { background: var(--primary); color: black; }
        .btn-call { background: #10b981; color: white; }
    </style>
</head>
<body>
    <div class="header"><h1>KRYA LIVE</h1><p id="my-id">ID लोड हो रही है...</p></div>
    <div class="status-ring" id="ring"><i class="fas fa-microphone" style="font-size: 50px;"></i></div>
    <div class="controls">
        <input type="text" id="remote-id" placeholder="दूसरे फोन की ID यहाँ डालें">
        <button class="btn-call" onclick="startCall()">📞 दूसरे से जुड़ें (Connect)</button>
        <button class="btn-live" onclick="window.location.reload()">🔄 रिफ्रेश/स्टॉप</button>
    </div>
    <div style="margin-top: 20px; font-size: 12px; color: #64748b;">मुकेश राय (बांका) की विशेष पहल</div>

    <script>
        const myIdDisplay = document.getElementById('my-id');
        const ring = document.getElementById('ring');
        let peer = new Peer(); 

        // 1. अपनी ID जनरेट करना
        peer.on('open', (id) => { myIdDisplay.innerText = "आपकी ID: " + id; });

        // 2. जब कोई दूसरा आपको कॉल करे (आवाज़ आए)
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                call.answer(stream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                    ring.classList.add('is-active');
                });
            });
        });

        // 3. दूसरे फोन से जुड़ना (आवाज़ भेजना)
        function startCall() {
            const remoteId = document.getElementById('remote-id').value;
            if (!remoteId) return alert("कृपया ID डालें");
            
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                const call = peer.call(remoteId, stream);
                ring.classList.add('is-active');
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            }).catch(err => alert("माइक की अनुमति दें!"));
        }
    </script>
</body>
</html>
