<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA - दुनिया की एक पहचान</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --krya-gold: #d4af37; --krya-bg: #0b1426; --krya-card: #ffffff; --krya-text: #0b1426; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--krya-bg); color: white; overflow: hidden; height: 100vh; display: flex; justify-content: center; }

        .app-container { width: 100%; max-width: 450px; background: var(--krya-bg); display: flex; flex-direction: column; position: relative; }

        /* Header */
        .header { padding: 30px 20px 15px; text-align: center; }
        .header h1 { color: var(--krya-gold); font-size: 28px; letter-spacing: 2px; }
        .header p { color: var(--krya-gold); font-size: 12px; opacity: 0.7; }

        /* Tabs */
        .tabs { display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 10px 0; border-radius: 15px; margin: 0 15px 15px; }
        .tab-btn { color: white; opacity: 0.5; cursor: pointer; border: none; background: none; font-size: 14px; }
        .tab-btn.active { opacity: 1; color: var(--krya-gold); font-weight: bold; }

        /* Main Content Area */
        .main-content { flex: 1; background: var(--krya-card); border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 15px; overflow-y: auto; color: var(--krya-text); }
        
        /* Chat Layouts */
        .chat-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; gap: 12px; cursor: pointer; transition: 0.2s; }
        .chat-item:hover { background: #f9f9f9; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--krya-bg); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .chat-info { flex: 1; }
        .chat-info h4 { font-size: 15px; }
        .chat-info p { font-size: 11px; color: #777; }

        /* Chat Overlay */
        .chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--krya-bg); z-index: 1000; display: none; flex-direction: column; }
        .chat-header { padding: 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 15px; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg-in { background: #1e293b; color: white; align-self: flex-start; }
        .msg-out { background: var(--krya-gold); color: black; align-self: flex-end; }

        .chat-input-area { padding: 15px; display: flex; gap: 10px; background: rgba(255,255,255,0.05); }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        
        /* FAB */
        .fab { position: absolute; bottom: 85px; right: 20px; width: 55px; height: 55px; background: var(--krya-bg); border: 2px solid var(--krya-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--krya-gold); font-size: 20px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        /* Navigation */
        .nav { height: 70px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #aaa; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item.active { color: var(--krya-bg); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>KRYA</h1>
        <p>दुनिया की एक पहचान</p>
    </div>

    <div class="tabs">
        <div class="tab-btn active" id="tab-global" onclick="switchView('global')">Global Feed</div>
        <div class="tab-btn" id="tab-private" onclick="switchView('private')">Private Chat</div>
    </div>

    <div class="main-content" id="list-area">
        </div>

    <div class="fab" onclick="openChat('global', 'Global Broadcast')"><i class="fas fa-broadcast-tower"></i></div>

    <div class="nav">
        <div class="nav-item active"><i class="fas fa-home"></i>Home</div>
        <div class="nav-item"><i class="fas fa-file-invoice"></i>Registry</div>
        <div class="nav-item"><i class="fas fa-shield-alt"></i>Security</div>
        <div class="nav-item"><i class="fas fa-user"></i>Account</div>
    </div>
</div>

<div id="chat-window" class="chat-window">
    <div class="chat-header">
        <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer"></i>
        <h3 id="chat-title" style="color:var(--krya-gold)"></h3>
    </div>
    <div class="messages" id="message-flow"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="संदेश लिखें...">
        <button id="send-btn" style="background:var(--krya-gold); border:none; width:45px; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBC5iztNy0P-4-vY6Djec5ff26mTtJk30",
      authDomain: "sample-firebase-ai-app-37d2b.firebaseapp.com",
      projectId: "sample-firebase-ai-app-37d2b",
      storageBucket: "sample-firebase-ai-app-37d2b.firebasestorage.app",
      messagingSenderId: "652996597348",
      appId: "1:652996597348:web:6bfed4775ccb1c9572b171"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentMode = 'global'; 
    let myHandle = "@Mukesh_KRYA"; // इसे लॉगिन से बदला जा सकता है

    // --- Views Logic ---
    window.switchView = (mode) => {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        renderList();
    };

    function renderList() {
        const area = document.getElementById('list-area');
        area.innerHTML = "";
        if(currentMode === 'global') {
            area.innerHTML = `<div class="chat-item" onclick="openChat('global', 'Global Feed')">
                <div class="avatar" style="background:var(--krya-gold)">G</div>
                <div class="chat-info"><h4>Global Broadcast</h4><p>पूरी दुनिया के लिए संदेश...</p></div>
            </div>`;
        } else {
            // यहाँ आप अपने संपर्कों (Contacts) की लिस्ट दिखा सकते हैं
            area.innerHTML = `<div class="chat-item" onclick="openChat('private', '@Pramod')">
                <div class="avatar">P</div>
                <div class="chat-info"><h4>@Pramod <i class="fas fa-check-circle" style="color:#1da1f2"></i></h4><p>प्राइवेट संदेश भेजने के लिए क्लिक करें</p></div>
            </div>`;
        }
    }

    // --- Chat Logic ---
    let chatListener = null;

    window.openChat = (type, title) => {
        document.getElementById('chat-window').style.display = 'flex';
        document.getElementById('chat-title').innerText = title;
        loadMessages(type, title);
    };

    window.closeChat = () => {
        document.getElementById('chat-window').style.display = 'none';
        if(chatListener) chatListener(); // स्टॉप लिसनर
    };

    async function loadMessages(type, title) {
        const flow = document.getElementById('message-flow');
        const colName = type === 'global' ? "global_messages" : "private_messages";
        
        const q = query(collection(db, colName), orderBy("time", "asc"));
        
        chatListener = onSnapshot(q, snap => {
            flow.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const isMe = m.user === myHandle;
                flow.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-out' : 'msg-in'}">
                    <small style="display:block; font-size:9px; opacity:0.6">${m.user}</small>
                    ${m.text}
                </div>`;
            });
            flow.scrollTop = flow.scrollHeight;
        });

        document.getElementById('send-btn').onclick = async () => {
            const txt = document.getElementById('chat-input').value.trim();
            if(!txt) return;
            document.getElementById('chat-input').value = "";
            await addDoc(collection(db, colName), {
                text: txt,
                user: myHandle,
                to: type === 'global' ? 'all' : title,
                time: serverTimestamp()
            });
        };
    }

    // Initial Load
    renderList();

</script>
</body>
</html>
