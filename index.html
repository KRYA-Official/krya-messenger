<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYA Referral System</title>

<style>
body{font-family:sans-serif;background:#0b1120;color:#fff;text-align:center}
.box{background:#1e293b;padding:20px;margin:15px auto;border-radius:10px;max-width:400px}
button{padding:10px;margin:5px;border:none;border-radius:5px;background:#fbbf24;color:#000}
input{padding:10px;border-radius:5px;border:none;width:90%}
.hidden{display:none}
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>KRYA Referral</h2>
<input type="email" id="email" placeholder="Email डालें"><br>
<input type="text" id="refInput" placeholder="Referral Code (optional)">
<button onclick="login()">Login</button>
</div>

<div id="appBox" class="hidden">

<div class="box">
<h3>💰 Wallet</h3>
<p>Coins: <span id="coins">0</span></p>
</div>

<div class="box">
<h3>👥 Referral System</h3>
<p>Your Code: <b id="myCode"></b></p>
<button onclick="copyLink()">Copy Referral Link</button>
<p style="font-size:12px">Share करके 20 Coins कमाओ</p>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, query, where, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 Firebase Config
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userId="";
let myCode="";

// 🔐 LOGIN
window.login = async function(){

let email = document.getElementById("email").value;
let refCode = document.getElementById("refInput").value;

if(!email.includes("@")) return alert("सही ईमेल डालें");

userId = btoa(email);

// 🔥 unique referral code generate
myCode = userId.slice(0,6);

const ref = doc(db,"users",userId);
const snap = await getDoc(ref);

if(!snap.exists()){

await setDoc(ref,{
email,
coins:50,
refCode: myCode,
referredBy: refCode || ""
});

// 🎁 referral reward
if(refCode){
const q = query(collection(db,"users"), where("refCode","==",refCode));
const qs = await getDocs(q);

qs.forEach(async (d)=>{
await updateDoc(doc(db,"users",d.id),{
coins: d.data().coins + 20
});
});
}

}

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("appBox").classList.remove("hidden");

document.getElementById("myCode").innerText = myCode;

loadWallet();
}

// LOAD WALLET
async function loadWallet(){
const snap = await getDoc(doc(db,"users",userId));
document.getElementById("coins").innerText = snap.data().coins;
}

// COPY LINK
window.copyLink = function(){

let link = window.location.href + "?ref=" + myCode;

navigator.clipboard.writeText(link);

alert("Referral link copy हो गया!");
}

</script>

</body>
</html>
