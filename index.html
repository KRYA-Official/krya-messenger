<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA - डिजिटल मॉल</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #fbbf24; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --coin: #ffd700; --danger: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 80px; }
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .id-card { border: 2px solid var(--primary); background: linear-gradient(135deg, #1e293b, #000); margin: 15px; padding: 15px; border-radius: 15px; }
        .btn-voice { background: #3b82f6; border: none; border-radius: 50%; width: 60px; height: 60px; color: white; font-size: 24px; display: block; margin: 10px auto; cursor: pointer; }
        .overlay { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; padding: 20px; z-index: 200; overflow-y: auto; }
        .mall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: var(--card); border-radius: 12px; padding: 10px; border: 1px solid #334155; position: relative; }
        .product-card img { width: 100%; height: 120px; border-radius: 8px; object-fit: cover; }
        .tag { position: absolute; top: 5px; right: 5px; background: var(--danger); font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1a202c; border: 1px solid #334155; border-radius: 8px; color: white; }
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; }
    </style>
</head>
<body>

<div class="header">
    <b style="color:var(--primary)">KRYA PRO</b>
    <div style="color:var(--coin)">🪙 <span id="balance">700</span></div>
</div>

<div class="id-card">
    <div style="display:flex; gap:15px;">
        <img id="u-img" src="https://via.placeholder.com/80" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--primary);">
        <div>
            <b id="u-name">लोड हो रहा है...</b><br>
            <small id="u-skill">डिजिटल विशेषज्ञ</small><br>
            <small id="u-loc">बांका, बिहार</small>
        </div>
    </div>
</div>

<button class="btn-voice" onclick="startKryaAI()"><i class="fas fa-microphone"></i></button>
<p id="ai-msg" style="text-align:center; color:var(--primary); font-size:12px;">KRYA AI से कुछ भी पूछें</p>

<button onclick="openMall()" style="width:90%; margin:10px 5%; padding:15px; background:#8b5cf6; color:white; border:none; border-radius:10px; font-weight:bold;">KRYA डिजिटल मॉल</button>

<div id="mall-box" class="overlay">
    <h2>KRYA डिजिटल मॉल</h2>
    <button onclick="openAdd()" style="background:var(--primary); padding:10px; border:none; border-radius:5px; margin:10px 0;">+ 3D लोगो/AI इमेज लिस्ट करें</button>
    <div class="mall-grid" id="m-list"></div>
    <button onclick="closeMall()" style="color:var(--danger); margin-top:20px;">वापस जाएं</button>
</div>

<div id="add-box" class="overlay">
    <h3>नया डिजिटल प्रोडक्ट</h3>
    <input type="file" id="p-file">
    <input type="text" id="p-title" placeholder="नाम (उदा: 3D Professional Logo)">
    <input type="number" id="p-mrp" placeholder="MRP (असली कीमत)">
    <input type="number" id="p-off" placeholder="डिस्काउंट %">
    <button onclick="saveProduct()" style="background:var(--primary); padding:15px; border:none; border-radius:8px;">Live Public करें</button>
    <button onclick="closeAdd()" style="margin-top:10px;">रद्द करें</button>
</div>

<nav class="nav">
    <div onclick="location.reload()"><i class="fas fa-home"></i></div>
    <div onclick="openMall()"><i class="fas fa-store"></i></div>
    <div onclick="alert('सेटिंग्स जल्द आ रही हैं')"><i class="fas fa-cog"></i></div>
</nav>

<script>
    let db = JSON.parse(localStorage.getItem('krya_pro')) || { name: "मुकेश राय", skill: "टेक स्पेशलिस्ट", loc: "बांका", photo: "", items: [] };
    const api = "AIzaSyD8uts-FMY4A9emoiGvo1l2XnQmiCE_s30"; //

    function sync() {
        document.getElementById('u-name').innerText = db.name;
        document.getElementById('u-skill').innerText = db.skill;
        document.getElementById('u-loc').innerText = "L: " + db.loc;
        if(db.photo) document.getElementById('u-img').src = db.photo;
        
        const list = document.getElementById('m-list');
        list.innerHTML = db.items.map(i => `
            <div class="product-card">
                <img src="${i.img}">
                ${i.off > 0 ? `<div class="tag">-${i.off}%</div>` : ''}
                <p><b>${i.title}</b></p>
                <p style="font-size:10px; text-decoration:line-through; color:#666;">MRP: 🪙${i.mrp}</p>
                <p style="color:var(--coin)">🪙${i.price}</p>
                <button style="width:100%; background:var(--primary); border:none; padding:5px; border-radius:4px; font-weight:bold; cursor:pointer;">Buy</button>
            </div>
        `).join('');
        localStorage.setItem('krya_pro', JSON.stringify(db));
    }

    async function startKryaAI() {
        const msg = document.getElementById('ai-msg');
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'hi-IN';
        rec.onstart = () => msg.innerText = "KRYA सुन रहा है...";
        rec.onresult = async (e) => {
            const q = e.results[0][0].transcript;
            msg.innerText = "आपने कहा: " + q;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${api}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "तुम KRYA के डिजिटल एसेट एक्सपर्ट हो। हिंदी में छोटा जवाब दो: " + q }] }] })
                });
                const d = await res.json();
                const txt = d.candidates[0].content.parts[0].text;
                msg.innerText = txt;
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
            } catch { msg.innerText = "AI कनेक्ट नहीं हुआ।"; }
        };
        rec.start();
    }

    function saveProduct() {
        const title = document.getElementById('p-title').value;
        const mrp = parseFloat(document.getElementById('p-mrp').value);
        const off = parseFloat(document.getElementById('p-off').value) || 0;
        const file = document.getElementById('p-file').files[0];

        if(title && mrp && file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const finalPrice = Math.round(mrp - (mrp * (off/100)));
                db.items.push({ title, mrp, off, price: finalPrice, img: e.target.result });
                sync(); closeAdd(); alert("डिजिटल प्रोडक्ट लाइव हो गया!");
            };
            reader.readAsDataURL(file);
        } else { alert("पूरी जानकारी भरें!"); }
    }

    function openMall() { document.getElementById('mall-box').style.display = 'flex'; }
    function closeMall() { document.getElementById('mall-box').style.display = 'none'; }
    function openAdd() { document.getElementById('add-box').style.display = 'flex'; }
    function closeAdd() { document.getElementById('add-box').style.display = 'none'; }

    sync();
</script>
</body>
</html>
