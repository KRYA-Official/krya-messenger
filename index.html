<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYAlife.com</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#eef2f3;
}

/* Header */
header {
  background:#0a7f5a;
  color:white;
  text-align:center;
  padding:15px;
}

/* 🔥 Slider FIXED */
.slider {
  width:100%;
  height:160px;
  overflow:hidden;
  border-radius:10px;
  margin:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.slides {
  display:flex;
  width:300%;
  animation:slide 9s infinite;
}

.slides img {
  width:100%;
  height:160px;
  object-fit:cover;
}

/* Animation */
@keyframes slide {
  0% {transform:translateX(0);}
  30% {transform:translateX(0);}
  33% {transform:translateX(-100%);}
  63% {transform:translateX(-100%);}
  66% {transform:translateX(-200%);}
  96% {transform:translateX(-200%);}
  100% {transform:translateX(0);}
}

/* Container */
.container {
  padding:15px;
}

/* Cards */
.card {
  background:white;
  margin:10px 0;
  padding:15px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* Buttons */
button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:#0a7f5a;
  color:white;
  font-size:16px;
  margin-top:8px;
  cursor:pointer;
}

button:hover {
  opacity:0.9;
}

.whatsapp {
  background:#25D366;
}

.formbtn {
  background:#007bff;
}

/* Reviews */
.review {
  background:#fff;
  padding:10px;
  margin:5px 0;
  border-left:4px solid #0a7f5a;
}

/* Responsive */
@media(max-width:600px){
  .slider {
    height:140px;
  }
  .slides img {
    height:140px;
  }
}
</style>
</head>

<body>

<header>
<h2>🔥 KRYAlife.com</h2>
<p>Digital Services & Online Help</p>
</header>

<!-- 🔥 Slider -->
<div class="slider">
  <div class="slides">
    <img src="https://via.placeholder.com/800x150/ff5733/ffffff?text=Logo+Offer">
    <img src="https://via.placeholder.com/800x150/007bff/ffffff?text=Promotion+Offer">
    <img src="https://via.placeholder.com/800x150/28a745/ffffff?text=Website+Offer">
  </div>
</div>

<div class="container">

<!-- Services -->
<div class="card">
<h3>🎨 Logo Design</h3>
<p>₹49 - Limited Offer</p>
<button onclick="order()">Order on WhatsApp</button>
<button class="formbtn" onclick="form()">Fill Order Form</button>
</div>

<div class="card">
<h3>📢 WhatsApp Promotion</h3>
<p>₹49</p>
<button onclick="order()">Order on WhatsApp</button>
<button class="formbtn" onclick="form()">Fill Order Form</button>
</div>

<div class="card">
<h3>🌐 Website Design</h3>
<p>₹299</p>
<button onclick="order()">Order on WhatsApp</button>
<button class="formbtn" onclick="form()">Fill Order Form</button>
</div>

<!-- Payment -->
<div class="card">
<h3>💰 Payment</h3>
<p>UPI: yourupi@bank</p>
<p>Payment के बाद Screenshot WhatsApp पर भेजें</p>
</div>

<!-- Reviews -->
<div class="card">
<h3>⭐ Customer Reviews</h3>
<div class="review">"बहुत बढ़िया Logo मिला!"</div>
<div class="review">"Fast service 👍"</div>
<div class="review">"Low price best work"</div>
</div>

<!-- Contact -->
<div class="card">
<button class="whatsapp" onclick="contact()">📲 WhatsApp Support</button>
</div>

</div>

<script>
function order(){
  window.location.href="https://wa.me/916379403821";
}

function contact(){
  window.location.href="https://wa.me/916379403821";
}

function form(){
  window.location.href="YOUR_GOOGLE_FORM_LINK";
}
</script>

</body>
</html>
