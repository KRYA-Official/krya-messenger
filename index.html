<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYALIVE | Smart Service Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #10b981; --accent: #2563eb; --dark: #0f172a; --light: #f8fafc; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--dark); overflow-x: hidden; width: 100%; height: 100vh; }
        
        /* Navigation & Header */
        header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 22px; font-weight: 800; color: var(--dark); }
        .brand span { color: var(--primary); }
        
        main { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }

        /* Auth Screen */
        #auth-screen { height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .auth-card { background: #fff; padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }

        /* Store UI (User Mode) */
        .card { background: #fff; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 20px; overflow: hidden; border: 1px solid #f1f5f9; position: relative; }
        .service-img { width: 100%; height: 160px; object-fit: cover; }
        .pricing { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .selling-price { font-size: 20px; font-weight: 800; color: var(--primary); }
        .mrp { text-decoration: line-through; color: #94a3b8; font-size: 14px; }

        /* Admin UI (Owner Mode) */
        .admin-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 20px; border-radius: 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        .admin-form input, .admin-form textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; outline: none; }

        /* Buttons */
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-google { background: white; color: #444; border: 1.5px solid #e2e8f0; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--primary); color: white; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #eee; padding: 12px 0 25px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header id="app-header" style="display: none;">
    <div class="brand">KRYA<span>LIVE</span></div>
    <div id="role-badge" style="font-size: 10px; font-weight: 800; color: white; background: var(--primary); padding: 3px 10px; border-radius: 20px;">USER</div>
</header>

<main>
    <section id="view-auth" class="view active">
        <div id="auth-screen">
            <div class="auth-card">
                <div style="background: var(--light); width: 60px; height: 60px; border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-fingerprint fa-2x" style="color: var(--accent);"></i>
                </div>
                <h2 style="font-weight: 800;">प्रवेश करें</h2>
                <p style="font-size: 13px; color: gray; margin: 10px 0 30px;">KRYALIVE डिजिटल स्टोर में आपका स्वागत है।</p>
                <button class="btn btn-google" id="login-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google से लॉगिन
                </button>
            </div>
        </div>
    </section>

    <section id="view-owner" class="view">
        <div class="admin-stat-grid">
            <div class="stat-box"><h2 id="adm-orders">0</h2><p>कुल ऑर्डर</p></div>
            <div class="stat-box"><h2 id="adm-rev">₹0</h2><p>कुल कमाई</p></div>
        </div>
        <div class="card" style="padding: 20px;">
            <h3>नई सर्विस जोड़ें</h3>
            <div class="admin-form" style="margin-top: 15px;">
                <input type="text" id="svc-name" placeholder="सर्विस का नाम">
                <input type="number" id="svc-price" placeholder="बेचने वाली कीमत">
                <input type="text" id="svc-img" placeholder="फोटो लिंक (URL)">
                <button class="btn btn-success" onclick="addNewService()">स्टोर में लाइव करें</button>
            </div>
        </div>
        <h3>हाल के ऑर्डर</h3>
        <div id="admin-orders-list" style="margin-top: 15px;"></div>
    </section>

    <section id="view-store" class="view">
        <div style="margin-bottom: 20px;">
            <h3 id="user-greet">नमस्ते!</h3>
            <p style="font-size: 12px; color: gray;">आज के खास डिजिटल ऑफर्स यहाँ हैं।</p>
        </div>
        <div id="store-services">
            </div>
    </section>

    <section id="view-profile" class="view">
        <div class="auth-card" style="margin: 0 auto;">
            <img id="u-img" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 10px;">
            <h4 id="u-name">User Name</h4>
            <p id="u-email" style="font-size: 12px; color: gray; margin-bottom: 30px;">email@example.com</p>
            <button class="btn" style="background: #fee2e2; color: #ef4444;" onclick="logout()">लॉगआउट</button>
        </div>
    </section>
</main>

<nav class="bottom-nav" id="app-nav" style="display: none;">
    <button class="nav-item active" id="n-main" onclick="openMain()"><i class="fas fa-shopping-bag"></i><span id="n-txt">Store</span></button>
    <button class="nav-item" id="n-profile" onclick="nav('profile')"><i class="fas fa-user-circle"></i><span>Profile</span></button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyCJ_hoMrqu0ENYS12hecTy9VD1DKQIaKFs",
        authDomain: "signing-9fc01.firebaseapp.com",
        projectId: "signing-9fc01",
        storageBucket: "signing-9fc01.firebasestorage.app",
        messagingSenderId: "926296137348",
        appId: "1:926296137348:web:c42cdf88199ba877246cd1"
    };

    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const OWNER_EMAIL = "krya.global@gmail.com";
    let currentUser = null;
    let isOwner = false;

    window.nav = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        document.getElementById('n-' + (id === 'owner' || id === 'store' ? 'main' : id)).classList.add('active');
    };

    window.openMain = () => isOwner ? nav('owner') : nav('store');

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, user => {
        if(user) {
            currentUser = user;
            isOwner = user.email === OWNER_EMAIL;
            
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('app-nav').style.display = 'flex';
            document.getElementById('role-badge').innerText = isOwner ? "OWNER" : "USER";
            document.getElementById('role-badge').style.background = isOwner ? "var(--accent)" : "var(--primary)";
            document.getElementById('n-txt').innerText = isOwner ? "Dashboard" : "Store";
            
            document.getElementById('u-name').innerText = user.displayName;
            document.getElementById('u-email').innerText = user.email;
            document.getElementById('u-img').src = user.photoURL;
            document.getElementById('user-greet').innerText = "नमस्ते, " + user.displayName.split(' ')[0] + "!";

            openMain();
            loadStore();
            if(isOwner) loadOwnerData();
        } else {
            nav('auth');
        }
    });

    // --- STORE LOGIC ---
    function loadStore() {
        onSnapshot(query(collection(db, "services"), orderBy("createdAt", "desc")), snap => {
            const list = document.getElementById('store-services');
            list.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                list.innerHTML += `
                    <div class="card">
                        <img src="${s.img}" class="service-img">
                        <div style="padding: 15px;">
                            <h4>${s.name}</h4>
                            <div class="pricing"><span class="selling-price">₹${s.price}</span></div>
                            <button class="btn btn-primary" onclick="alert('Order Feature Coming Soon')">अभी खरीदें</button>
                        </div>
                    </div>
                `;
            });
        });
    }

    // --- OWNER LOGIC ---
    window.addNewService = async () => {
        const name = document.getElementById('svc-name').value;
        const price = document.getElementById('svc-price').value;
        const img = document.getElementById('svc-img').value;
        if(!name || !price) return alert("नाम और कीमत भरें!");
        await addDoc(collection(db, "services"), { name, price, img, createdAt: serverTimestamp() });
        alert("सर्विस लाइव हो गई!");
        document.getElementById('svc-name').value = "";
    };

    function loadOwnerData() {
        onSnapshot(collection(db, "orders"), snap => {
            document.getElementById('adm-orders').innerText = snap.size;
            // Additional revenue logic here
        });
    }
</script>
</body>
</html>
